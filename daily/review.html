<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Question review · Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:#fffdf5;color:#2d2a4a}
  body{display:flex;flex-direction:column}
  #topbar{background:#2d2a4a;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  #brand{font-weight:900;font-size:17px}#brand span{color:#00e5c0}#brand small{color:#b9b6d6;font-weight:800;font-size:13px;margin-left:8px}
  #count{margin-left:auto;font-weight:800;font-size:13px;color:#b9b6d6}
  .tb{font-family:inherit;font-weight:800;font-size:13px;padding:7px 14px;border-radius:10px;border:2px solid #6c5ce7;background:transparent;color:#fff;cursor:pointer}
  .tb:hover{background:#6c5ce7}
  #mic.on{background:#EC3C78;border-color:#EC3C78}
  .dict{outline:3px solid #ff9f43!important;border-color:#ff9f43!important}
  #main{flex:1;display:grid;grid-template-columns:290px 1fr;min-height:0}
  #side{border-right:2px solid #efecff;overflow:auto;background:#faf9ff}
  #filters{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:2px solid #efecff;position:sticky;top:0;background:#faf9ff;z-index:2}
  select,input[type=text],textarea{font-family:inherit;font-size:14px;color:#2d2a4a;border:2px solid #e4e2f4;border-radius:10px;padding:8px 10px;background:#fff;width:100%}
  textarea{resize:vertical;line-height:1.45}
  select:focus,input:focus,textarea:focus{outline:none;border-color:#6c5ce7}
  .item{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid #efecff;cursor:pointer;font-size:13.5px;line-height:1.35}
  .item:hover{background:#f3f1ff}.item.sel{background:#e9e5ff;box-shadow:inset 4px 0 0 #6c5ce7}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:4px;background:#c9c6df}
  .st-approved .dot{background:#00b894}.st-needs-variant .dot{background:#ff9f43}.st-old-only .dot{background:#6c5ce7}.st-drop .dot{background:#EC3C78}
  .item b{display:block;font-size:12px;color:#7b7894;font-weight:800}
  #work{overflow:auto;padding:22px 26px;display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.2fr);gap:22px;align-content:start}
  @media(max-width:1000px){#main{grid-template-columns:1fr}#side{max-height:200px}#work{grid-template-columns:1fr}}
  .panel{background:#fff;border:2px solid #2d2a4a;border-radius:18px;padding:18px 20px;box-shadow:5px 5px 0 #e0f7f1}
  .panel h2{margin:0 0 10px;font-size:13px;letter-spacing:.06em;color:#6c5ce7;font-weight:900;text-transform:uppercase}
  #photo img{max-width:100%;border:2px solid #e4e2f4;border-radius:10px;display:block}
  .sug{margin-top:12px;background:#fff6e5;border:2px solid #ffd08a;border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.5}
  .conf{display:inline-block;font-size:11.5px;font-weight:900;padding:2px 9px;border-radius:999px;margin-bottom:6px}
  .conf.high{background:#e0f7f1;color:#00795f}.conf.check{background:#ffe6ef;color:#c2185b}
  label.l{display:block;font-size:12px;font-weight:900;color:#7b7894;margin:12px 0 5px;letter-spacing:.03em}
  .optrow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  .optrow input[type=radio]{accent-color:#00b894;width:18px;height:18px;flex-shrink:0}
  .optrow .ltr{font-weight:900;color:#6c5ce7;width:16px}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .sb{font-family:inherit;font-weight:800;font-size:13px;padding:8px 13px;border-radius:10px;border:2px solid #e4e2f4;background:#fff;cursor:pointer;color:#2d2a4a}
  .sb:hover{border-color:#6c5ce7}
  .sb.on.approved{background:#e0f7f1;border-color:#00b894}.sb.on.needs-variant{background:#fff1dc;border-color:#ff9f43}
  .sb.on.old-only{background:#efecff;border-color:#6c5ce7}.sb.on.drop{background:#ffe6ef;border-color:#EC3C78}.sb.on.unchecked{background:#eee;border-color:#999}
  .sb.pri{background:#6c5ce7;color:#fff;border-color:#6c5ce7}
  details{border:1.5px solid #e4e2f4;border-radius:10px;margin:6px 0;background:#fff}
  summary{cursor:pointer;font-weight:800;font-size:13.5px;padding:8px 12px}
  details .in{padding:2px 12px 10px}
  .area{font-size:12px;font-weight:900;color:#6c5ce7;margin:8px 0 3px}
  .tk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:2px 0;cursor:pointer}
  .tk input{accent-color:#6c5ce7;margin-top:3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{font-size:11.5px;font-weight:800;background:#f3f1ff;border:1.5px solid #e4e2f4;border-radius:999px;padding:3px 10px;color:#5346c4}
  /* student preview (matches daily page) */
  #prev{grid-column:1/-1}
  #prev .card{max-width:820px;margin:auto}
  .stem{font-size:21px;line-height:1.4;font-weight:800;margin:0 0 14px}
  .figure{display:flex;justify-content:center;margin:6px 0 16px}
  .figbox{border:2px solid #cfe9e2;border-radius:16px;padding:12px 16px;background:#fcfffe}
  .quiz-tbl{border-collapse:collapse;font-size:17px;border:2px solid #6c5ce7}
  .quiz-tbl th{background:#6c5ce7;color:#fff;padding:10px 26px;font-size:15px}
  .quiz-tbl td{padding:9px 26px;border:1px solid #e4e2f4;text-align:center;font-weight:700}
  .pop{display:flex;gap:12px;align-items:baseline;padding:11px 16px;border:2px solid #e4e2f4;border-radius:12px;margin-bottom:9px;font-size:16.5px;font-weight:600}
  .pop .ltr{font-weight:900;color:#6c5ce7}
  .pop.c{background:#e0f7f1;border-color:#00b894;color:#00795f;font-weight:700}.pop.c .ltr{color:#00b894}
  .expl{margin-top:14px;padding:14px 18px;border-radius:12px;background:#f3f1ff;border:1.5px solid #e4e2f4;font-size:15px;line-height:1.55}
  .expl.empty{color:#b7b4cc;font-style:italic}
  .small{font-size:12.5px;color:#7b7894;font-weight:700}
  #empty{padding:60px;color:#7b7894;font-weight:700;grid-column:1/-1}
</style>
</head>
<body>
<div id="topbar">
  <div id="brand">theory2<span>Econ</span><small>· Question review (teacher only)</small></div>
  <button class="tb" id="mic" title="Click into a box, then press to speak (Chrome or Edge)">🎤 Dictate</button>
  <button class="tb" id="exp-live">Export approved → bank file</button>
  <button class="tb" id="exp-all">Save backup (.json)</button>
  <button class="tb" id="imp">Load backup</button>
  <input type="file" id="impfile" accept=".json" hidden>
  <div id="count"></div>
</div>
<div id="main">
  <div id="side">
    <div id="filters">
      <select id="f-status">
        <option value="">All statuses</option>
        <option value="unchecked">Unchecked</option>
        <option value="needs-variant">Needs variant</option>
        <option value="approved">Approved (live)</option>
        <option value="old-only">Old course only</option>
        <option value="drop">Dropped</option>
      </select>
      <select id="f-course"><option value="">All courses</option></select>
      <input type="text" id="f-q" placeholder="Search question text…">
    </div>
    <div id="list"></div>
  </div>
  <div id="work"></div>
</div>

<script src="data/taxonomy.js"></script>
<script src="draft/drafts-y12.js"></script>
<script>
(function(){
  const LS='t2e.review.v1';
  const STATUS=[['unchecked','Unchecked'],['approved','Approved (live)'],['needs-variant','Needs variant'],['old-only','Old course only'],['drop','Drop']];
  const LET=['A','B','C','D'];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- state: drafts + saved edits ---------- */
  let saved={};
  try{ saved=JSON.parse(localStorage.getItem(LS)||'{}')||{}; }catch(e){ saved={}; }
  const persist=()=>{ try{ localStorage.setItem(LS,JSON.stringify(saved)); }catch(e){} };
  const base={}; (T2E.drafts||[]).forEach(q=>base[q.id]=q);
  const all=()=>{ const m={...base}; for(const k in saved){ if(saved[k]&&saved[k].deleted) delete m[k]; else m[k]=saved[k]; } return Object.values(m); };
  const get=id=>{ const s=saved[id]; if(s&&!s.deleted) return s; return base[id]; };
  function edit(id,fn){ const q=JSON.parse(JSON.stringify(get(id))); fn(q); saved[id]=q; persist(); }

  let curId=null, dictLast=null;
  const courseOf=t=>t.split('.')[0];
  const subLabel={};
  T2E.courses.forEach(c=>c.areas.forEach(a=>a.subs.forEach(s=>subLabel[c.id+'.'+a.id+'.'+s.id]=s.label)));

  T2E.courses.forEach(c=>{ const o=document.createElement('option'); o.value=c.id; o.textContent=c.label; $('f-course').appendChild(o); });

  /* ---------- list ---------- */
  function visible(){
    const fs=$('f-status').value, fc=$('f-course').value, fq=$('f-q').value.toLowerCase();
    return all().filter(q=>(!fs||q.status===fs)&&(!fc||q.topics.some(t=>courseOf(t)===fc))&&(!fq||(q.stem+q.options.join(' ')).toLowerCase().includes(fq)));
  }
  function renderList(){
    const qs=visible(), L=$('list'); L.innerHTML='';
    qs.forEach(q=>{
      const d=document.createElement('div'); d.className='item st-'+q.status+(q.id===curId?' sel':'');
      d.innerHTML='<span class="dot"></span><div><b>'+esc(q.id)+(q.derivedFrom?' · variant of '+esc(q.derivedFrom):'')+'</b>'+esc(q.stem.length>90?q.stem.slice(0,90)+'…':q.stem)+'</div>';
      d.onclick=()=>{curId=q.id;renderList();renderWork();};
      L.appendChild(d);
    });
    const a=all(), n=s=>a.filter(q=>q.status===s).length;
    $('count').textContent=a.length+' questions · '+n('approved')+' approved · '+n('needs-variant')+' need variant · '+n('unchecked')+' unchecked';
  }

  /* ---------- editor ---------- */
  function topicPicker(q){
    let h='';
    T2E.courses.forEach(c=>{
      const open=q.topics.some(t=>courseOf(t)===c.id)?' open':'';
      h+='<details'+open+'><summary>'+esc(c.label)+(c.verify?' <span class="small">(check topic list)</span>':'')+'</summary><div class="in">';
      c.areas.forEach(a=>{
        h+='<div class="area">'+esc(a.label)+'</div>';
        a.subs.forEach(s=>{
          const id=c.id+'.'+a.id+'.'+s.id;
          h+='<label class="tk"><input type="checkbox" data-topic="'+id+'"'+(q.topics.includes(id)?' checked':'')+'>'+esc(s.label)+'</label>';
        });
      });
      h+='</div></details>';
    });
    return h;
  }
  function preview(q){
    let h='<div class="stem">'+esc(q.stem)+'</div>';
    if(q.figure) h+='<div class="figure">'+q.figure+'</div>';
    q.options.forEach((o,i)=>{ h+='<div class="pop'+(i===q.correct?' c':'')+'"><span class="ltr">'+LET[i]+'</span><span>'+o+'</span></div>'; });
    h+= q.explanation ? '<div class="expl">'+q.explanation+'</div>' : '<div class="expl empty">No explanation yet — add one above.</div>';
    return h;
  }
  function renderWork(){
    const W=$('work');
    if(dictLast){ dictLast.classList.remove('dict'); dictLast=null; }
    const q=curId&&get(curId);
    if(!q){ W.innerHTML='<div id="empty">'+(all().length?'Pick a question from the list.':'No questions loaded.')+'</div>'; return; }
    const variants=all().filter(v=>v.derivedFrom===q.id).length;
    W.innerHTML=
    '<div class="panel" id="photo"><h2>Original</h2>'+
      (q.photo?'<img src="source/'+esc(q.photo)+'" alt="Original question photo" onerror="this.outerHTML=\'<div class=small>Photo not found: source/'+esc(q.photo)+'</div>\'">':'<div class="small">'+(q.derivedFrom?'Variant of '+esc(q.derivedFrom):'No photo')+'</div>')+
      (q.suggest?'<div class="sug"><span class="conf '+(q.conf==='check'?'check':'high')+'">Answer '+(q.conf==='check'?'— please check':'— confident')+'</span><br>'+esc(q.suggest)+'</div>':'')+
    '</div>'+
    '<div class="panel" id="edit"><h2>Edit · '+esc(q.id)+'</h2>'+
      '<div class="btns" id="stbtns"></div>'+
      '<label class="l">QUESTION</label><textarea id="e-stem" rows="3"></textarea>'+
      '<label class="l">OPTIONS (tick the correct one)</label><div id="e-opts"></div>'+
      '<label class="l">EXPLANATION (shown after answering)</label><textarea id="e-expl" rows="3"></textarea>'+
      '<details><summary>Figure (HTML / SVG) — advanced</summary><div class="in"><textarea id="e-fig" rows="5"></textarea></div></details>'+
      '<label class="l">TOPICS — tick every course/subtopic this question serves</label><div id="e-topics">'+topicPicker(q)+'</div>'+
      '<label class="l">NOTE TO SELF</label><textarea id="e-note" rows="2"></textarea>'+
      '<div class="btns" style="margin-top:14px"><button class="sb pri" id="mkvar">Make a variant of this question</button>'+
      (q.derivedFrom?'<button class="sb" id="delvar">Delete this variant</button>':'')+
      '<span class="small" style="align-self:center">'+(variants?variants+' variant'+(variants>1?'s':'')+' so far':'')+'</span></div>'+
    '</div>'+
    '<div class="panel" id="prev"><h2>Student view</h2><div class="card" id="prevbody"></div></div>';

    $('e-stem').value=q.stem; $('e-expl').value=q.explanation||''; $('e-fig').value=q.figure||''; $('e-note').value=q.note||'';
    const ob=$('e-opts');
    q.options.forEach((o,i)=>{
      const r=document.createElement('div'); r.className='optrow';
      r.innerHTML='<input type="radio" name="cor" '+(i===q.correct?'checked':'')+'><span class="ltr">'+LET[i]+'</span><input type="text">';
      r.querySelector('input[type=text]').value=o;
      r.querySelector('input[type=radio]').onchange=()=>{edit(q.id,x=>x.correct=i);refreshPrev();};
      r.querySelector('input[type=text]').oninput=e=>{edit(q.id,x=>x.options[i]=e.target.value);refreshPrev();};
      ob.appendChild(r);
    });
    const sb=$('stbtns');
    STATUS.forEach(([v,l])=>{ const b=document.createElement('button'); b.className='sb '+v+(q.status===v?' on':''); b.textContent=l;
      b.onclick=()=>{edit(q.id,x=>x.status=v);renderList();renderWork();}; sb.appendChild(b); });
    $('e-stem').oninput=e=>{edit(q.id,x=>x.stem=e.target.value);refreshPrev();renderListSoft();};
    $('e-expl').oninput=e=>{edit(q.id,x=>x.explanation=e.target.value);refreshPrev();};
    $('e-fig').oninput=e=>{edit(q.id,x=>x.figure=e.target.value);refreshPrev();};
    $('e-note').oninput=e=>edit(q.id,x=>x.note=e.target.value);
    W.querySelectorAll('[data-topic]').forEach(cb=>cb.onchange=()=>{
      edit(q.id,x=>{ const t=cb.dataset.topic; x.topics=x.topics.filter(y=>y!==t); if(cb.checked) x.topics.push(t); });
    });
    $('mkvar').onclick=()=>makeVariant(q.id);
    if($('delvar')) $('delvar').onclick=()=>{ if(!confirm('Delete this variant?')) return; saved[q.id]={deleted:true}; persist(); curId=q.derivedFrom; renderList(); renderWork(); };
    refreshPrev();
  }
  function refreshPrev(){ const q=get(curId); if(q&&$('prevbody')) $('prevbody').innerHTML=preview(q); }
  let softT; function renderListSoft(){ clearTimeout(softT); softT=setTimeout(renderList,300); }

  function makeVariant(id){
    const q=JSON.parse(JSON.stringify(get(id)));
    const root=q.derivedFrom||q.id;
    let n=1; while(get(root+'-v'+n)||(saved[root+'-v'+n])) n++;
    const v={...q,id:root+'-v'+n,derivedFrom:root,status:'unchecked',suggest:'',conf:'',note:'Variant of '+root+' — change the numbers/scenario and the answer.',photo:q.photo};
    saved[v.id]=v; persist(); curId=v.id; renderList(); renderWork();
  }

  /* ---------- export / import ---------- */
  function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
  $('exp-all').onclick=()=>download('t2e-review-backup.json',JSON.stringify(all(),null,1),'application/json');
  $('exp-live').onclick=()=>{
    const live=all().filter(q=>q.status==='approved').map(q=>({id:q.id,topics:q.topics,stem:q.stem,figure:q.figure||undefined,options:q.options,correct:q.correct,explanation:q.explanation,derivedFrom:q.derivedFrom||undefined}));
    if(!live.length){ alert('No approved questions yet.'); return; }
    const txt='/* Approved questions exported from review.html */\nwindow.T2E = window.T2E || {};\n(T2E.bank = T2E.bank || []).push(\n'+live.map(q=>JSON.stringify(q,null,1)).join(',\n')+'\n);\n';
    download('bank-y12-approved.js',txt,'text/javascript');
  };
  $('imp').onclick=()=>$('impfile').click();
  $('impfile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    f.text().then(t=>{ try{ JSON.parse(t).forEach(q=>saved[q.id]=q); persist(); renderList(); renderWork(); }catch(x){ alert('Could not read that file.'); } });
  };


  /* ---------- dictation (browser speech recognition: Chrome / Edge) ---------- */
  (function(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=$('mic');
    let rec=null;
    const isF=el=>el&&el.matches&&el.matches('#edit textarea, #edit input[type=text]');
    document.addEventListener('focusin',e=>{ if(isF(e.target)){ if(dictLast) dictLast.classList.remove('dict'); dictLast=e.target; if(rec) dictLast.classList.add('dict'); } });
    function stop(){ const r=rec; rec=null; if(r){ try{r.stop();}catch(x){} } mic.classList.remove('on'); mic.textContent='🎤 Dictate'; if(dictLast) dictLast.classList.remove('dict'); }
    mic.onclick=()=>{
      if(!SR){ alert('Dictation needs Chrome or Edge.'); return; }
      if(rec){ stop(); return; }
      if(!dictLast){ alert('Click into a box first (question, an option, or the explanation), then press Dictate.'); return; }
      rec=new SR(); rec.lang='en-AU'; rec.continuous=true; rec.interimResults=false;
      rec.onresult=e=>{
        for(let i=e.resultIndex;i<e.results.length;i++){
          if(!e.results[i].isFinal||!dictLast) continue;
          let t=e.results[i][0].transcript.trim(); if(!t) continue;
          const v=dictLast.value;
          if(!v) t=t.charAt(0).toUpperCase()+t.slice(1);
          dictLast.value=v+(v&&!/\s$/.test(v)?' ':'')+t;
          dictLast.dispatchEvent(new Event('input',{bubbles:true}));
        }
      };
      rec.onend=()=>{ if(rec){ try{rec.start();}catch(x){} } };
      rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ stop(); alert('The browser blocked the microphone. Allow it in the address bar and try again.'); } };
      rec.start(); mic.classList.add('on'); mic.textContent='● Listening — click to stop'; dictLast.classList.add('dict');
    };
  })();

  ['f-status','f-course'].forEach(i=>$(i).onchange=renderList); $('f-q').oninput=renderList;
  const first=all()[0]; if(first) curId=first.id;
  renderList(); renderWork();
})();
</script>
</body>
</html>
