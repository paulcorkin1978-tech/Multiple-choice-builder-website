<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily question — style preview · Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:#fffdf5;color:#2d2a4a}
  body{display:flex;flex-direction:column}
  #topbar{background:#2d2a4a;color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  #brand{font-weight:900;font-size:18px;letter-spacing:.02em}
  #brand span{color:#00e5c0}
  #brand small{color:#b9b6d6;font-weight:800;font-size:13px;margin-left:8px}
  .chip{background:#6c5ce7;color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px}
  #progline{height:3px;background:#efecff}
  #progfill{height:3px;background:#ff9f43;width:50%;transition:width .3s}
  #wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px}
  #card{width:100%;max-width:820px;background:#fff;border:2.5px solid #2d2a4a;border-radius:24px;box-shadow:8px 8px 0 #e0f7f1;padding:38px 46px}
  .meta{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .qnum{font-size:13px;color:#6c5ce7;font-weight:900;letter-spacing:.03em}
  .daychip{font-size:12px;font-weight:800;color:#7b7894;background:#f3f1ff;border:1.5px solid #e4e2f4;border-radius:999px;padding:4px 11px}
  h1{font-size:27px;line-height:1.35;font-weight:800;margin:0 0 26px}
  .opts{display:flex;flex-direction:column;gap:13px}
  .abtn{font-family:inherit;font-size:18px;font-weight:600;padding:15px 19px;border:2px solid #e4e2f4;border-radius:14px;background:#fff;cursor:pointer;text-align:left;color:#2d2a4a;transition:all .15s;box-shadow:0 2px 0 #e4e2f4;display:flex;gap:14px;align-items:baseline}
  .abtn .ltr{font-weight:900;color:#6c5ce7;flex-shrink:0}
  .abtn:hover:not(.done){border-color:#6c5ce7;background:#f7f5ff;box-shadow:0 2px 0 #cfc8f5}
  .abtn.wrong{background:#ffe6ef;border-color:#EC3C78;color:#c2185b;font-weight:700;box-shadow:none}
  .abtn.wrong .ltr{color:#EC3C78}
  .abtn.correct{background:#e0f7f1;border-color:#00b894;color:#00795f;font-weight:700;box-shadow:none}
  .abtn.correct .ltr{color:#00b894}
  .abtn.done{cursor:default}
  #expl{margin-top:24px;padding:18px 22px;border-radius:14px;background:#f3f1ff;border:1.5px solid #e4e2f4;font-size:16.5px;line-height:1.55;color:#3d3960;display:none}
  #expl.show{display:block}
  #expl b{color:#00795f}
  #foot{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;border-top:1px solid #efecff;background:#fffdf5}
  .nbtn{font-family:inherit;font-size:15px;font-weight:800;padding:11px 26px;border-radius:12px;cursor:pointer;border:2px solid #e4e2f4;background:transparent;color:#7b7894;transition:all .15s}
  .nbtn:hover:not(:disabled){background:#efecff;border-color:#6c5ce7;color:#2d2a4a}
  .nbtn:disabled{opacity:.4;cursor:default}
  .nbtn.pri{background:#6c5ce7;color:#fff;border-color:#6c5ce7;box-shadow:0 3px 0 #5346c4}
  .nbtn.pri:hover:not(:disabled){background:#5b4bd5;border-color:#5b4bd5}
  #note{text-align:center;color:#b7b4cc;font-size:12.5px;font-weight:700;padding:6px}
</style>
</head>
<body>
  <div id="topbar">
    <div id="brand">theory2<span>Econ</span><small>· Question of the day</small></div>
    <div class="chip" id="topic">Introduction to Economics</div>
  </div>
  <div id="progline"><div id="progfill"></div></div>

  <div id="wrap">
    <div id="card">
      <div class="meta"><span class="qnum" id="qnum">QUESTION 1</span><span class="daychip" id="day">Term 1 · Week 1 · Day 1</span></div>
      <h1 id="stem"></h1>
      <div class="opts" id="opts"></div>
      <div id="expl"></div>
    </div>
  </div>

  <div id="foot">
    <button class="nbtn" id="prev">◀ Back</button>
    <span id="note">Preview — 2 of your questions, digitised. Click an answer.</span>
    <button class="nbtn pri" id="next">Next ▶</button>
  </div>

<script>
  const QS = [
    { topic:'Introduction to Economics', day:'Term 1 · Week 1 · Day 1', n:1,
      stem:'The cause of the economic problem is which of the following?',
      opts:[
        'Needs and wants are limited',
        'Resources enable us to satisfy all wants',
        'The supply of resources is infinite in relation to the wants of individuals',
        'Scarcity'],
      correct:3,
      expl:'The economic problem exists because our wants are unlimited while resources are scarce, which forces us to choose. Options A, B and C each describe the <i>absence</i> of scarcity, so <b>D — scarcity</b> is the cause.' },

    { topic:'Markets', day:'Term 1 · Week 2 · Day 4', n:9,
      stem:'Which of the following is true of the factor market in the circular flow of income?',
      opts:[
        'Businesses are the sellers and households are the buyers',
        'Households are the sellers and businesses are the buyers',
        'Businesses and households are both sellers',
        'Neither businesses nor households are sellers'],
      correct:1,
      expl:'In the <b>factor market</b>, households sell their factors of production — land, labour, capital and enterprise — and businesses buy them to produce goods and services. The roles only reverse in the product market. So the answer is <b>B</b>.' },
  ];
  const LET = ['A','B','C','D'];
  let i = 0, locked = [];

  const $ = id => document.getElementById(id);
  function load(k){
    i = (k + QS.length) % QS.length;
    const q = QS[i];
    $('topic').textContent = q.topic;
    $('qnum').textContent = 'QUESTION ' + q.n;
    $('day').textContent = q.day;
    $('stem').textContent = q.stem;
    $('progfill').style.width = ((i+1)/QS.length*100) + '%';
    const o = $('opts'); o.innerHTML = '';
    q.opts.forEach((txt,idx)=>{
      const b = document.createElement('button');
      b.className = 'abtn';
      b.innerHTML = '<span class="ltr">'+LET[idx]+'</span><span>'+txt+'</span>';
      b.onclick = ()=>choose(idx);
      o.appendChild(b);
    });
    const ex = $('expl'); ex.className=''; ex.innerHTML='';
    if(locked[i]!==undefined) reveal(locked[i]);
    $('prev').disabled = (i===0);
    $('next').disabled = (i===QS.length-1);
  }
  function choose(idx){ if(locked[i]!==undefined) return; locked[i]=idx; reveal(idx); }
  function reveal(picked){
    const q = QS[i], btns = $('opts').children;
    for(let j=0;j<btns.length;j++){
      btns[j].classList.add('done');
      if(j===q.correct) btns[j].classList.add('correct');
      else if(j===picked) btns[j].classList.add('wrong');
    }
    const ex = $('expl'); ex.innerHTML = q.expl; ex.className='show';
  }
  $('prev').onclick = ()=>load(i-1);
  $('next').onclick = ()=>load(i+1);
  load(0);
</script>
</body>
</html>
