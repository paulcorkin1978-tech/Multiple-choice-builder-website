<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Protection — draw the area (prototype) · Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05050c;font-family:'Nunito',sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;touch-action:none}
  .draw-area{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2760%27%20height%3D%2760%27%20viewBox%3D%270%200%2032%2032%27%3E%3Cg%20transform%3D%27rotate%2840%2016%2016%29%27%20stroke%3D%27%232b2b2b%27%20stroke-width%3D%271.4%27%20stroke-linejoin%3D%27round%27%3E%3Crect%20x%3D%2712%27%20y%3D%273%27%20width%3D%278%27%20height%3D%275%27%20rx%3D%271.5%27%20fill%3D%27%23ff9bb0%27%2F%3E%3Crect%20x%3D%2712%27%20y%3D%277.5%27%20width%3D%278%27%20height%3D%272.2%27%20fill%3D%27%23dfe3e6%27%2F%3E%3Crect%20x%3D%2712%27%20y%3D%279.5%27%20width%3D%278%27%20height%3D%2712.5%27%20fill%3D%27%23ffd23f%27%2F%3E%3Cpolygon%20points%3D%2712%2C22%2020%2C22%2016%2C29%27%20fill%3D%27%23f2c078%27%2F%3E%3Cpolygon%20points%3D%2714.6%2C25.6%2017.4%2C25.6%2016%2C29%27%20fill%3D%27%23333%27%20stroke%3D%27none%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 14 48, crosshair}
  #draw{transition:x .18s ease,y .18s ease,width .18s ease,height .18s ease;transform-box:fill-box;transform-origin:center}
  @keyframes boxSnap{0%{transform:scale(1.09) rotate(1.7deg)}26%{transform:scale(.95) rotate(-1.4deg)}48%{transform:scale(1.045) rotate(.8deg)}70%{transform:scale(.985) rotate(-.4deg)}100%{transform:scale(1) rotate(0)}}
  #draw.snap{animation:boxSnap .6s ease-out both}
  .btn{cursor:pointer}
  .btn rect{transition:fill .15s}
  .btn:hover rect.bg{fill:#20204a}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vig" cx="40%" cy="45%" r="78%">
      <stop offset="0%" stop-color="#0b0b1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="2000" height="1160">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#00e5c0" fill-opacity="0.10"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#00e5c0" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#05050c"/>
  <g id="grid" stroke="#15152c" stroke-width="1.5"></g>

  <!-- axes -->
  <line x1="240" y1="110" x2="240" y2="820" stroke="#8a8ac0" stroke-width="3"/>
  <line x1="240" y1="820" x2="1250" y2="820" stroke="#8a8ac0" stroke-width="3"/>
  <text x="150" y="465" fill="#b8b8dc" font-size="26" font-weight="800" text-anchor="middle"
        transform="rotate(-90 150 465)">Price ($ per unit)</text>
  <text x="745" y="892" fill="#b8b8dc" font-size="26" font-weight="800" text-anchor="middle">Quantity (units)</text>
  <g id="ticks"></g>

  <!-- fixed supply & demand (same market throughout) -->
  <path id="sCurve" d="M240 820 L840 124" stroke="#00e5c0" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <text id="sLab" x="852" y="128" fill="#00e5c0" font-size="30" font-weight="900">S</text>
  <path id="dCurve" d="M640 124 L1240 820" stroke="#ff5c8a" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <text x="1252" y="812" fill="#ff5c8a" font-size="30" font-weight="900">D</text>

  <!-- shifted supply (subsidy questions only): P = Q - 3 -> from (3,0) to (15,12) -->
  <g id="shiftG" opacity="0">
    <path d="M390 820 L990 124" stroke="#00e5c0" stroke-width="5" fill="none" stroke-linecap="round"
          stroke-dasharray="12 9" filter="url(#glow)"/>
    <text x="1002" y="128" fill="#00e5c0" font-size="24" font-weight="800">S + subsidy</text>
  </g>

  <!-- variable price lines -->
  <g id="plines"></g>

  <!-- target box (revealed on Show answer / correct) -->
  <rect id="target" x="0" y="0" width="0" height="0" fill="url(#hatch)"
        stroke="#00e5c0" stroke-width="4" stroke-dasharray="10 8" opacity="0"/>

  <!-- student's rubber-band box -->
  <rect id="draw" x="0" y="0" width="0" height="0" fill="#e8e8ff" fill-opacity="0.12"
        stroke="#e8e8ff" stroke-width="4" opacity="0"/>

  <!-- capture surface over the plot -->
  <rect id="area" class="draw-area" x="240" y="110" width="1010" height="710"
        fill="transparent" pointer-events="all"/>

  <!-- ══ right-hand panel ══ -->
  <text id="score" x="1330" y="70" fill="#8a8ac0" font-size="26" font-weight="800">Score 0 / 0</text>
  <text id="prog"  x="1890" y="70" fill="#8a8ac0" font-size="26" font-weight="800" text-anchor="end">1 / 10</text>

  <text id="title" x="1600" y="180" fill="#8a8ac0" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="1">SUGAR · FREE TRADE</text>
  <text x="1600" y="272" fill="#e8e8ff" font-size="34" font-weight="800" text-anchor="middle">Draw the box for</text>
  <text id="qName" x="1600" y="332" fill="#00e5c0" font-size="40" font-weight="900" text-anchor="middle">domestic producer revenue</text>
  <text id="qSub"  x="1600" y="388" fill="#8a8ac0" font-size="26" font-weight="700" text-anchor="middle">at the world price</text>

  <text id="fb"  x="1600" y="560" fill="#e8e8ff" font-size="50" font-weight="900" text-anchor="middle" opacity="0"></text>
  <text id="fb2" x="1600" y="622" fill="#8a8ac0" font-size="30" font-weight="800" text-anchor="middle" opacity="0"></text>

  <!-- controls -->
  <g id="snapBtn" class="btn">
    <rect class="bg" x="1330" y="700" width="360" height="60" rx="12" fill="#12122a" stroke="#3a3a68" stroke-width="2"/>
    <rect id="snapDot" x="1348" y="716" width="28" height="28" rx="6" fill="#00e5c0"/>
    <text x="1392" y="738" fill="#e8e8ff" font-size="25" font-weight="800">Snap to grid: ON</text>
  </g>
  <g id="ansBtn" class="btn">
    <rect class="bg" x="1710" y="700" width="180" height="60" rx="12" fill="#12122a" stroke="#3a3a68" stroke-width="2"/>
    <text x="1800" y="738" fill="#ffd43b" font-size="24" font-weight="800" text-anchor="middle">Show answer</text>
  </g>
  <g id="resetBtn" class="btn">
    <rect class="bg" x="1330" y="778" width="180" height="60" rx="12" fill="#12122a" stroke="#3a3a68" stroke-width="2"/>
    <text x="1420" y="816" fill="#e8e8ff" font-size="24" font-weight="800" text-anchor="middle">Reset</text>
  </g>

  <g id="prevBtn" class="btn">
    <rect class="bg" x="1330" y="878" width="260" height="66" rx="12" fill="#12122a" stroke="#3a3a68" stroke-width="2"/>
    <text x="1460" y="920" fill="#e8e8ff" font-size="26" font-weight="900" text-anchor="middle">◀  Back</text>
  </g>
  <g id="nextBtn" class="btn">
    <rect class="bg" x="1630" y="878" width="260" height="66" rx="12" fill="#12122a" stroke="#3a3a68" stroke-width="2"/>
    <text x="1760" y="920" fill="#e8e8ff" font-size="26" font-weight="900" text-anchor="middle">Next  ▶</text>
  </g>

  <text x="745" y="66" fill="#4a4a70" font-size="22" font-weight="700" text-anchor="middle">Click and drag on the graph to draw a rectangle · release to check</text>

  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>

<script>
  const svg = document.getElementById('svg');
  // origin + pixels per unit.  Q: 0..20 across 1000px (50/unit).  P: 0..12 across 696px (58/unit).
  const OX = 240, OY = 820, SX = 50, SY = 58, QMAX = 20, PMAX = 12;
  const gx = q => OX + q * SX;
  const gy = p => OY - p * SY;
  const ACCEPT = 0.70;
  let snap = true, drawing = false, sx0, sy0;

  // gridlines every 2 units, ticks every 2, snapping is per 1 unit
  let g = '';
  for (let q = 0; q <= QMAX; q += 2) g += `<line x1="${gx(q)}" y1="110" x2="${gx(q)}" y2="820"/>`;
  for (let p = 0; p <= PMAX; p += 2) g += `<line x1="240" y1="${gy(p)}" x2="1250" y2="${gy(p)}"/>`;
  document.getElementById('grid').innerHTML = g;
  let tk = '';
  for (let q = 0; q <= QMAX; q += 2) tk += `<text x="${gx(q)}" y="856" fill="#8a8ac0" font-size="22" font-weight="700" text-anchor="middle">${q}</text>`;
  for (let p = 0; p <= PMAX; p += 2) tk += `<text x="222" y="${gy(p)+7}" fill="#8a8ac0" font-size="22" font-weight="700" text-anchor="end">$${p}</text>`;
  document.getElementById('ticks').innerHTML = tk;

  // ══ the ten questions ══ (same market: supply P=Q, demand P=20-Q)
  // target is in graph units {q0,q1,p0,p1}; lines are horizontal price markers
  const Y = '#ffd43b', O = '#ff8c42', G = '#00e5c0', W = '#e8e8ff', P = '#ff5c8a';
  const QS = [
    { title:'SUGAR · FREE TRADE', name:'domestic producer revenue', sub:'at the world price', col:G,
      lines:[{p:5,label:'World price  $5',c:Y,dash:1}], target:{q0:0,q1:5,p0:0,p1:5}, val:'$5 × 5 = $25' },

    { title:'RICE · FREE TRADE', name:'foreign producer revenue', sub:'the imported quantity, at the world price', col:Y,
      lines:[{p:5,label:'World price  $5',c:Y,dash:1}], target:{q0:5,q1:15,p0:0,p1:5}, val:'$5 × 10 = $50' },

    { title:'CHEESE · FREE TRADE', name:'total consumer spending', sub:'price × total quantity bought', col:W,
      lines:[{p:6,label:'World price  $6',c:Y,dash:1}], target:{q0:0,q1:14,p0:0,p1:6}, val:'$6 × 14 = $84' },

    { title:'STEEL · $4 TARIFF', name:'domestic producer revenue', sub:'after the tariff', col:G,
      lines:[{p:4,label:'World price  $4',c:Y,dash:1},{p:8,label:'Price + tariff  $8',c:O}],
      target:{q0:0,q1:8,p0:0,p1:8}, val:'$8 × 8 = $64' },

    { title:'STEEL · $4 TARIFF', name:'government tariff revenue', sub:'the tariff × the imported quantity', col:O,
      lines:[{p:4,label:'World price  $4',c:Y,dash:1},{p:8,label:'Price + tariff  $8',c:O}],
      target:{q0:8,q1:12,p0:4,p1:8}, val:'$4 tariff × 4 imports = $16' },

    { title:'STEEL · $4 TARIFF', name:'total consumer spending', sub:'after the tariff', col:W,
      lines:[{p:4,label:'World price  $4',c:Y,dash:1},{p:8,label:'Price + tariff  $8',c:O}],
      target:{q0:0,q1:12,p0:0,p1:8}, val:'$8 × 12 = $96' },

    { title:'MILK · $3 SUBSIDY', name:'cost of the subsidy', sub:'the subsidy × domestic output', col:O, shift:1,
      lines:[{p:5,label:'Market price  $5',c:Y,dash:1},{p:8,label:'Price to producers  $8',c:G}],
      target:{q0:0,q1:8,p0:5,p1:8}, val:'$3 subsidy × 8 output = $24' },

    { title:'MILK · $3 SUBSIDY', name:'domestic producer sales revenue', sub:'from buyers, at the market price', col:G, shift:1,
      lines:[{p:5,label:'Market price  $5',c:Y,dash:1},{p:8,label:'Price to producers  $8',c:G}],
      target:{q0:0,q1:8,p0:0,p1:5}, val:'$5 × 8 = $40' },

    { title:'CARS · IMPORT QUOTA', name:'domestic producer revenue', sub:'after the quota', col:G,
      lines:[{p:6,label:'World price  $6',c:Y,dash:1},{p:7,label:'Quota price  $7',c:O}],
      target:{q0:0,q1:7,p0:0,p1:7}, val:'$7 × 7 = $49' },

    { title:'CARS · IMPORT QUOTA', name:'foreign producer revenue', sub:'the quota imports, at the quota price', col:Y,
      lines:[{p:6,label:'World price  $6',c:Y,dash:1},{p:7,label:'Quota price  $7',c:O}],
      target:{q0:7,q1:13,p0:0,p1:7}, val:'$7 × 6 = $42' },
  ];

  const el = id => document.getElementById(id);
  const draw = el('draw'), targetEl = el('target'), fb = el('fb'), fb2 = el('fb2');
  let idx = 0, answered = [], correct = 0, T = null;   // T = current target in px

  function loadQ(i) {
    idx = (i + QS.length) % QS.length;
    const q = QS[idx];
    el('title').textContent = q.title;
    el('qName').textContent = q.name; el('qName').setAttribute('fill', q.col);
    el('qSub').textContent = q.sub;
    el('prog').textContent = (idx + 1) + ' / ' + QS.length;

    // price lines
    let pl = '';
    q.lines.forEach(L => {
      pl += `<line x1="240" y1="${gy(L.p)}" x2="1200" y2="${gy(L.p)}" stroke="${L.c}" stroke-width="5"`
          + (L.dash ? ' stroke-dasharray="2 14"' : '') + ` stroke-linecap="round" filter="url(#glow)"/>`;
      pl += `<text x="1206" y="${gy(L.p)+8}" fill="${L.c}" font-size="24" font-weight="800">${L.label}</text>`;
    });
    el('plines').innerHTML = pl;
    el('shiftG').setAttribute('opacity', q.shift ? 1 : 0);

    // target rect (px)
    const t = q.target;
    T = { x: gx(t.q0), y: gy(t.p1), w: gx(t.q1) - gx(t.q0), h: gy(t.p0) - gy(t.p1) };
    targetEl.setAttribute('x', T.x); targetEl.setAttribute('y', T.y);
    targetEl.setAttribute('width', T.w); targetEl.setAttribute('height', T.h);
    targetEl.setAttribute('stroke', q.col);
    targetEl.setAttribute('opacity', 0);

    draw.classList.remove('snap'); draw.setAttribute('opacity', 0);
    fb.setAttribute('opacity', 0); fb2.setAttribute('opacity', 0);
  }

  function toSvg(evt) {
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: p.x, y: p.y };
  }
  const clampPlot = (x, y) => ({ x: Math.max(gx(0), Math.min(gx(QMAX), x)),
                                 y: Math.max(gy(PMAX), Math.min(gy(0), y)) });
  function maybeSnap(x, y) {
    if (!snap) return { x, y };
    const q = Math.round((x - OX) / SX), p = Math.round((OY - y) / SY);
    return { x: gx(q), y: gy(p) };
  }
  function iou(a, b) {
    const ix = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
    const iy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    const inter = ix * iy, uni = a.w * a.h + b.w * b.h - inter;
    return uni <= 0 ? 0 : inter / uni;
  }

  const area = el('area');
  area.addEventListener('pointerdown', e => {
    e.preventDefault(); area.setPointerCapture(e.pointerId);
    fb.setAttribute('opacity', 0); fb2.setAttribute('opacity', 0);
    let s = clampPlot(...Object.values(toSvg(e))); s = maybeSnap(s.x, s.y);
    sx0 = s.x; sy0 = s.y; drawing = true;
    draw.classList.remove('snap');
    draw.setAttribute('opacity', 1);
    draw.setAttribute('fill', '#e8e8ff'); draw.setAttribute('stroke', '#e8e8ff'); draw.setAttribute('fill-opacity', 0.12);
    update(s.x, s.y);
  });
  area.addEventListener('pointermove', e => {
    if (!drawing) return;
    let s = clampPlot(...Object.values(toSvg(e))); s = maybeSnap(s.x, s.y);
    update(s.x, s.y);
  });
  area.addEventListener('pointerup', () => { if (!drawing) return; drawing = false; grade(); });
  function update(x, y) {
    draw.setAttribute('x', Math.min(sx0, x)); draw.setAttribute('y', Math.min(sy0, y));
    draw.setAttribute('width', Math.abs(x - sx0)); draw.setAttribute('height', Math.abs(y - sy0));
  }
  function grade() {
    const r = { x:+draw.getAttribute('x'), y:+draw.getAttribute('y'), w:+draw.getAttribute('width'), h:+draw.getAttribute('height') };
    if (r.w < 8 || r.h < 8) return;
    const score = iou(r, T), pct = Math.round(score * 100), ok = score >= ACCEPT;
    const col = ok ? '#00e5c0' : '#ff5c8a';
    draw.setAttribute('fill', col); draw.setAttribute('stroke', col); draw.setAttribute('fill-opacity', 0.18);
    if (ok) {
      draw.setAttribute('x', T.x); draw.setAttribute('y', T.y);
      draw.setAttribute('width', T.w); draw.setAttribute('height', T.h);
      draw.classList.remove('snap'); draw.getBoundingClientRect(); draw.classList.add('snap');
      if (!answered[idx]) { correct++; answered[idx] = true; updateScore(); }
    }
    fb.textContent = ok ? '✓ Correct!' : 'Not quite — try again';
    fb.setAttribute('fill', col); fb.setAttribute('opacity', 1);
    fb2.textContent = ok ? QS[idx].val + '   (match ' + pct + '%)'
                         : 'match ' + pct + '%  ·  need ' + Math.round(ACCEPT * 100) + '%';
    fb2.setAttribute('opacity', 1);
  }
  function updateScore() { el('score').textContent = 'Score ' + correct + ' / ' + QS.length; }

  el('snapBtn').addEventListener('click', () => {
    snap = !snap;
    document.querySelector('#snapBtn text').textContent = 'Snap to grid: ' + (snap ? 'ON' : 'OFF');
    el('snapDot').setAttribute('fill', snap ? '#00e5c0' : '#333');
  });
  el('resetBtn').addEventListener('click', () => {
    draw.classList.remove('snap'); draw.setAttribute('opacity', 0); targetEl.setAttribute('opacity', 0);
    fb.setAttribute('opacity', 0); fb2.setAttribute('opacity', 0);
  });
  el('ansBtn').addEventListener('click', () => {
    targetEl.setAttribute('opacity', 1);
    fb.textContent = 'Answer'; fb.setAttribute('fill', '#ffd43b'); fb.setAttribute('opacity', 1);
    fb2.textContent = QS[idx].val; fb2.setAttribute('opacity', 1);
  });
  el('nextBtn').addEventListener('click', () => loadQ(idx + 1));
  el('prevBtn').addEventListener('click', () => loadQ(idx - 1));
  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowRight') loadQ(idx + 1);
    else if (e.code === 'ArrowLeft') loadQ(idx - 1);
  });

  updateScore();
  loadQ(0);
</script>
</body>
</html>
