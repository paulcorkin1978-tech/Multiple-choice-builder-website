<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Economics Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;background:#fffdf5;height:100vh;height:100dvh;overflow:hidden;color:#2d2a4a;display:flex;flex-direction:column}
#topbar{background:#2d2a4a;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#brand{display:flex;align-items:center}
#brand svg{height:19px;width:auto;display:block}
#progline{height:3px;background:#3d3960;flex-shrink:0}
#progfill{height:3px;background:#ff9f43;width:0%;transition:width .3s}
#app{display:flex;flex:1;min-height:0}
#diag-panel{flex:1.2;background:#fff;border-right:1px solid #efecff;display:flex;align-items:center;justify-content:center;padding:32px;overflow:hidden}
#diagWrap{width:100%}
#diagWrap svg{width:100%;max-height:86dvh;display:block}
#q-panel{flex:1;display:flex;flex-direction:column;padding:36px 32px;padding-bottom:max(36px,env(safe-area-inset-bottom));gap:18px;min-width:280px;overflow-y:auto}
.qnum{font-size:12px;color:#6c5ce7;letter-spacing:.02em;font-weight:800}
.qtext{font-size:19px;line-height:1.6;font-weight:800;color:#2d2a4a}
.abtns{display:flex;flex-direction:column;gap:10px}
.abtn{font-family:inherit;font-size:18px;font-weight:600;padding:15px 19px;border:2px solid #e4e2f4;border-radius:14px;background:#fff;cursor:pointer;text-align:left;color:#2d2a4a;transition:all .15s;line-height:1.5;box-shadow:0 2px 0 #e4e2f4}
.abtn:hover{border-color:#6c5ce7;background:#f7f5ff;box-shadow:0 2px 0 #cfc8f5}
.abtn.wrong{background:#ffe6ef;border-color:#EC3C78;color:#c2185b;pointer-events:none;font-weight:700;box-shadow:none}
.abtn.correct{background:#e0f7f1;border-color:#00b894;color:#00795f;font-weight:700;pointer-events:none;box-shadow:none}
.abtn.used{pointer-events:none;opacity:0.5}
.fb{font-size:14px;font-weight:800;min-height:20px}
.fb.c{color:#00997e}.fb.w{color:#c2185b}
.fb-exp{display:block;margin-top:6px;font-weight:500;font-size:13px;line-height:1.45;color:#4a4766}
.nav{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:16px;border-top:2px dashed #e4e2f4;flex-shrink:0}
.nbtn{font-family:inherit;font-size:14px;font-weight:700;padding:10px 22px;border-radius:12px;cursor:pointer;border:2px solid #e4e2f4;background:transparent;color:#7b7894;transition:all .15s;white-space:nowrap}
.nbtn:hover:not(:disabled){background:#efecff;border-color:#6c5ce7;color:#2d2a4a}
.nbtn:disabled{opacity:0.3;cursor:not-allowed}
.nbtn.pri{background:#6c5ce7;color:#fff;border-color:#6c5ce7;font-weight:800;box-shadow:0 3px 0 #5346c4}
.nbtn.pri:hover:not(:disabled){background:#5b4bd5;border-color:#5b4bd5}
#replayBtn{font-family:inherit;font-size:16px;font-weight:700;padding:10px 14px;border-radius:12px;cursor:pointer;border:2px solid #e4e2f4;background:#fff;color:#7b7894;transition:all .15s;white-space:nowrap}
#replayBtn:hover{background:#efecff;border-color:#6c5ce7;color:#2d2a4a}
#revealBtn{font-family:inherit;font-size:13px;font-weight:800;padding:10px 16px;border-radius:12px;cursor:pointer;border:2px solid #ff9f43;background:#fff1e0;color:#c96f00;transition:all .15s;white-space:nowrap}
#revealBtn:hover{background:#ffd6a3;border-color:#e08528;color:#9a5f00}
.prog{font-size:12px;color:#7b7894;font-weight:700;flex:1;text-align:center;line-height:1.5}
#score-screen{display:none;position:fixed;inset:0;background:rgba(255,253,245,0.97);align-items:center;justify-content:center;flex-direction:column;gap:24px}
#score-screen.show{display:flex}
.sbox{background:#fff;border:3px solid #2d2a4a;border-radius:24px;padding:52px 72px;text-align:center;box-shadow:8px 8px 0 #e0f7f1}
.sbox h2{font-size:22px;font-weight:900;margin-bottom:6px}
.snum{font-size:56px;font-weight:900;color:#6c5ce7;margin:16px 0 8px}
.sbox p{font-size:14px;color:#7b7894;font-weight:700}
.rbtn{font-family:inherit;font-size:13px;font-weight:900;padding:12px 32px;background:#00b894;color:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #00997e;transition:all .15s}
.rbtn:hover{transform:translateY(2px);box-shadow:0 2px 0 #00997e}
.quiz-tbl-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px;width:100%}
.quiz-tbl-title{font-size:20px;font-weight:900;color:#2d2a4a;text-align:center}
.quiz-tbl{border-collapse:collapse;font-size:18px;font-family:'Verdana',sans-serif;border:2px solid #6c5ce7;border-radius:8px}
.quiz-tbl th{background:#6c5ce7;color:#fff;padding:14px 28px;font-size:17px;font-weight:600;text-align:center}
.quiz-tbl td{padding:13px 28px;border:1px solid #e4e2f4;text-align:center;color:#2d2a4a;background:#fff}
.quiz-tbl tbody tr:nth-child(even) td{background:#fbfaff}
#app.plain-q #diag-panel{display:none}
#app.plain-q #q-panel{max-width:700px;margin:0 auto;flex:none;width:100%}
@media (max-width:680px) and (orientation:portrait){
  #app{flex-direction:column}
  #diag-panel{flex:none;height:42dvh;border-right:none;border-bottom:2px solid #e4e2f4;padding:10px;justify-content:center}
  #diagWrap svg{max-height:40dvh}
  #q-panel{flex:1;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));gap:6px;min-width:0;overflow-y:auto}
  .qtext{font-size:14px;line-height:1.5}
  .abtn{font-size:14px;padding:10px 14px}
  .abtns{gap:6px}
  .fb{font-size:12px;min-height:14px}
  .nav{padding-top:6px;gap:6px}
  .nbtn{font-size:12px;padding:8px 16px}
  #replayBtn{font-size:12px;padding:8px 10px}
  .prog{font-size:11px}
}
@keyframes labelFadeIn{from{opacity:0}to{opacity:1}}
.pm-label-reveal{animation:labelFadeIn 0.9s ease-in forwards}
.sur-fade{animation:labelFadeIn 0.55s ease-in}
@media (max-height:500px){
  #diag-panel{padding:8px;align-items:flex-start}
  #diagWrap svg{max-height:96dvh}
  #q-panel{padding:8px 12px 8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));gap:4px}
  .qnum{font-size:9px}
  .qtext{font-size:12px;line-height:1.4}
  .abtn{font-size:12px;padding:6px 10px}
  .abtns{gap:3px}
  .fb{font-size:10px;min-height:10px}
  .nav{padding-top:5px;gap:5px}
  .nbtn{font-size:11px;padding:7px 12px}
  #replayBtn{font-size:11px;padding:7px 8px}
  .prog{font-size:10px}
}
/* ── Screen: print controls + hidden worksheet ── */
#printbar{display:flex;gap:6px}
#printbar button{font-family:inherit;font-size:11px;font-weight:500;padding:5px 11px;border:1px solid rgba(255,255,255,.28);background:transparent;color:rgba(255,255,255,.85);border-radius:6px;cursor:pointer;transition:all .15s}
#printbar button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5);color:#fff}
#worksheet{display:none}
/* ── Print / Save-as-PDF worksheet (≈3 questions per page) ── */
@media print{
  #app,#score-screen,#printbar,#topbar,#progline{display:none !important}
  #worksheet{display:block !important}
  html,body{background:#fff !important;height:auto !important;overflow:visible !important}
  .ws-head{font-size:15pt;font-weight:700;text-align:center;margin:0 0 14pt}
  .ws-q{break-inside:avoid;page-break-inside:avoid;margin:0 0 14pt;padding-bottom:8pt;border-bottom:1px solid #ccc}
  .ws-body .ws-q:nth-child(3n){break-after:page;page-break-after:always}
  .ws-body .ws-q:nth-child(3n):last-child{break-after:auto;page-break-after:auto}
  .ws-qhead{font-size:11pt;font-weight:700;margin-bottom:5pt;line-height:1.4}
  .ws-diag{text-align:center;margin:4pt 0}
  .ws-diag svg{width:210px;height:auto;max-height:200px}
  .ws-opts{margin-top:5pt}
  .ws-opt{font-size:10.5pt;padding:2pt 0;line-height:1.35}
  .ws-correct{font-weight:700}
}
</style>
</head>

<script>
const GRID=9,QS=1,QE=9;

function shiftTrail(o){

  var speed = Math.min(1, 2 * Math.min(prog, 1 - prog) + 0.06);

      var d1 = o.cur - dir * step * (j + 1);
      if(dir > 0){ if(d0 < o.from) continue; if(d1 < o.from) d1 = o.from; }

           '" stroke="' + o.col + '" stroke-width="' + w.toFixed(2) +
           '" stroke-linecap="round" opacity="' + a.toFixed(2) + '"/>';

  }
  return s;
}

    s+=`<text x="11" y="${pad.t+(H-pad.t-pad.b)/2}" text-anchor="middle" font-size="${fs2}" font-family="Verdana" fill="#888" transform="rotate(-90,11,${pad.t+(H-pad.t-pad.b)/2})">${q.yLabel}</text>`;
    // S1 — original supply at txStartSS. Drawn for tax/subsidy/negative externality.

    if(!txPosE){
    const ts1x1=gx(sQf(1,txStartSS,txSsc)),ts1y1=gy(1),ts1x2=gx(sQf(GRID,txStartSS,txSsc)),ts1y2=gy(GRID);
    const ts1dx=ts1x2-ts1x1,ts1dy=ts1y2-ts1y1;let ts1t0=0,ts1t1=1;

    }
    // S2 — active supply curve (post-intervention, ssc=1)
    const tsx1=gx(sQf(1,sA,txSsc)),tsy1=gy(1),tsx2=gx(sQf(GRID,sA,txSsc)),tsy2=gy(GRID);
    const tsdx=tsx2-tsx1,tsdy=tsy2-tsy1;let tst0=0,tst1=1;
    if(Math.abs(tsdx)>0.01){const tstL=(pad.l-tsx1)/tsdx,tstR=(W-pad.r-tsx1)/tsdx;if(tsdx>0){tst0=Math.max(tst0,tstL);tst1=Math.min(tst1,tstR);}else{tst0=Math.max(tst0,tstR);tst1=Math.min(tst1,tstL);}}

      if(tsL)s+=`<text x="${(tsL.x2+5).toFixed(1)}" y="${Math.min(tsL.y1,tsL.y2).toFixed(1)}" dominant-baseline="central" font-size="${fs}" font-family="Verdana" fill="${q.sColor}" font-weight="bold">${txExt?(sA===0?txLbl.s1:txLbl.s2):'S2'}</text>`;
    }
    // Equilibrium dots and dashed lines — conditional on showEqLines setting.
    // For a tax the post-intervention point is the headline; for an externality
    // the MARKET point is, with the social optimum shown as a hollow ring.
    const txShowEqLines=q.showEqLines!==false;
    const txM0=txQ0>=QS&&txQ0<=QE&&txP0>=1&&txP0<=GRID;

      } else {
        if(txM0&&(Math.abs(txQ0-txQn)>0.1||Math.abs(txP0-txPc)>0.1)){

    if(txExt&&txShowLbls&&txShowEqLines){

    // ── EXTERNALITY REVEALS ────────────────────────────────────────────────────

      if(txShown.has('optq')&&txM1){
        s+=`<line x1="${pad.l}" y1="${gy(txPc)}" x2="${gx(txQn).toFixed(1)}" y2="${gy(txPc)}" stroke="#1e7ab8" stroke-width="1.2" stroke-dasharray="6,4"/>`;
        s+=`<line x1="${gx(txQn).toFixed(1)}" y1="${H-pad.b}" x2="${gx(txQn).toFixed(1)}" y2="${gy(txPc)}" stroke="#1e7ab8" stroke-width="1.2" stroke-dasharray="6,4"/>`;
        s+=`<text x="${pad.l-4}" y="${gy(txPc)}" text-anchor="end" dominant-baseline="central" font-size="${fs2}" font-family="Verdana" fill="#1e7ab8" font-weight="bold">Ps</text>`;

      // measured at the optimal quantity between the private and social curves
      if(txShown.has('corrective')&&txM1&&txPrivAtQs>=1&&txPrivAtQs<=GRID){
        const cT=gy(Math.max(txPc,txPrivAtQs)),cB=gy(Math.min(txPc,txPrivAtQs));

        if(cB-cT>4){

          s+=`<line x1="${(cX-5).toFixed(1)}" y1="${cT.toFixed(1)}" x2="${(cX+5).toFixed(1)}" y2="${cT.toFixed(1)}" stroke="${txCorrCol}" stroke-width="2"/>`;
          s+=`<line x1="${(cX-5).toFixed(1)}" y1="${cB.toFixed(1)}" x2="${(cX+5).toFixed(1)}" y2="${cB.toFixed(1)}" stroke="${txCorrCol}" stroke-width="2"/>`;
          s+=`<text x="${(cX+8).toFixed(1)}" y="${((cT+cB)/2).toFixed(1)}" dominant-baseline="central" font-size="${fs2}" font-family="Verdana" fill="${txCorrCol}" font-weight="bold" stroke="#fff" stroke-width="2.5" paint-order="stroke">${txNeg?'Tax/unit':'Subsidy/unit'}</text>`;
        }
      }
    }
  } else {
    const fp=fpA,qInt=q.curve==='demand'?dQf(fp,dA):sQf(fp,sA);
    if(!q.hideNums){
      for(let i=1;i<=GRID;i++){
        const isFP=q.showEqLines!==false&&Math.abs(i-fp)<0.05;
        const isIQ=q.showEqLines!==false&&Math.abs(i-qInt)<0.05;
        if(!isFP) s+=`<text x="${pad.l-4}" y="${gy(i)}" text-anchor="end" dominant-baseline="central" font-size="${fs2}" font-family="Verdana" fill="#888">${fmt(i*vDisp)}</text>`;
        if(!isIQ) s+=`<text x="${gx(i)}" y="${H-pad.b+13}" text-anchor="middle" font-size="${fs2}" font-family="Verdana" fill="#888">${fmt(i*hDisp)}</text>`;
      }
      s+=`<text x="${pad.l-6}" y="${H-pad.b+10}" text-anchor="end" font-size="${fs2}" font-family="Verdana" fill="#888">0</text>`;
    }
    s+=`<text x="${pad.l+(W-pad.l-pad.r)/2}" y="${H-2}" text-anchor="middle" font-size="${fs2}" font-family="Verdana" fill="#888">${hU>=1000?q.xLabel+' (000s)':q.xLabel}</text>`;
    s+=`<text x="11" y="${pad.t+(H-pad.t-pad.b)/2}" text-anchor="middle" font-size="${fs2}" font-family="Verdana" fill="#888" transform="rotate(-90,11,${pad.t+(H-pad.t-pad.b)/2})">${q.yLabel}</text>`;
    // Faded D1/S1 always at origin — visible whenever the active curve is shifted
    const scShift=q.curve==='demand'?dA:sA;
    if(scShift!==0){
      const c1=q.curve==='demand'?clip(QS,dPf(QS,0),QE,dPf(QE,0),pad,W,H,1):clip(QS,sPf(QS,0),QE,sPf(QE,0),pad,W,H,1);
      if(c1){
        const fadedLbl=q.curve==='demand'?'D1':'S1';
        const ly=q.curve==='demand'?c1.y2:Math.min(c1.y1,c1.y2);
        s+=`<line x1="${c1.x1}" y1="${c1.y1}" x2="${c1.x2}" y2="${c1.y2}" stroke="${q.color}" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="${c1.x2+5}" y="${ly}" dominant-baseline="central" font-size="${fs}" font-family="Verdana" fill="${q.color}" opacity="1" font-weight="bold">${fadedLbl}</text>`;
      }
    }
    const sh=scShift!==0;
    const lbl=sh?(q.curve==='demand'?'D2':'S2'):(q.curve==='demand'?'D1':'S1');
    const eT=animT<0.5?2*animT*animT:-1+(4-2*animT)*animT;
    const startSC=q.startCS||0;
    const finalSC=q.curve==='demand'?dA:sA;
    const animSC=isAnimating&&sh?startSC+(finalSC-startSC)*eT:finalSC;
    // Full-price-range line with inline 2D x-clip — no SVG clip-path needed
    const scIsD=q.curve==='demand';
    const scAx1=scIsD?gx(dQf(GRID,animSC)):gx(sQf(1,animSC));
    const scAy1=scIsD?gy(GRID):gy(1);
    const scAx2=scIsD?gx(dQf(1,animSC)):gx(sQf(GRID,animSC));
    const scAy2=scIsD?gy(1):gy(GRID);
    const scAdx=scAx2-scAx1,scAdy=scAy2-scAy1;
    let scAt0=0,scAt1=1;
    if(Math.abs(scAdx)>0.01){const scTL=(pad.l-scAx1)/scAdx,scTR=(W-pad.r-scAx1)/scAdx;if(scAdx>0){scAt0=Math.max(scAt0,scTL);scAt1=Math.min(scAt1,scTR);}else{scAt0=Math.max(scAt0,scTR);scAt1=Math.min(scAt1,scTL);}}
    if(scAt0<scAt1){
      const scLbl=scIsD?clip(QS,dPf(QS,animSC),QE,dPf(QE,animSC),pad,W,H,1):clip(QS,sPf(QS,animSC),QE,sPf(QE,animSC),pad,W,H,1);
      s+=`<line x1="${(scAx1+scAt0*scAdx).toFixed(1)}" y1="${(scAy1+scAt0*scAdy).toFixed(1)}" x2="${(scAx1+scAt1*scAdx).toFixed(1)}" y2="${(scAy1+scAt1*scAdy).toFixed(1)}" stroke="${q.color}" stroke-width="2.5" stroke-linecap="round"/>`;
      if(scLbl){const scLy=scIsD?scLbl.y2:Math.min(scLbl.y1,scLbl.y2);s+=`<text x="${(scLbl.x2+5).toFixed(1)}" y="${scLy.toFixed(1)}" dominant-baseline="central" font-size="${fs}" font-family="Verdana" fill="${q.color}" font-weight="bold">${lbl}</text>`;}
      // Tracer dots — only when the curve is actually shifting, not on a movement question
      if(isAnimating&&sh) s+=(scIsD
        ? shiftTrail({kind:'d',from:startSC,cur:animSC,to:finalSC,dm:1,dsc:2,gx:gx,gy:gy,col:q.color})
        : shiftTrail({kind:'s',from:startSC,cur:animSC,to:finalSC,ssc:2,gx:gx,gy:gy,col:q.color}));
    }
    if(qInt>=QS&&qInt<=QE){
      const ix=gx(qInt),py=gy(fp);
      if(q.showEqLines!==false){
        s+=`<line x1="${pad.l}" y1="${py}" x2="${ix}" y2="${py}" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="6,4"/>`;
        s+=`<line x1="${ix}" y1="${py}" x2="${ix}" y2="${H-pad.b}" stroke="#D85A30" stroke-width="1" stroke-dasharray="4,3"/>`;
        s+=`<circle cx="${ix}" cy="${py}" r="6" fill="#D85A30" stroke="white" stroke-width="2"/>`;
        if(!isAnimating){
          s+=`<text x="${pad.l-4}" y="${py}" text-anchor="end" dominant-baseline="central" font-size="${fs2}" font-family="Verdana" fill="#D85A30" font-weight="bold">${fmt(fp*vDisp)}</text>`;
          s+=`<text x="${ix}" y="${H-pad.b+13}" text-anchor="middle" font-size="${fs2}" font-family="Verdana" fill="#D85A30" font-weight="bold">${fmt(qInt*hDisp)}</text>`;
        }
      }
    }
  }
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
// ── Printable worksheet (student = questions only, teacher = answers marked) ──
function wsPos(q){
  if(q.type==='sd') return{dA:q.startDS||0,sA:q.startSS||0,fpA:q.startFP||5};
  if(q.type==='sc') return{dA:q.curve==='demand'?(q.startCS||0):0,sA:q.curve==='supply'?(q.startCS||0):0,fpA:q.startFP||5};
  if(q.type==='pm') return{dA:q.dShift||0,sA:q.sShift||0,fpA:q.startPrice||5};
  if(q.type==='tax') return Object.assign(txPos(q),{fpA:-1});
  if(q.type==='trade') return{dA:0,sA:0,fpA:0};
  return{dA:0,sA:0,fpA:q.startFP||5};
}
function wsEsc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function buildWorksheet(withAnswers){
  var letters=['A','B','C','D'];
  var html='<div class="ws-head">Economics Quiz'+(withAnswers?' — Teacher copy (answers shown)':'')+'</div><div class="ws-body">';
  for(var i=0;i<qs.length;i++){
    var q=qs[i], pos=wsPos(q);
    html+='<div class="ws-q"><div class="ws-qhead">Q'+(i+1)+'. '+wsEsc(q.questionText)+'</div>';
    var diag=mkSVG(q,pos.dA,pos.sA,pos.fpA,false);
    if(diag) html+='<div class="ws-diag">'+diag+'</div>';
    html+='<div class="ws-opts">';
    for(var a=0;a<q.answers.length;a++){
      var ok=withAnswers&&a===q.correctIndex;
      html+='<div class="ws-opt'+(ok?' ws-correct':'')+'">'+(ok?'&#10003; ':'')+letters[a]+'. '+wsEsc(q.answers[a])+'</div>';
    }
    html+='</div></div>';
  }
  html+='</div>';
  return html;
}
function printWS(withAnswers){
  document.getElementById('worksheet').innerHTML=buildWorksheet(withAnswers);
  window.print();
}
function showQ(i){
  cur=i;
  const q=qs[i];
  const pos=curPos[i];
  document.getElementById('qnum').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('qtext').textContent=q.questionText;
  document.getElementById('app').classList.toggle('plain-q',q.type==='plain');
  const isStaticPM_=done[i]&&q.type==='pm'&&q.animatePrice===false;
  const dA_=isStaticPM_?(q.dShift||0):pos.dA;
  const sA_=isStaticPM_?(q.sShift||0):pos.sA;
  const fpA_=isStaticPM_?(q.startPrice||5):pos.fpA;
  document.getElementById('diagWrap').innerHTML=mkSVG(q,dA_,sA_,fpA_,false,0,0,0,isStaticPM_);
  const rb=document.getElementById('replayBtn');
  if(rb){
    let hideRep=(q.type==='plain'||q.type==='table'||q.type==='ped');
    if(q.type==='trade') hideRep=!(attempted(i)&&(q.reveals||[]).length>0);
    else if(q.type==='sur') hideRep=!(attempted(i)&&surEff(q).length>0);
    rb.style.display=hideRep?'none':'';
  }
  const rb2=document.getElementById('revealBtn');
  if(rb2) rb2.style.display='none';   // reveals now auto-play on answering (no manual stepping)
  const abtns=document.getElementById('abtns');
  abtns.innerHTML=q.answers.map((ans,ai)=>{
    const l=String.fromCharCode(65+ai);
    let cls='abtn';
    if(TESTMODE){
      if(picked[i]!==null) cls+= ai===q.correctIndex?' correct':(ai===picked[i]?' wrong':' used');
    } else if(done[i]){ cls+= ai===q.correctIndex?' correct':' used'; }
    return `<button class="${cls}" onclick="go(${i},${ai})">${l}. ${ans}</button>`;
  }).join('');
  const fb=document.getElementById('fb');
  if(TESTMODE&&picked[i]!==null){
    if(done[i]){fb.textContent='✓ Correct!';fb.className='fb c';}
    else{fb.innerHTML='✗ Incorrect — the answer is '+String.fromCharCode(65+q.correctIndex)+'.'+(q.explanation?'<span class="fb-exp">'+q.explanation.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>':'');fb.className='fb w';}
  } else {
    fb.textContent=done[i]?'✓ Correct!':'';
    fb.className=done[i]?'fb c':'fb';
  }
  document.getElementById('prevBtn').disabled=(i===0);
  const isLast=(i===qs.length-1);
  document.getElementById('nextBtn').textContent=isLast?'See Score →':'Next →';
  const mark=TESTMODE?(picked[i]!==null?(done[i]?' · ✓':' · ✗'):''):(done[i]?' · ✓':'');
  document.getElementById('prog').textContent=(i+1)+' of '+qs.length+mark;
  const pf=document.getElementById('progfill');
  if(pf) pf.style.width=(((i+1)/qs.length)*100).toFixed(1)+'%';
}
function go(qi,ai){
  const q=qs[qi];
  if(TESTMODE){
    if(picked[qi]!==null)return;            // locked once answered
    picked[qi]=ai;
    done[qi]=(ai===q.correctIndex);
    const btns2=document.getElementById('abtns').querySelectorAll('.abtn');
    btns2.forEach((b,i)=>{ b.classList.add(i===q.correctIndex?'correct':(i===ai?'wrong':'used')); });
    const fb2=document.getElementById('fb');
    if(done[qi]){fb2.textContent='✓ Correct!';fb2.className='fb c';}
    else{fb2.innerHTML='✗ Incorrect — the answer is '+String.fromCharCode(65+q.correctIndex)+'.'+(q.explanation?'<span class="fb-exp">'+q.explanation.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>':'');fb2.className='fb w';}
    document.getElementById('prog').textContent=(qi+1)+' of '+qs.length+(done[qi]?' · ✓':' · ✗');
    if(q.type==='pm'&&q.animatePrice===false){
      document.getElementById('diagWrap').innerHTML=mkSVG(q,q.dShift||0,q.sShift||0,q.startPrice||5,false,0,0,0,true);
    }else{ anim(qi); }
    return;
  }
  if(done[qi])return;
  const btns=document.getElementById('abtns').querySelectorAll('.abtn');
  const fb=document.getElementById('fb');
  if(ai===q.correctIndex){
    done[qi]=true;
    btns.forEach((b,i)=>{b.classList.add(i===ai?'correct':'used');});
    fb.textContent='✓ Correct!';fb.className='fb c';
    document.getElementById('prog').textContent=(qi+1)+' of '+qs.length+' · ✓';
    if(q.type==='pm'&&q.animatePrice===false){
      // Fade in the surplus/shortage label — no price animation
      document.getElementById('diagWrap').innerHTML=mkSVG(q,q.dShift||0,q.sShift||0,q.startPrice||5,false,0,0,0,true);
    }else{
      anim(qi);
    }
  } else {
    btns[ai].classList.add('wrong');
    fb.textContent='✗ Try again';fb.className='fb w';
    setTimeout(()=>{btns[ai].classList.remove('wrong');fb.textContent='';fb.className='fb';},1400);
  }
}
function anim(qi,animDur=700){
  if(qi!==cur)return;
  const q=qs[qi];
  if(q.type==='plain'||q.type==='table'||q.type==='ped')return;
  const el=document.getElementById('diagWrap');
  // ── Price Mechanism: animate price from startPrice → equilibrium ──────────
  if(q.type==='pm'){
    const eq_=getEq(q.dShift||0,q.sShift||0);
    const dA_=q.dShift||0,sA_=q.sShift||0;
    const fromP_=q.startPrice||5,toP_=eq_.p;
    const start_=performance.now(),dur_=animDur>700?animDur*1.5:2600;
    function stepPM(now){
      if(qi!==cur)return;
      const t=Math.min((now-start_)/dur_,1),e=t<0.5?2*t*t:-1+(4-2*t)*t;
      const priceA=fromP_+(toP_-fromP_)*e;
      curPos[qi]={dA:dA_,sA:sA_,fpA:priceA};
      el.innerHTML=mkSVG(q,dA_,sA_,priceA,t<1);
      if(t<1)requestAnimationFrame(stepPM);
      else curPos[qi]={dA:dA_,sA:sA_,fpA:toP_};
    }
    requestAnimationFrame(stepPM);
    return;
  }
  if(q.type==='tax'){
    // Reveal auto-plays: price labels first (fpA 0), then each area steps in one at a time.
    const txPn=txPos(q), txR=txRev(q), gapT=animDur>=2000?1600:1000;
    curPos[qi]={dA:txPn.dA,sA:txPn.sA,fpA:0};
    el.innerHTML=mkSVG(q,txPn.dA,txPn.sA,0,false);
    let stT=0;
    if(txR.length>0)setTimeout(function pT(){ if(qi!==cur)return; stT++;
      curPos[qi]={dA:txPn.dA,sA:txPn.sA,fpA:stT}; el.innerHTML=mkSVG(q,txPn.dA,txPn.sA,stT,false);
      if(stT<txR.length)setTimeout(pT,gapT); },600);
    return;
  }
  if(q.type==='sur'){
    // Reveal renders the full state once; CSS fades each area in on a 0.25s stagger.
    const nAll=surEff(q).length;
    curPos[qi]={dA:0,sA:0,fpA:nAll};
    el.innerHTML=mkSVG(q,0,0,nAll,true);
    return;
  }
  if(q.type==='trade'){
    // Reveal renders the full state once; CSS fades the shift / each area in on a 0.25s stagger.
    const trR=q.reveals||[];
    curPos[qi]={dA:0,sA:0,fpA:trR.length};
    el.innerHTML=mkSVG(q,0,0,trR.length,true);
    return;
  }
  let tD,tS,fromD,fromS;
  if(q.type==='sd'){
    tD=q.ansDS||0;tS=q.ansSS||0;fromD=q.startDS||0;fromS=q.startSS||0;
  } else if(q.type==='ppf'){
    // dA drives the x-intercept, sA the y-intercept, so the frontier can pivot.
    tD=(q.ansShiftX!=null?q.ansShiftX:(q.ansShift||0));
    tS=(q.ansShiftY!=null?q.ansShiftY:(q.ansShift||0));
    fromD=0;fromS=0;
  } else {
    // sc: put shift in correct field based on curve type
    if(q.curve==='demand'){tD=q.ansCS||0;tS=0;fromD=q.startCS||0;fromS=0;}
    else{tD=0;tS=q.ansCS||0;fromD=0;fromS=q.startCS||0;}
  }
  const tFP=q.ansFP||(q.startFP||5),sFP=q.startFP||5;
  const dirD=Math.sign(tD-fromD),dirS=Math.sign(tS-fromS);
  const start=performance.now(),dur=animDur;
  function step(now){
    if(qi!==cur)return;
    const t=Math.min((now-start)/dur,1),e=t<0.5?2*t*t:-1+(4-2*t)*t;
    const dA=fromD+(tD-fromD)*e,sA=fromS+(tS-fromS)*e,fpA=sFP+(tFP-sFP)*e;
    curPos[qi]={dA,sA,fpA};
    el.innerHTML=mkSVG(q,dA,sA,fpA,t<1,dirD,dirS,t);
    if(t<1)requestAnimationFrame(step);
    else curPos[qi]={dA:tD,sA:tS,fpA:tFP};
  }
  requestAnimationFrame(step);
}
function replayAnim(){
  const q=qs[cur];
  if(q.type==='plain'||q.type==='table'||q.type==='ped')return;
  if(q.type==='trade'||q.type==='sur'||q.type==='tax'){ if(attempted(cur))anim(cur,3000); return; }
  if(q.type==='sd') curPos[cur]={dA:q.startDS||0,sA:q.startSS||0,fpA:q.startFP||5};
  else if(q.type==='sc') curPos[cur]={dA:q.curve==='demand'?(q.startCS||0):0,sA:q.curve==='supply'?(q.startCS||0):0,fpA:q.startFP||5};
  else if(q.type==='pm') curPos[cur]={dA:q.dShift||0,sA:q.sShift||0,fpA:q.startPrice||5};
  else if(q.type==='tax'){curPos[cur]=Object.assign(txPos(q),{fpA:0});const rb2=document.getElementById('revealBtn');if(rb2)rb2.style.display=attempted(cur)?'':'none';}
  else curPos[cur]={dA:0,sA:0,fpA:q.startFP||5};
  if(attempted(cur)&&q.type==='pm'&&q.animatePrice===false){
    // Label-reveal mode: just re-trigger the fade-in, no price animation
    document.getElementById('diagWrap').innerHTML=mkSVG(q,q.dShift||0,q.sShift||0,q.startPrice||5,false,0,0,0,true);
  }else{
    document.getElementById('diagWrap').innerHTML=mkSVG(q,curPos[cur].dA,curPos[cur].sA,curPos[cur].fpA,false);
    if(attempted(cur))anim(cur,3000);
  }
}
function reveal(){
  const q=qs[cur];
  if(!attempted(cur))return;
  const pos=curPos[cur];
  if(q.type==='sur'){
    const eff=surEff(q);
    if(pos.fpA>=eff.length){document.getElementById('revealBtn').style.display='none';return;}
    pos.fpA++;
    document.getElementById('diagWrap').innerHTML=mkSVG(q,0,0,pos.fpA,false);
    const rbS=document.getElementById('revealBtn');
    if(rbS)rbS.style.display=pos.fpA>=eff.length?'none':'';
    return;
  }
  if(q.type==='trade'){
    const trR=q.reveals||[];
    if(pos.fpA>=trR.length){document.getElementById('revealBtn').style.display='none';return;}
    pos.fpA++;
    document.getElementById('diagWrap').innerHTML=mkSVG(q,0,0,pos.fpA,false);
    const rbT=document.getElementById('revealBtn');
    if(rbT)rbT.style.display=pos.fpA>=trR.length?'none':'';
    return;
  }
  if(q.type!=='tax')return;
  const reveals=txRev(q);
  if(pos.fpA>=reveals.length){document.getElementById('revealBtn').style.display='none';return;}
  pos.fpA++;
  document.getElementById('diagWrap').innerHTML=mkSVG(q,pos.dA,pos.sA,pos.fpA,false);
  const rb2=document.getElementById('revealBtn');
  if(rb2)rb2.style.display=pos.fpA>=reveals.length?'none':'';
}
function prev(){if(cur>0)showQ(cur-1);}
function next(){
  if(cur<qs.length-1)showQ(cur+1);
  else showScore();
}
function showScore(){
  const n=done.filter(Boolean).length;
  document.getElementById('snum').textContent=n+' / '+qs.length;
  const msgs=["Keep practising - you'll get there!","Good effort - nearly there!","Great work!","Excellent!","Perfect score!"];
  document.getElementById('smsg').textContent=msgs[Math.min(Math.floor(n/qs.length*4),4)];
  document.getElementById('score-screen').classList.add('show');
}
function restart(){
  done.fill(false);
  picked.fill(null);
  qs.forEach((q,i)=>{
    if(q.type==='sd') curPos[i]={dA:q.startDS||0,sA:q.startSS||0,fpA:q.startFP||5};
    else if(q.type==='sc') curPos[i]={dA:q.curve==='demand'?(q.startCS||0):0,sA:q.curve==='supply'?(q.startCS||0):0,fpA:q.startFP||5};
    else if(q.type==='pm') curPos[i]={dA:q.dShift||0,sA:q.sShift||0,fpA:q.startPrice||5};
    else if(q.type==='tax') curPos[i]=Object.assign(txPos(q),{fpA:-1});
    else if(q.type==='sur') curPos[i]={dA:0,sA:0,fpA:0};
    else if(q.type==='trade') curPos[i]={dA:0,sA:0,fpA:-1};
    else curPos[i]={dA:0,sA:0,fpA:q.startFP||5};
  });
  document.getElementById('score-screen').classList.remove('show');
  showQ(0);
}
showQ(0);
