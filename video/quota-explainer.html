<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Quota Explainer — Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05050c; height:100%; overflow:hidden; font-family:'Nunito',system-ui,sans-serif; }

  #stage {
    position:absolute; top:50%; left:50%;
    width:1920px; height:1080px;
    transform:translate(-50%,-50%) scale(var(--s,1));
    transform-origin:center center;
  }
  svg { display:block; width:1920px; height:1080px; }

  /* hidden -> revealed at full neon (.hot) -> settles back (.on).
     Opacity, not CSS filter: a CSS filter overrides filter="url(#glow)". */
  .el     { opacity:0; transition:opacity .75s ease; }
  .el.on  { opacity:.62; }
  .el.hot { opacity:1; }
  .keep.on{ opacity:.85; }

  /* Every glow filter is filterUnits="userSpaceOnUse". With the default,
     a HORIZONTAL line has a zero-height bbox, the filter region collapses,
     and the element renders completely invisible. */
  .draw    { transition:stroke-dashoffset 1.15s cubic-bezier(.22,.61,.36,1); }
  .draw.on { stroke-dashoffset:0 !important; }
  .trace.on{ transition:stroke-dashoffset 1.6s cubic-bezier(.4,.2,.2,1); }
  .quick.on{ transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.3,1); }
  .slow.on { transition:stroke-dashoffset 2.3s cubic-bezier(.42,.1,.25,1); }

  /* Revenue boxes are driven explicitly from render() so they can
     extend, shrink and DISAPPEAR — the cumulative .el model can't hide. */
  .qbox { opacity:0; transition:opacity .5s ease; }
  #prodBox,#impBox,#totBox { transition:x .6s ease, y .6s ease, width .6s ease; }
  #prodVal,#prodHead,#impVal,#impHead,#totVal,#totHead { transition:x .6s ease; }
  .revbox { opacity:0; transition:opacity .8s ease; }
  .sumbox { opacity:0; transition:opacity .6s ease; }

  #pwtick, #pqtick { transition:fill .7s ease, filter .7s ease; }
  #pwtick.lit { fill:#ffd43b; filter:drop-shadow(0 0 7px rgba(255,212,59,.9)); }
  #pqtick.lit { fill:#ff8c42; filter:drop-shadow(0 0 7px rgba(255,140,66,.9)); }

  /* the quota price line rises one grid = 66px = $20,000 off the world price */
  .rise    { transform:translateY(66px); transition:transform 1.3s cubic-bezier(.34,1.16,.64,1), opacity .75s; }
  .rise.on { transform:translateY(0); }

  /* the quota AS a squeeze: the yellow import band climbs 66px ($20,000) and
     narrows from 300,000 (516px) to 200,000 (344px, factor 0.66667) about its centre */
  #impclimb { transform-origin:750px 698px; transition:transform 1.7s cubic-bezier(.4,.2,.2,1), opacity .75s ease; }
  #impclimb.on { transform:translateY(-66px) scaleX(0.66667); }

  #bar { position:fixed; left:16px; bottom:14px; z-index:5; display:flex; align-items:center; gap:10px;
         background:#0d0d1c; border:1.5px solid #23233f; border-radius:12px; padding:7px 10px;
         font-family:'Nunito',sans-serif; transition:opacity .3s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar button { width:36px; height:32px; border:1.5px solid #2e2e52; background:#15152a; color:#c9c9e8;
                border-radius:8px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit;
                transition:background .15s, border-color .15s, color .15s; }
  #bar button:hover:not(:disabled) { background:#23233f; color:#fff; border-color:#4a4a7a; }
  #bar button:disabled { opacity:.28; cursor:default; }
  #num  { color:#ffd43b; font-size:16px; font-weight:900; min-width:60px; text-align:center; }
  #lbl  { color:#5a5a80; font-size:12.5px; font-weight:700; max-width:540px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Repeat needs the step BACK to be instant. Without this the rewind is itself
     animated, so the replay starts from ~97% done and nothing appears to move. */
  #stage.noanim, #stage.noanim * { transition:none !important; animation:none !important; }

  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
          color:#33334d; font-size:13px; font-weight:800; user-select:none; transition:opacity .3s; }
  #hint.hide { opacity:0; }
</style>
</head>
<body>

<div id="stage">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- cross-hatch, one per actor -->
    <pattern id="hatchG" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(0,229,192,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchY" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(255,212,59,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchW" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(232,232,255,0.10)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#e8e8ff" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#e8e8ff" stroke-width="1.6" opacity="0.8"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="45%" r="78%">
      <stop offset="62%"  stop-color="#05050c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#05050c"/>

  <g id="grid" class="el keep" stroke="#15152c" stroke-width="1.5"></g>

  <!-- ══ revenue areas sit UNDER the axes and curves so the lines stay crisp ══
       86px = 50,000 cars · 66px = $20,000
       Free trade : dom 100k (grid2) | demand 400k (grid8) | imports 300k
       With quota : dom 150k (grid3) | demand 350k (grid7) | imports 200k (the cap) -->

  <rect id="revTot" x="320" y="698" width="688" height="132" fill="url(#hatchW)" stroke="#e8e8ff" stroke-width="3" opacity="0"/>
  <g id="revDom1" class="revbox">
    <rect x="320" y="698" width="172" height="132" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
  </g>
  <g id="revImp1" class="revbox">
    <rect x="492" y="698" width="516" height="132" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
  </g>
  <g id="revDom2" class="revbox">
    <rect x="320" y="632" width="258" height="198" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
  </g>
  <g id="revImp2" class="revbox">
    <rect x="578" y="632" width="344" height="198" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
  </g>

  <g id="axes" class="el keep">
    <line x1="320" y1="830" x2="1250" y2="830" stroke="#3a3a5e" stroke-width="3"/>
    <line x1="320" y1="830" x2="320"  y2="150" stroke="#3a3a5e" stroke-width="3"/>
    <text x="132" y="500" fill="#a6a6d0" font-size="24" font-weight="800"
          text-anchor="middle" transform="rotate(-90 132 500)">Price ($ per car)</text>
    <text x="1196" y="812" fill="#a6a6d0" font-size="22" font-weight="800">Quantity (000 cars)</text>
    <g id="ticks" fill="#b8b8dc" font-size="24" font-weight="800"></g>
  </g>

  <g id="title" class="el keep">
    <text x="960" y="66" fill="#e8e8ff" font-size="38" font-weight="900" text-anchor="middle"
          filter="url(#glowSoft)">The market for <tspan fill="#00e5c0">cars</tspan></text>
  </g>

  <path id="scurve" class="el keep draw" d="M406 764 L1094 236" stroke="#00e5c0" stroke-width="5"
        fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="dcurve" class="el keep draw" d="M406 236 L1094 764" stroke="#ff5c8a" stroke-width="5"
        fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="pwline" class="el keep draw" d="M320 698 L1240 698" fill="none" stroke="#ffd43b"
        stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- S and D labels reveal on slide 1; the world-price label waits for slide 2 -->
  <g id="sdlabs" class="el keep">
    <text x="1110" y="230" fill="#00e5c0" font-size="30" font-weight="900" filter="url(#glowSoft)">S</text>
    <text x="1110" y="774" fill="#ff5c8a" font-size="30" font-weight="900" filter="url(#glowSoft)">D</text>
  </g>
  <g id="pwlab" class="el keep">
    <text x="1252" y="706" fill="#ffd43b" font-size="24" font-weight="900" filter="url(#glowSoft)">World price</text>
  </g>

  <path id="trace1" class="el draw trace" d="M406 764 L492 698" stroke="#00e5c0" stroke-width="11"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom1" class="el">
    <circle cx="492" cy="698" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="492" y1="698" x2="492" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace2" class="el draw trace" d="M492 698 L1008 698" fill="none" stroke="#ffd43b"
        stroke-width="11" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem1" class="el">
    <circle cx="1008" cy="698" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="1008" y1="698" x2="1008" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <!-- the quota price: supply is now domestic output + a fixed 200,000 imports,
       so the market clears higher, at $60,000 (grid 3). Rises one grid off world. -->
  <!-- the quota price line: ORANGE outside the traded region, YELLOW where imports sit.
       the yellow middle is a separate element (impclimb) so it can climb + shrink into place -->
  <g id="pqL" class="el keep">
    <line x1="320" y1="632" x2="578" y2="632" stroke="#ff8c42" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <g id="pqR" class="el keep">
    <line x1="922" y1="632" x2="1240" y2="632" stroke="#ff8c42" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <!-- the quota AS a squeeze on imports: a yellow band starting as the full 300,000-wide
       import gap at the world price, that climbs and narrows to the 200,000 limit -->
  <path id="impclimb" class="el keep" d="M492 698 L1008 698" fill="none" stroke="#ffd43b"
        stroke-width="11" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="trace3" class="el draw trace" d="M492 698 L578 632" stroke="#00e5c0" stroke-width="11"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom2" class="el">
    <circle cx="578" cy="632" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="578" y1="632" x2="578" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace4" class="el draw trace" d="M1008 698 L922 632" stroke="#ff5c8a" stroke-width="11"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem2" class="el">
    <circle cx="922" cy="632" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="922" y1="632" x2="922" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <!-- the quota IS this horizontal import gap — 200,000 cars, and no more -->
  <g id="qgap" class="el">
    <path d="M578 616 L578 596 L922 596 L922 616" fill="none" stroke="#ffd43b" stroke-width="3.5"/>
  </g>
  <g id="qgaplab" class="el">
    <text x="750" y="584" fill="#ffd43b" font-size="26" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">Import quota — 200,000</text>
  </g>

  <!-- ══ under-graph revenue calculation (height × width + flashed numbers) ══ -->
  <g id="calc" opacity="0">
    <path id="calcH" fill="none" stroke-width="9" stroke-linecap="round" filter="url(#glowBig)"/>
    <path id="calcV" fill="none" stroke-width="9" stroke-linecap="round" filter="url(#glowBig)"/>
    <text id="calcVlab" font-size="30" font-weight="900" filter="url(#glowSoft)"></text>
    <text id="calcHlab" font-size="30" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"></text>
  </g>

  <!-- ══ under-graph proportional boxes (green production, yellow imports, white total) ══ -->
  <g id="prodBoxG" class="qbox">
    <rect id="prodBox" x="320" y="872" width="172" height="92" rx="12" fill="#08130f" stroke="#00e5c0" stroke-width="2.5"/>
    <text id="prodVal" x="406" y="912" fill="#7dffe8" font-size="28" font-weight="900" text-anchor="middle">100,000</text>
    <text id="prodHead" x="406" y="940" fill="#00e5c0" font-size="20" font-weight="800" text-anchor="middle">DOMESTIC PRODUCTION</text>
  </g>
  <g id="impBoxG" class="qbox">
    <rect id="impBox" x="492" y="872" width="516" height="92" rx="12" fill="#14100a" stroke="#ffd43b" stroke-width="2.5"/>
    <text id="impVal" x="750" y="912" fill="#ffe680" font-size="28" font-weight="900" text-anchor="middle">300,000</text>
    <text id="impHead" x="750" y="940" fill="#ffd43b" font-size="20" font-weight="800" text-anchor="middle">IMPORTS</text>
  </g>
  <g id="totBoxG" class="qbox">
    <rect id="totBox" x="320" y="872" width="688" height="92" rx="12" fill="#111120" stroke="#e8e8ff" stroke-width="2.5"/>
    <text id="totVal" x="664" y="912" fill="#e8e8ff" font-size="28" font-weight="900" text-anchor="middle">400,000</text>
    <text id="totHead" x="664" y="940" fill="#b8b8dc" font-size="20" font-weight="800" text-anchor="middle">TOTAL DEMAND</text>
  </g>

  <!-- closing cards: the effects of the quota. -->
  <g id="sumPrice" class="sumbox">
    <text x="750" y="916" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ff8c42">1.  A HIGHER PRICE</tspan></text>
  </g>
  <g id="sumProd" class="sumbox">
    <text x="750" y="968" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#00e5c0">2.  INCREASED DOMESTIC PRODUCTION &amp; REVENUE</tspan></text>
  </g>
  <g id="sumDemand" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ff5c8a">3.  A CONTRACTION IN DEMAND</tspan></text>
  </g>
  <g id="sumImp" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ffd43b">4.  A REDUCTION IN IMPORTS</tspan></text>
  </g>
  <g id="sumImpRev" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">5.  </tspan><tspan fill="#00e5c0">DOMESTIC</tspan><tspan fill="#e8e8ff"> &amp; </tspan><tspan fill="#ffd43b">FOREIGN PRODUCERS</tspan><tspan fill="#e8e8ff"> BOTH SELL AT A HIGHER PRICE</tspan></text>
  </g>
  <g id="sumGov" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#8b8bb0">6.  NO GOVERNMENT REVENUE OR EXPENDITURE</tspan></text>
  </g>

  <!-- ══ closing slide: generic, succinct, all neon. The diagram blacks out. ══ -->
  <rect id="blackout" width="1920" height="1080" fill="#05050c" opacity="0"
        style="transition:opacity .8s ease" pointer-events="none"/>
  <g id="impact" class="sumbox">
    <text x="960" y="196" font-size="52" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">The impact of a </tspan><tspan fill="#ff8c42">quota</tspan></text>

    <line x1="380" y1="268" x2="1540" y2="268" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="392" fill="#ff5c8a" font-size="34" font-weight="900" filter="url(#glowSoft)">HOUSEHOLDS</text>
    <text x="880" y="392" fill="#ff5c8a" font-size="34" font-weight="800" filter="url(#glowSoft)">Higher prices, fewer cars</text>

    <line x1="380" y1="466" x2="1540" y2="466" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="612" fill="#00e5c0" font-size="34" font-weight="900" filter="url(#glowSoft)">FIRMS</text>

    <path d="M866 528 L850 528 L850 630 L866 630" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="832" y="588" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">DOMESTIC</text>
    <text x="884" y="588" fill="#00e5c0" font-size="34" font-weight="800" filter="url(#glowSoft)">Import-competing firms — higher revenue, more jobs</text>

    <text x="832" y="700" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">FOREIGN</text>
    <path d="M866 676 L850 676 L850 712 L866 712" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="884" y="700" fill="#ffd43b" font-size="34" font-weight="800" filter="url(#glowSoft)">Importers — fewer cars, but a higher price on each</text>

    <line x1="380" y1="768" x2="1540" y2="768" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="880" fill="#8b8bb0" font-size="34" font-weight="900" filter="url(#glowSoft)">GOVERNMENT</text>
    <text x="880" y="880" fill="#8b8bb0" font-size="34" font-weight="800" filter="url(#glowSoft)">No revenue — unlike a tariff</text>
  </g>

  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>

<div id="bar">
  <button id="prev" title="Back (left arrow)">←</button>
  <span id="num">0 / 21</span>
  <button id="next" title="Next (space / right arrow)">→</button>
  <button id="rep" title="Repeat this stage (A)">↻</button>
  <span id="lbl"></span>
</div>

<div id="hint">SPACE / CLICK → next · ← back · A repeat · R restart · H hide toolbar</div>

<script>
// grid 0..10 both axes. Price unit $20,000, quantity unit 50,000 cars.
// supply P=Q, demand P=10-Q. World price grid 2 ($40,000); quota lifts it to grid 3 ($60,000).
//   free trade : dom 100k (grid2) | demand 400k (grid8) | imports 300k
//   with quota : dom 150k (grid3) | demand 350k (grid7) | imports 200k (the cap)
const gx = q => 320 + q * 86;
const gy = p => 830 - p * 66;
function drawCalc(xL,xR,gLo,gHi,col,pLab,qLab){
  const yLo=gy(gLo), yHi=gy(gHi);
  const H=document.getElementById('calcH'), V=document.getElementById('calcV');
  H.setAttribute('d',`M${xL} ${yLo} L${xR} ${yLo}`);
  V.setAttribute('d',`M${xL} ${yLo} L${xL} ${yHi}`);
  [H,V].forEach(p=>{ p.setAttribute('stroke',col); const L=p.getTotalLength();
    p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    void p.getBoundingClientRect(); p.style.transition='stroke-dashoffset 1s ease';
    requestAnimationFrame(()=>{ p.style.strokeDashoffset=0; }); });
  const vl=document.getElementById('calcVlab'), hl=document.getElementById('calcHlab');
  vl.setAttribute('x',xL+14); vl.setAttribute('y',(yLo+yHi)/2+9); vl.setAttribute('fill',col); vl.textContent=pLab||'';
  hl.setAttribute('x',(xL+xR)/2); hl.setAttribute('y',yLo-16); hl.setAttribute('fill',col); hl.textContent=qLab||'';
  document.getElementById('calc').style.opacity=1;
}
const BOXES = {
  3:{G:['DOMESTIC\nPRODUCTION','100,000',320,172]},
  4:{G:['DOMESTIC\nPRODUCTION','100,000',320,172],Y:['IMPORTS','300,000',492,516]},
  5:{W:['TOTAL DEMAND','400,000',320,688]},
  6:{G:['DOMESTIC\nPRODUCER\nREVENUE','$4 billion',320,172]},
  7:{G:['DOMESTIC\nPRODUCER\nREVENUE','$4 billion',320,172],Y:['FOREIGN PRODUCER\nREVENUE','$12 billion',492,516]},
  8:{W:['TOTAL CONSUMER\nSPENDING','$16 billion',320,688]},
  10:{G:['DOMESTIC\nPRODUCTION','150,000',320,258]},
  11:{G:['DOMESTIC\nPRODUCTION','150,000',320,258]},
  12:{G:['DOMESTIC\nPRODUCTION','150,000',320,258],Y:['IMPORTS','200,000',578,344]},
  13:{W:['TOTAL DEMAND','350,000',320,602]},
  14:{G:['DOMESTIC PRODUCER\nREVENUE','$9 billion',320,258]},
  15:{G:['DOMESTIC PRODUCER\nREVENUE','$9 billion',320,258],Y:['FOREIGN PRODUCER\nREVENUE','$12 billion',578,344]},
  16:{W:['TOTAL CONSUMER\nSPENDING','$21 billion',320,602]},
};
function renderBoxes(t){
  const NS='http://www.w3.org/2000/svg', B=BOXES[t]||{};
  const set=(k,rid,vid,hid,y)=>{
    const g=document.getElementById(rid+'G'), d=B[k];
    if(!d){ g.style.opacity=0; return; }
    g.style.opacity=1;
    const head=d[0], val=d[1], x=d[2], w=d[3], cx=x+w/2;
    const r=document.getElementById(rid); r.setAttribute('x',x); r.setAttribute('width',w); r.setAttribute('y',y);
    const vt=document.getElementById(vid); vt.setAttribute('x',cx); vt.setAttribute('y',y+84); vt.textContent=val;
    const ht=document.getElementById(hid); ht.setAttribute('x',cx); ht.textContent='';
    head.split('\n').forEach((ln,i)=>{ const ts=document.createElementNS(NS,'tspan'); ts.setAttribute('x',cx); ts.setAttribute('y',y+18+i*17); ts.textContent=ln; ht.appendChild(ts); });
  };
  set('G','prodBox','prodVal','prodHead',872);
  set('Y','impBox','impVal','impHead',872);
  set('W','totBox','totVal','totHead',872);
}

let g = '';
for (let i = 0; i <= 10; i++) {
  g += `<line x1="${gx(i)}" y1="${gy(0)}" x2="${gx(i)}" y2="${gy(10)}"/>`;
  g += `<line x1="${gx(0)}" y1="${gy(i)}" x2="${gx(10)}" y2="${gy(i)}"/>`;
}
document.getElementById('grid').innerHTML = g;

let t = '';
for (let i = 1; i <= 10; i++) {
  const id = i === 2 ? 'id="pwtick" ' : (i === 3 ? 'id="pqtick" ' : '');
  t += `<text ${id}x="300" y="${gy(i) + 8}" text-anchor="end">$${(i * 20000).toLocaleString('en-US')}</text>`;
  t += `<text x="${gx(i)}" y="862" text-anchor="middle">${i * 50}</text>`;
}
document.getElementById('ticks').innerHTML = t;

document.querySelectorAll('.draw').forEach(el => {
  const len = el.getTotalLength();
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
});

let SNAP = false;   // true while repeat() is rewinding

const STAGES = [
  { cap:'', show:['grid','axes','title'] },
  { cap:'Cars: domestic supply and domestic demand.', show:['scurve','dcurve','sdlabs'] },
  { cap:'Now bring in the world price — $40,000 a car.', show:['pwline','pwlab'] },
  { cap:'At $40,000, domestic makers produce 100,000 cars.', show:['trace1','dom1'] },
  { cap:'Buyers want 400,000 cars; the 300,000 gap is imported.', show:['trace2','dem1'] },
  { cap:'Together, that is total demand — 400,000 cars.', show:[] },
  { cap:'Domestic producer revenue — price × quantity, $40,000 × 100,000.', show:[] },
  { cap:'Foreign producer revenue — price × quantity, $40,000 × 300,000.', show:[] },
  { cap:'Total consumer spending — price × total quantity, $40,000 × 400,000.', show:[] },
  { cap:'A quota is imposed — imports squeezed between supply and demand, down to the 200,000 limit.', show:['impclimb','pqL','pqR','qgap','qgaplab'], replay:['impclimb'] },
  { cap:'Makers move up the supply curve — production rises to 150,000.', show:['trace3','dom2'] },
  { cap:'Buyers move up the demand curve — total demand falls to 350,000.', show:['trace4','dem2'] },
  { cap:'Imports fill that gap — the 200,000 cars the quota allows.', show:[] },
  { cap:'Together, that is total demand — 350,000 cars.', show:[] },
  { cap:'Domestic producer revenue — price × quantity, $60,000 × 150,000.', show:[] },
  { cap:'Foreign producer revenue — the quota price $60,000 × 200,000.', show:[] },
  { cap:'Total consumer spending — price × total quantity, $60,000 × 350,000.', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
];

let cur = -1;

function render(target) {
  const shown = new Set();
  for (let i = 0; i <= target; i++) {
    (STAGES[i].show || []).forEach(id => shown.add(id));
  }
  const hot = new Set(STAGES[target] ? (STAGES[target].show || []) : []);

  document.querySelectorAll('.el').forEach(el => {
    const on = shown.has(el.id);
    el.classList.toggle('on', on);
    el.classList.toggle('hot', hot.has(el.id));
    el.querySelectorAll('.draw').forEach(d => d.classList.toggle('on', on));
  });

  (STAGES[target] && STAGES[target].replay || []).forEach(id => {
    const e = document.getElementById(id);
    e.classList.remove('on');
    void e.getBoundingClientRect();
    requestAnimationFrame(() => e.classList.add('on'));
  });

  // graph shaded areas (the method visual)
  const rt=document.getElementById('revTot');
  if(target===16){ rt.setAttribute('y',632); rt.setAttribute('height',198); rt.setAttribute('width',602); }
  else { rt.setAttribute('y',698); rt.setAttribute('height',132); rt.setAttribute('width',688); }
  const AREA = {
    revDom1: target===6 || target===7,
    revImp1: target===7,
    revTot : target===8 || target===16,
    revDom2: target>=14 && target<=15,
    revImp2: target===15,
  };
  for (const [id,on] of Object.entries(AREA)){ const e=document.getElementById(id); if(e) e.style.opacity = on?0.85:0; }

  // generic calculation animation (height x width + flashed numbers)
  const CALC = {
    6:[320,492,0,2,'#00e5c0','$40,000','100,000'], 7:[492,1008,0,2,'#ffd43b','$40,000','300,000'], 8:[320,1008,0,2,'#e8e8ff','$40,000','400,000'],
    14:[320,578,0,3,'#00e5c0','$60,000','150,000'], 15:[578,922,0,3,'#ffd43b','$60,000','200,000'], 16:[320,922,0,3,'#e8e8ff','$60,000','350,000'],
  };
  if (CALC[target]) drawCalc.apply(null, CALC[target]); else document.getElementById('calc').style.opacity=0;

  // the "Import quota — 200,000" bracket names the quota on slide 9 as it squeezes in,
  // then fades so it doesn't clutter the quantity and revenue slides
  document.getElementById('qgap').style.opacity    = (target===9) ? 1 : 0;
  document.getElementById('qgaplab').style.opacity = (target===9) ? 1 : 0;

  document.getElementById('pwtick').classList.toggle('lit', target>=2 && target<=8);
  document.getElementById('pqtick').classList.toggle('lit', target>=9);

  renderBoxes(target);

  document.getElementById('sumPrice').style.opacity  = target===17 ? 1 : 0;
  document.getElementById('sumProd').style.opacity   = target===17 ? 1 : 0;
  document.getElementById('sumDemand').style.opacity = target===18 ? 1 : 0;
  document.getElementById('sumImp').style.opacity    = target===19 ? 1 : 0;
  document.getElementById('sumImpRev').style.opacity = target===20 ? 1 : 0;
  document.getElementById('sumGov').style.opacity    = target===21 ? 1 : 0;
  document.getElementById('blackout').style.opacity  = target===22 ? 0.94 : 0;
  document.getElementById('impact').style.opacity    = target===22 ? 1 : 0;

  const cap = STAGES[target] ? STAGES[target].cap : '';   // toolbar only — no on-screen caption
  const LBL = { 8:'FREE TRADE — total consumer spending', 16:'WITH QUOTA — total consumer spending', 17:'EFFECT — higher price & more production', 18:'EFFECT — demand contracts', 19:'EFFECT — reduction in imports', 20:'EFFECT — producers sell at a higher price', 21:'EFFECT — no government revenue or expenditure', 22:'CLOSING — impact by group' };
  document.getElementById('num').textContent = target + ' / ' + (STAGES.length - 1);
  document.getElementById('lbl').textContent = LBL[target] || cap || '(opening frame — axes only)';
  document.getElementById('prev').disabled = (target === 0);
  document.getElementById('next').disabled = (target === STAGES.length - 1);
}

function go(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === cur) return;
  cur = n;
  render(cur);
}

document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); go(cur - 1); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); go(cur + 1); });
// Repeat this stage's animation. Kill transitions, render the previous stage
// (snaps back), reflow, then render this one so everything animates in again.
function repeat() {
  if (cur <= 0) return;
  const t = cur, stage = document.getElementById('stage');

  stage.classList.add('noanim');
  SNAP = true;
  render(t - 1);
  void stage.getBoundingClientRect();
  SNAP = false;

  requestAnimationFrame(() => {
    stage.classList.remove('noanim');
    void stage.getBoundingClientRect();
    render(t);
  });
}
document.getElementById('rep').addEventListener('click', e => { e.stopPropagation(); repeat(); });

document.addEventListener('click', () => go(cur + 1));

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); go(cur + 1); }
  else if (e.code === 'ArrowLeft' || e.code === 'Backspace') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'r' || e.key === 'R') { cur = -1; go(0); }
  else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); repeat(); }
  else if (e.key === 'h' || e.key === 'H') {
    document.getElementById('hint').classList.toggle('hide');
    document.getElementById('bar').classList.toggle('hide');
  }
});

function fit() {
  document.getElementById('stage').style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
}
addEventListener('resize', fit);
fit();
go(0);
</script>
