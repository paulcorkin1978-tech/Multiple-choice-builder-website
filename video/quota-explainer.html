<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Quota Explainer — Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05050c; height:100%; overflow:hidden; font-family:'Nunito',system-ui,sans-serif; }

  #stage {
    position:absolute; top:50%; left:50%;
    width:1920px; height:1080px;
    transform:translate(-50%,-50%) scale(var(--s,1));
    transform-origin:center center;
  }
  svg { display:block; width:1920px; height:1080px; }

  .el     { opacity:0; transition:opacity .75s ease; }
  .el.on  { opacity:.62; }
  .el.hot { opacity:1; }
  .keep.on{ opacity:.85; }

  /* Every glow filter is filterUnits="userSpaceOnUse". With the default,
     a HORIZONTAL line has a zero-height bbox, the filter region collapses,
     and the element renders completely invisible. */
  .draw    { transition:stroke-dashoffset 1.15s cubic-bezier(.22,.61,.36,1); }
  .draw.on { stroke-dashoffset:0 !important; }
  .trace.on{ transition:stroke-dashoffset 1.6s cubic-bezier(.4,.2,.2,1); }
  .quick.on{ transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.3,1); }
  .slow.on { transition:stroke-dashoffset 2.3s cubic-bezier(.42,.1,.25,1); }

  #dsbar  { transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.3,1), opacity .55s; }
  #impbar { transition:stroke-dasharray  6.4s cubic-bezier(.4,.05,.25,1), opacity .55s; }
  #dmbar  { transition:stroke-dasharray  .9s  cubic-bezier(.3,.7,.3,1),
                       stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1), opacity .55s; }
  .barlab { opacity:0; transition:opacity .55s ease, transform .9s cubic-bezier(.3,.7,.3,1); }
  .revbox { opacity:0; transition:opacity .8s ease; }
  .sumbox { opacity:0; transition:opacity .6s ease; }

  #pwtick, #pqtick { transition:fill .7s ease, filter .7s ease; }
  #pwtick.lit { fill:#ffd43b; filter:drop-shadow(0 0 7px rgba(255,212,59,.9)); }
  #pqtick.lit { fill:#ff8c42; filter:drop-shadow(0 0 7px rgba(255,140,66,.9)); }

  /* the quota price line rises 66px = $20,000 off the world price */
  .rise    { transform:translateY(66px); transition:transform 3.2s cubic-bezier(.4,.05,.25,1), opacity .75s; }
  .rise.on { transform:translateY(0); }

  .row    { opacity:0; transform:translateX(18px); transition:opacity .45s ease, transform .45s ease; }
  .row.on { opacity:1; transform:translateX(0); }
  .flash  { animation:flash 1.1s ease-out; }
  @keyframes flash { 0%{opacity:.2} 30%{opacity:1} 100%{opacity:1} }

  #bar { position:fixed; left:16px; bottom:14px; z-index:5; display:flex; align-items:center; gap:10px;
         background:#0d0d1c; border:1.5px solid #23233f; border-radius:12px; padding:7px 10px;
         font-family:'Nunito',sans-serif; transition:opacity .3s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar button { width:36px; height:32px; border:1.5px solid #2e2e52; background:#15152a; color:#c9c9e8;
                border-radius:8px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit;
                transition:background .15s, border-color .15s, color .15s; }
  #bar button:hover:not(:disabled) { background:#23233f; color:#fff; border-color:#4a4a7a; }
  #bar button:disabled { opacity:.28; cursor:default; }
  #num  { color:#ffd43b; font-size:16px; font-weight:900; min-width:60px; text-align:center; }
  #lbl  { color:#5a5a80; font-size:12.5px; font-weight:700; max-width:520px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Repeat needs the step BACK to be instant, or the rewind animates too and
     the replay starts ~97% done. */
  #stage.noanim, #stage.noanim * { transition:none !important; animation:none !important; }

  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
          color:#33334d; font-size:13px; font-weight:800; user-select:none; transition:opacity .3s; }
  #hint.hide { opacity:0; }
</style>
</head>
<body>

<div id="stage">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="hatchG" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(0,229,192,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchY" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(255,212,59,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="45%" r="78%">
      <stop offset="62%"  stop-color="#05050c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#05050c"/>

  <g id="grid" class="el keep" stroke="#15152c" stroke-width="1.5"></g>

  <!-- ══ revenue boxes — 86px = 50,000 cars · 66px = $20,000 ══
       revDom1  172x132 = 100,000 x $40,000 = $4b
       revImp1  516x132 = 300,000 x $40,000 = $12b
       revDom2  258x198 = 150,000 x $60,000 = $9b
       revImp2  344x198 = 200,000 x $60,000 = $12b   <- identical to revImp1 -->

  <!-- P x Q edge sets. All zero-thickness bboxes; only render because the
       filters are pinned to user space. -->
  <path id="pq1v" class="el draw quick" d="M320 830 L320 698" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq1h" class="el draw quick" d="M320 830 L492 830" stroke="#00e5c0" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq1lab" class="el">
    <text x="346" y="764" fill="#ffd43b" font-size="18" font-weight="900" text-anchor="middle" transform="rotate(-90 346 764)">PRICE  $40,000</text>
    <text x="406" y="818" fill="#00e5c0" font-size="18" font-weight="900" text-anchor="middle">QUANTITY  100,000</text>
  </g>

  <path id="pq2v" class="el draw quick" d="M492 830 L492 698" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq2h" class="el draw quick" d="M492 830 L1008 830" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq2lab" class="el">
    <text x="518" y="764" fill="#ffd43b" font-size="18" font-weight="900" text-anchor="middle" transform="rotate(-90 518 764)">PRICE  $40,000</text>
    <text x="750" y="818" fill="#ffd43b" font-size="18" font-weight="900" text-anchor="middle">QUANTITY  300,000</text>
  </g>

  <path id="pq3v" class="el draw quick" d="M320 830 L320 632" stroke="#ff8c42" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq3h" class="el draw quick" d="M320 830 L578 830" stroke="#00e5c0" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq3lab" class="el">
    <text x="346" y="740" fill="#ff8c42" font-size="18" font-weight="900" text-anchor="middle" transform="rotate(-90 346 740)">PRICE  $60,000</text>
    <text x="449" y="818" fill="#00e5c0" font-size="18" font-weight="900" text-anchor="middle">QUANTITY  150,000</text>
  </g>

  <path id="pq4v" class="el draw quick" d="M578 830 L578 632" stroke="#ff8c42" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq4h" class="el draw quick" d="M578 830 L922 830" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq4lab" class="el">
    <text x="604" y="740" fill="#ff8c42" font-size="18" font-weight="900" text-anchor="middle" transform="rotate(-90 604 740)">PRICE  $60,000</text>
    <text x="750" y="818" fill="#ffd43b" font-size="18" font-weight="900" text-anchor="middle">QUANTITY  200,000</text>
  </g>

  <g id="revDom1" class="revbox">
    <rect x="320" y="698" width="172" height="132" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
    <rect x="374" y="748" width="64" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="406" y="773" fill="#7dffe8" font-size="24" font-weight="900" text-anchor="middle">$4b</text>
  </g>
  <g id="revImp1" class="revbox">
    <rect x="492" y="698" width="516" height="132" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
    <rect x="712" y="748" width="76" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="750" y="773" fill="#ffe680" font-size="24" font-weight="900" text-anchor="middle">$12b</text>
  </g>
  <g id="revDom2" class="revbox">
    <rect x="320" y="632" width="258" height="198" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
    <rect x="417" y="716" width="64" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="449" y="741" fill="#7dffe8" font-size="24" font-weight="900" text-anchor="middle">$9b</text>
  </g>
  <g id="revImp2" class="revbox">
    <rect x="578" y="632" width="344" height="198" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
    <rect x="712" y="716" width="76" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="750" y="741" fill="#ffe680" font-size="24" font-weight="900" text-anchor="middle">$12b</text>
  </g>

  <g id="axes" class="el keep">
    <line x1="320" y1="830" x2="1250" y2="830" stroke="#3a3a5e" stroke-width="3"/>
    <line x1="320" y1="830" x2="320"  y2="150" stroke="#3a3a5e" stroke-width="3"/>
    <text x="132" y="500" fill="#8b8bb0" font-size="24" font-weight="800"
          text-anchor="middle" transform="rotate(-90 132 500)">Price ($ per car)</text>
    <text x="1196" y="812" fill="#8b8bb0" font-size="22" font-weight="800">Quantity (000 cars)</text>
    <g id="ticks" fill="#61618a" font-size="20" font-weight="700"></g>
  </g>

  <g id="title" class="el keep">
    <text x="960" y="66" fill="#e8e8ff" font-size="38" font-weight="900" text-anchor="middle"
          filter="url(#glowSoft)">The market for <tspan fill="#00e5c0">cars</tspan></text>
  </g>

  <path id="scurve" class="el keep draw" d="M406 764 L1094 236" stroke="#00e5c0" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="dcurve" class="el keep draw" d="M406 236 L1094 764" stroke="#ff5c8a" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="pwline" class="el keep draw" d="M320 698 L1240 698" fill="none" stroke="#ffd43b" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g id="curvelabs" class="el keep">
    <text x="1110" y="230" fill="#00e5c0" font-size="30" font-weight="900" filter="url(#glowSoft)">S</text>
    <text x="1110" y="774" fill="#ff5c8a" font-size="30" font-weight="900" filter="url(#glowSoft)">D</text>
    <text x="1252" y="706" fill="#ffd43b" font-size="24" font-weight="900" filter="url(#glowSoft)">World price</text>
  </g>

  <path id="trace1" class="el draw trace" d="M406 764 L492 698" stroke="#00e5c0" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom1" class="el">
    <circle cx="492" cy="698" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="492" y1="698" x2="492" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace2" class="el draw trace" d="M492 698 L1008 698" fill="none" stroke="#ffd43b" stroke-width="11" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem1" class="el">
    <circle cx="1008" cy="698" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="1008" y1="698" x2="1008" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <!-- ══ the quota ══ -->
  <!-- The new price is a CONSEQUENCE, so it isn't on screen during the move.
       It fades in only once the yellow line has arrived (transition-delay, set
       in render). No .rise — the yellow line already did the rising. -->
  <g id="pq" class="el keep">
    <line x1="320" y1="632" x2="1240" y2="632" stroke="#ff8c42" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <text x="1252" y="626" fill="#ff8c42" font-size="24" font-weight="900" filter="url(#glowSoft)">New price</text>
    <text x="1252" y="654" fill="#ff8c42" font-size="21" font-weight="800" opacity="0.8">with quota</text>
  </g>

  <!-- THE QUOTA IS THIS GAP. A tariff is a vertical intervention; a quota is
       a horizontal one. 344px = 200,000 cars. -->
  <path id="qgap" class="el draw slow" d="M578 632 L922 632" fill="none" stroke="#ff8c42" stroke-width="14" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="qgaplab" class="el">
    <text x="750" y="602" fill="#ff8c42" font-size="26" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">QUOTA — 200,000 cars</text>
  </g>

  <!-- the price rise is a CONSEQUENCE of the quota, not the instrument -->
  <g id="pvert" class="el">
    <path d="M350 698 L330 698 L330 632 L350 632" fill="none" stroke="#ff8c42" stroke-width="3.5"/>
    <text x="362" y="660" fill="#ff8c42" font-size="21" font-weight="900">+$20,000</text>
  </g>

  <path id="trace3" class="el draw trace" d="M492 698 L578 632" stroke="#00e5c0" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom2" class="el">
    <circle cx="578" cy="632" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="578" y1="632" x2="578" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace4" class="el draw trace" d="M1008 698 L922 632" stroke="#ff5c8a" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem2" class="el">
    <circle cx="922" cy="632" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="922" y1="632" x2="922" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <!-- THE QUOTA MECHANIC. The free-trade import line (492-1008 @ $40,000)
       shrinks to the quota width AND rises to the price that gap implies,
       in one movement: cap the imports -> the price is forced up.
       dasharray does the shrink, translateY(-66px) does the rise ($20,000). -->
  <path id="qrise" d="M320 698 L1240 698" fill="none" stroke="#ffd43b" stroke-width="14"
        stroke-linecap="butt" filter="url(#glowBig)" opacity="0"/>

  <!-- Impact-slide tracers: the FULL climb up each curve, from its cheap end
       to where the quota leaves it. Mirror images, 217px each. -->
  <path id="trace5" class="el draw slow" d="M406 764 L578 632" stroke="#00e5c0" stroke-width="14"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="trace6" class="el draw slow" d="M1094 764 L922 632" stroke="#ff5c8a" stroke-width="14"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>

  <!-- ══ below the axis: production + imports = total demand ══ -->
  <path id="impbar" d="M320 876 L1008 876" fill="none" stroke="#ffd43b" stroke-width="8" stroke-linecap="butt" filter="url(#glow)" opacity="0"/>
  <path id="dsbar"  d="M320 876 L578 876"  fill="none" stroke="#00e5c0" stroke-width="8" stroke-linecap="butt" filter="url(#glow)" opacity="0"/>
  <path id="dmbar"  d="M320 972 L1008 972" fill="none" stroke="#ff5c8a" stroke-width="8" stroke-linecap="butt" filter="url(#glow)" opacity="0"/>

  <g id="dslab" class="barlab">
    <text id="dsval" x="406" y="904" fill="#00e5c0" font-size="22" font-weight="900" text-anchor="middle">100,000</text>
    <text x="406" y="928" fill="#00e5c0" font-size="18" font-weight="800" text-anchor="middle" opacity="0.75">Domestic production</text>
  </g>
  <g id="implab" class="barlab">
    <text id="impval" x="750" y="904" fill="#ffd43b" font-size="22" font-weight="900" text-anchor="middle">300,000</text>
    <text x="750" y="928" fill="#ffd43b" font-size="18" font-weight="800" text-anchor="middle" opacity="0.75">Imports</text>
  </g>
  <g id="dmlab" class="barlab">
    <text id="dmval" x="664" y="1000" fill="#ff5c8a" font-size="22" font-weight="900" text-anchor="middle">400,000</text>
    <text x="664" y="1024" fill="#ff5c8a" font-size="18" font-weight="800" text-anchor="middle" opacity="0.75">Total demand</text>
  </g>

  <!-- ══ the four effects ══ -->
  <g id="sumPrice" class="sumbox">
    <text x="750" y="944" fill="#ff8c42" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">1.  A HIGHER PRICE AND INCREASED DOMESTIC PRODUCTION</text>
  </g>
  <g id="sumDemand" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ff5c8a">2.  </tspan><tspan fill="#ff5c8a">A CONTRACTION IN DEMAND</tspan></text>
  </g>
  <g id="sumImp" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ffd43b">3.  </tspan><tspan fill="#ffd43b">A REDUCTION IN IMPORTS</tspan></text>
  </g>
  <g id="sumImpRev" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ffd43b">4.  </tspan><tspan fill="#ffd43b">IMPORTERS — A HIGHER PRICE, FEWER CARS</tspan></text>
  </g>


  <!-- ══ readout panel ══ -->
  <g id="panel">
    <g id="r-price" class="row">
      <text x="1480" y="212" fill="#61618a" font-size="20" font-weight="800">PRICE</text>
      <text id="v-price" x="1480" y="256" fill="#ffd43b" font-size="34" font-weight="900" filter="url(#glowSoft)">$40,000</text>
    </g>
    <g id="r-dom" class="row">
      <text x="1480" y="336" fill="#61618a" font-size="20" font-weight="800">DOMESTIC PRODUCTION</text>
      <text id="v-dom" x="1480" y="380" fill="#00e5c0" font-size="34" font-weight="900" filter="url(#glowSoft)">100,000</text>
    </g>
    <g id="r-imp" class="row">
      <text x="1480" y="460" fill="#61618a" font-size="20" font-weight="800">IMPORTS</text>
      <text id="v-imp" x="1480" y="504" fill="#ffd43b" font-size="34" font-weight="900" filter="url(#glowSoft)">300,000</text>
    </g>
    <g id="r-dem" class="row">
      <text x="1480" y="584" fill="#61618a" font-size="20" font-weight="800">TOTAL DEMAND</text>
      <text id="v-dem" x="1480" y="628" fill="#ff5c8a" font-size="34" font-weight="900" filter="url(#glowSoft)">400,000</text>
    </g>
    <g id="r-gov" class="row">
      <text x="1480" y="708" fill="#61618a" font-size="20" font-weight="800">GOVERNMENT REVENUE</text>
      <text id="v-gov" x="1480" y="752" fill="#ff8c42" font-size="34" font-weight="900" filter="url(#glowSoft)">$0</text>
      <text x="1480" y="788" fill="#7a7aa8" font-size="20" font-weight="800">a quota collects nothing</text>
    </g>
  </g>

  <!-- ══ closing ══ -->
  <rect id="blackout" width="1920" height="1080" fill="#05050c" opacity="0" style="transition:opacity .8s ease" pointer-events="none"/>
  <g id="impact" class="sumbox">
    <text x="960" y="176" font-size="52" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">The impact of a </tspan><tspan fill="#ff8c42">quota</tspan></text>

    <line x1="380" y1="248" x2="1540" y2="248" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="360" fill="#ff5c8a" font-size="34" font-weight="900" filter="url(#glowSoft)">HOUSEHOLDS</text>
    <text x="880" y="360" fill="#ff5c8a" font-size="34" font-weight="800" filter="url(#glowSoft)">Higher prices</text>

    <line x1="380" y1="430" x2="1540" y2="430" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="574" fill="#00e5c0" font-size="34" font-weight="900" filter="url(#glowSoft)">FIRMS</text>
    <path d="M866 490 L850 490 L850 592 L866 592" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="832" y="550" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">DOMESTIC</text>
    <text x="884" y="520" fill="#00e5c0" font-size="34" font-weight="800" filter="url(#glowSoft)">Import-competing firms — higher revenue</text>
    <text x="884" y="582" fill="#ff8c42" font-size="34" font-weight="800" filter="url(#glowSoft)">Firms using it as an input — higher costs</text>
    <text x="832" y="662" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">FOREIGN</text>
    <path d="M866 638 L850 638 L850 674 L866 674" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="884" y="662" fill="#ffd43b" font-size="34" font-weight="800" filter="url(#glowSoft)">Foreign firms — fewer sales, higher price each</text>

    <line x1="380" y1="720" x2="1540" y2="720" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="820" fill="#ff8c42" font-size="34" font-weight="900" filter="url(#glowSoft)">GOVERNMENT</text>
    <text x="880" y="820" fill="#ff8c42" font-size="34" font-weight="800" filter="url(#glowSoft)">Nothing at all</text>

    <line x1="380" y1="884" x2="1540" y2="884" stroke="#23233f" stroke-width="2"/>

    <text x="960" y="954" fill="#c9c9e8" font-size="26" font-weight="800" text-anchor="middle">A tariff and a quota can give the same price and the same imports.</text>
    <text x="960" y="1000" font-size="30" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">The difference is </tspan><tspan fill="#ff8c42">who gets the money</tspan><tspan fill="#e8e8ff">.</tspan></text>
  </g>

  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>

<div id="bar">
  <button id="prev" title="Back (left arrow)">←</button>
  <span id="num">0 / 20</span>
  <button id="next" title="Next (space / right arrow)">→</button>
  <button id="rep" title="Repeat this stage (A)">↻</button>
  <span id="lbl"></span>
</div>

<div id="hint">SPACE / CLICK → next · ← back · A repeat · R restart · H hide toolbar</div>

<script>
// CARS — numbers taken from banks/quotas.json (vUnit 20, hUnit 50, worldPrice 40, quota 200)
//   86px = 50,000 cars   ·   66px = $20,000
//   free trade : dom 100,000 | demand 400,000 | imports 300,000 @ $40,000
//   with quota : dom 150,000 | demand 350,000 | imports 200,000 @ $60,000
//   domestic producer revenue $4b -> $9b
//   importer revenue          $12b -> $12b   (IDENTICAL)
//   government revenue        $0   -> $0     (a quota collects nothing)
const gx = q => 320 + q * 86;
const gy = p => 830 - p * 66;

let g = '';
for (let i = 0; i <= 10; i++) {
  g += `<line x1="${gx(i)}" y1="${gy(0)}" x2="${gx(i)}" y2="${gy(10)}"/>`;
  g += `<line x1="${gx(0)}" y1="${gy(i)}" x2="${gx(10)}" y2="${gy(i)}"/>`;
}
document.getElementById('grid').innerHTML = g;

let t = '';
for (let i = 1; i <= 10; i++) {
  const id = i === 2 ? 'id="pwtick" ' : (i === 3 ? 'id="pqtick" ' : '');
  t += `<text ${id}x="300" y="${gy(i) + 7}" text-anchor="end">$${(i * 20000).toLocaleString('en-US')}</text>`;
  t += `<text x="${gx(i)}" y="858" text-anchor="middle">${i * 50}</text>`;
}
document.getElementById('ticks').innerHTML = t;

document.querySelectorAll('.draw').forEach(el => {
  const len = el.getTotalLength();
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
});

const NUMS = { dsval:100000, impval:300000, dmval:400000, 'v-imp':300000 };
function tweenNum(el, from, to, ms) {
  const t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = (Math.round((from + (to - from) * e) / 1000) * 1000).toLocaleString('en-US');
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
let SNAP = false;
function setNum(id, v, ms) {
  if (NUMS[id] === v) return;
  if (SNAP) document.getElementById(id).textContent = v.toLocaleString('en-US');
  else      tweenNum(document.getElementById(id), NUMS[id], v, ms || 900);
  NUMS[id] = v;
}

const STAGES = [
  { cap:'', show:['grid','axes','title'] },

  { cap:'Cars: domestic supply, domestic demand, and a world price of $40,000.',
    show:['scurve','dcurve','pwline','curvelabs'], set:{'v-price':'$40,000'}, rows:['r-price'] },

  { cap:'At $40,000, domestic plants produce 100,000 cars.',
    show:['trace1','dom1'], set:{'v-dom':'100,000'}, rows:['r-dom'] },

  { cap:'Buyers want 400,000 — the 300,000 gap is imported.',
    show:['trace2','dem1'], set:{'v-dem':'400,000'}, rows:['r-imp','r-dem'] },

  { cap:'Domestic producer revenue: $40,000 × 100,000 = $4 billion.', show:[] },

  { cap:'Price × quantity — the height and the width of that box.',
    show:['pq1v','pq1h','pq1lab'], replay:['pq1v','pq1h'] },

  { cap:'Importer revenue: $40,000 × 300,000 = $12 billion.', show:[] },

  { cap:'Again — price × quantity.',
    show:['pq2v','pq2h','pq2lab'], replay:['pq2v','pq2h'] },

  { cap:'Cap imports at 200,000 — and the price is forced up to $60,000.',
    show:['pq','pvert'], set:{'v-price':'$60,000'} },

  { cap:'The quota IS this gap — the distance between supply and demand.',
    show:['qgap','qgaplab'], replay:['qgap'] },

  { cap:'Plants move up the supply curve — production rises to 150,000.',
    show:['trace3','dom2'], set:{'v-dom':'150,000'} },

  { cap:'Buyers move up the demand curve — demand contracts to 350,000.',
    show:['trace4','dem2'], set:{'v-dem':'350,000'} },

  { cap:'Domestic producer revenue more than doubles: $60,000 × 150,000 = $9 billion.', show:[] },

  { cap:'Price × quantity again — a taller, wider box.',
    show:['pq3v','pq3h','pq3lab'], replay:['pq3v','pq3h'] },

  { cap:'Importer revenue: $60,000 × 200,000 = $12 billion — exactly what it was.', show:[] },

  { cap:'Fewer cars, but more for each one. The two cancel out.',
    show:['pq4v','pq4h','pq4lab'], replay:['pq4v','pq4h'] },

  { cap:'', show:['trace5','dom2','pvert'], replay:['trace5'] },
  { cap:'', show:['trace6','dem2'], replay:['trace6'] },
  { cap:'', show:['qgap','qgaplab'], replay:['qgap'] },
  { cap:'', show:[], rows:['r-gov'] },   // revImp2 re-shades via BOXVIS; the panel's $0 sits beside it
  { cap:'', show:[] },
];

// revenue boxes — windows, because they must disappear again
const BOXVIS = {
  revDom1: t => t >= 4 && t <= 7,
  revImp1: t => t >= 6 && t <= 7,
  revDom2: t => t >= 12 && t <= 15,
  revImp2: t => (t >= 14 && t <= 15) || t === 19,   // returns, shaded, for effect 4
};
const BOXHOT = { revDom1:[4], revImp1:[6], revDom2:[12], revImp2:[14,19] };

let cur = -1;

function render(target) {
  const shown = new Set(), rows = new Set(), vals = {};
  for (let i = 0; i <= target; i++) {
    const s = STAGES[i];
    (s.show || []).forEach(id => shown.add(id));
    (s.rows || []).forEach(id => rows.add(id));
    Object.assign(vals, s.set || {});
  }
  const hot = new Set(STAGES[target] ? (STAGES[target].show || []) : []);

  // MUST come before any class or opacity change below: setting a
  // transition-delay AFTER the transition has already begun does nothing.
  // On stage 8 the price line, its bracket and the lit $60,000 tick all hold
  // off until the yellow import line has finished arriving.
  const wait = (target === 8) ? '6.4s' : '0s';
  ['pq','pvert','pqtick'].forEach(id => document.getElementById(id).style.transitionDelay = wait);

  document.querySelectorAll('.el').forEach(el => {
    const on = shown.has(el.id);
    el.classList.toggle('on', on);
    el.classList.toggle('hot', hot.has(el.id));
    el.querySelectorAll('.draw').forEach(d => d.classList.toggle('on', on));
  });
  document.querySelectorAll('.row').forEach(el => el.classList.toggle('on', rows.has(el.id)));

  // Replay. The rewind MUST be instant: without transition:none the line
  // animates backwards too, and one frame later the redraw starts from ~1%
  // along — so nothing appears to move. Same trap as the repeat button.
  (STAGES[target] && STAGES[target].replay || []).forEach(id => {
    const e = document.getElementById(id);
    e.style.transition = 'none';
    e.classList.remove('on');
    void e.getBoundingClientRect();
    requestAnimationFrame(() => {
      e.style.transition = '';
      void e.getBoundingClientRect();
      e.classList.add('on');
    });
  });

  for (const [id, vis] of Object.entries(BOXVIS)) {
    const on = vis(target);
    document.getElementById(id).style.opacity = on ? (BOXHOT[id].includes(target) ? 1 : 0.7) : 0;
  }

  // P x Q sets — each on its own stage only
  const PQ = { 5:'pq1', 7:'pq2', 13:'pq3', 15:'pq4' };
  ['pq1','pq2','pq3','pq4'].forEach(n => {
    const on = PQ[target] === n;
    [n+'v', n+'h', n+'lab'].forEach(id => document.getElementById(id).style.opacity = on ? 1 : 0);
  });

  // the quota gap: its own stage, and again on effect 3
  // the full-climb tracers live only on their own impact slide
  document.getElementById('trace5').style.opacity = (target === 16) ? 1 : 0;
  document.getElementById('trace6').style.opacity = (target === 17) ? 1 : 0;

  document.getElementById('qgap').style.opacity    = (target === 9 || target === 18) ? 1 : 0;
  document.getElementById('qgaplab').style.opacity = (target === 9 || target === 18) ? 1 : 0;
  // the price rise: shown when the quota lands, and again on effect 1
  document.getElementById('pvert').style.opacity   = (target === 8 || target === 16) ? 1 : 0;

  document.getElementById('pwtick').classList.toggle('lit', target >= 1 && target <= 7);
  document.getElementById('pqtick').classList.toggle('lit', target >= 8);

  // ── below-axis bars ──
  // stage 8 (the quota) clears green + yellow but keeps pink; 17+ clears the lot
  const SUM = target >= 16;
  // Stage 8 isolates the quota: green and pink step aside so the yellow import
  // bar can shrink 300,000 -> 200,000 in lockstep with the line on the graph.
  // They come back once they've moved (10, 11) and the sum holds again.
  const showDs  = !SUM && ((target >= 2 && target <= 7) || target >= 10);
  const showImp = !SUM && target >= 3;
  const showDm  = !SUM && ((target >= 3 && target <= 7) || target >= 11);

  const ds = document.getElementById('dsbar');
  ds.style.opacity = showDs ? 1 : 0;
  ds.style.strokeDasharray = 258;
  ds.style.strokeDashoffset = target <= 7 ? 86 : (target === 8 || target === 9 ? 258 : 0);

  const ib = document.getElementById('impbar');
  ib.style.opacity = showImp ? 1 : 0;
  ib.style.strokeDasharray = target >= 8 ? '0 258 344 9999' : '0 172 516 9999';

  const dm = document.getElementById('dmbar');
  dm.style.opacity = showDm ? 1 : 0;
  dm.style.strokeDasharray  = target >= 11 ? '602 9999' : '688 9999';
  dm.style.strokeDashoffset = target >= 3 ? 0 : 688;

  const dsl = document.getElementById('dslab');
  dsl.style.opacity = showDs ? 1 : 0;
  dsl.style.transform = target >= 10 ? 'translateX(43px)' : 'translateX(0)';
  document.getElementById('implab').style.opacity = showImp ? 1 : 0;
  const dml = document.getElementById('dmlab');
  dml.style.opacity = showDm ? 1 : 0;
  dml.style.transform = target >= 11 ? 'translateX(-43px)' : 'translateX(0)';

  setNum('dsval',  target >= 10 ? 150000 : 100000);
  setNum('dmval',  target >= 11 ? 350000 : 400000);
  // stage 8: both import counters fall across the full 6.4s move
  const impMs = (target === 8) ? 6400 : 900;
  setNum('impval', target >= 8 ? 200000 : 300000, impMs);
  setNum('v-imp',  target >= 8 ? 200000 : 300000, impMs);

  // Stage 8: the quota mechanic — the import line shrinks to 200,000 and rises
  // to $60,000 at the same time, landing exactly on the quota gap.
  const qr = document.getElementById('qrise');
  if (target === 8) {
    qr.style.opacity = 1;
    qr.style.transition = 'none';
    qr.style.strokeDasharray = '0 172 516 9999';   // 492 -> 1008  (300,000)
    qr.style.transform = 'translateY(0)';          // at the world price, y=698
    void qr.getBoundingClientRect();
    requestAnimationFrame(() => {
      qr.style.transition = 'stroke-dasharray 6.4s cubic-bezier(.4,.05,.25,1), transform 6.4s cubic-bezier(.4,.05,.25,1), stroke .9s ease 6.4s';
      qr.style.stroke = '#ff8c42';                 // held yellow by the 6.4s delay — turns orange only on arrival
      qr.style.strokeDasharray = '0 258 344 9999'; // 578 ->  922  (200,000)
      qr.style.transform = 'translateY(-66px)';    // rises to the quota price, y=632
    });
  } else {
    qr.style.transition = 'opacity .5s ease';
    qr.style.opacity = 0;
  }

  document.getElementById('sumPrice').style.opacity  = target === 16 ? 1 : 0;
  document.getElementById('sumDemand').style.opacity = target === 17 ? 1 : 0;
  document.getElementById('sumImp').style.opacity    = target === 18 ? 1 : 0;
  document.getElementById('sumImpRev').style.opacity = target === 19 ? 1 : 0;
  document.getElementById('blackout').style.opacity  = target === 20 ? 0.94 : 0;
  document.getElementById('impact').style.opacity    = target === 20 ? 1 : 0;

  for (const [id, v] of Object.entries(vals)) {
    const el = document.getElementById(id);
    if (el.textContent !== v) {
      el.textContent = v;
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }

  const cap = STAGES[target] ? STAGES[target].cap : '';
  const LBL = { 16:'EFFECT — higher price', 17:'EFFECT — demand contracts',
                18:'EFFECT — imports fall', 19:'EFFECT — importers get the higher price',
                20:'CLOSING — impact by group' };
  document.getElementById('num').textContent = target + ' / ' + (STAGES.length - 1);
  document.getElementById('lbl').textContent = LBL[target] || cap || '(opening frame — axes only)';
  document.getElementById('prev').disabled = (target === 0);
  document.getElementById('next').disabled = (target === STAGES.length - 1);
}

function go(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === cur) return;
  cur = n;
  render(cur);
}

function repeat() {
  if (cur <= 0) return;
  const t = cur, stage = document.getElementById('stage');
  stage.classList.add('noanim');
  SNAP = true;
  render(t - 1);
  void stage.getBoundingClientRect();
  SNAP = false;
  requestAnimationFrame(() => {
    stage.classList.remove('noanim');
    void stage.getBoundingClientRect();
    render(t);
  });
}

document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); go(cur - 1); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); go(cur + 1); });
document.getElementById('rep').addEventListener('click',  e => { e.stopPropagation(); repeat(); });
document.addEventListener('click', () => go(cur + 1));

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); go(cur + 1); }
  else if (e.code === 'ArrowLeft' || e.code === 'Backspace') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); repeat(); }
  else if (e.key === 'r' || e.key === 'R') { cur = -1; NUMS.dsval=100000; NUMS.impval=300000; NUMS.dmval=400000; go(0); }
  else if (e.key === 'h' || e.key === 'H') {
    document.getElementById('hint').classList.toggle('hide');
    document.getElementById('bar').classList.toggle('hide');
  }
});

function fit() {
  document.getElementById('stage').style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
}
addEventListener('resize', fit);
fit();
go(0);
</script>

</body>
</html>
