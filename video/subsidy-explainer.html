<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Subsidy Explainer — Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05050c; height:100%; overflow:hidden; font-family:'Nunito',system-ui,sans-serif; }

  #stage {
    position:absolute; top:50%; left:50%;
    width:1920px; height:1080px;
    transform:translate(-50%,-50%) scale(var(--s,1));
    transform-origin:center center;
  }
  svg { display:block; width:1920px; height:1080px; }

  .el     { opacity:0; transition:opacity .75s ease; }
  .el.on  { opacity:.62; }
  .el.hot { opacity:1; }
  .keep.on{ opacity:.85; }

  /* Every glow filter is filterUnits="userSpaceOnUse". With the default, a
     HORIZONTAL or VERTICAL line has a zero-thickness bbox, the filter region
     collapses, and the element renders completely invisible. */
  .draw    { transition:stroke-dashoffset 1.15s cubic-bezier(.22,.61,.36,1); }
  .draw.on { stroke-dashoffset:0 !important; }
  .trace.on{ transition:stroke-dashoffset 1.6s cubic-bezier(.4,.2,.2,1); }
  .quick.on{ transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.3,1); }
  .slow.on { transition:stroke-dashoffset 2.3s cubic-bezier(.42,.1,.25,1); }

  /* the subsidy: supply slides DOWN 132px = $4/kg */
  #s2wrap        { transform:translateY(0); transition:transform 2.8s cubic-bezier(.4,.05,.25,1); }
  #s2wrap.shifted{ transform:translateY(132px); }

  #dsbar  { transition:stroke-dashoffset 1.4s cubic-bezier(.3,.7,.3,1), opacity .55s; }
  #impbar { transition:stroke-dasharray  1.4s cubic-bezier(.3,.7,.3,1), opacity .55s; }
  #dmbar  { transition:stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1), opacity .55s; }
  .barlab { opacity:0; transition:opacity .55s ease, transform .9s cubic-bezier(.3,.7,.3,1); }
  .revbox { opacity:0; transition:opacity .8s ease; }
  .qbox { opacity:0; transition:opacity .5s ease; }
  #prodBox,#impBox,#totBox,#govBox { transition:x .6s ease, y .6s ease, width .6s ease; }
  #prodVal,#prodHead,#impVal,#impHead,#totVal,#totHead,#govVal,#govHead { transition:x .6s ease, y .6s ease; }
  .sumbox { opacity:0; transition:opacity .6s ease; }

  #pwtick { transition:fill .7s ease, filter .7s ease; }
  #pwtick.lit { fill:#ffd43b; filter:drop-shadow(0 0 7px rgba(255,212,59,.9)); }

  .row    { opacity:0; transform:translateX(18px); transition:opacity .45s ease, transform .45s ease; }
  .row.on { opacity:1; transform:translateX(0); }
  .flash  { animation:flash 1.1s ease-out; }
  @keyframes flash { 0%{opacity:.2} 30%{opacity:1} 100%{opacity:1} }

  #bar { position:fixed; left:16px; bottom:14px; z-index:5; display:flex; align-items:center; gap:10px;
         background:#0d0d1c; border:1.5px solid #23233f; border-radius:12px; padding:7px 10px;
         font-family:'Nunito',sans-serif; transition:opacity .3s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar button { width:36px; height:32px; border:1.5px solid #2e2e52; background:#15152a; color:#c9c9e8;
                border-radius:8px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit;
                transition:background .15s, border-color .15s, color .15s; }
  #bar button:hover:not(:disabled) { background:#23233f; color:#fff; border-color:#4a4a7a; }
  #bar button:disabled { opacity:.28; cursor:default; }
  #num  { color:#ffd43b; font-size:16px; font-weight:900; min-width:60px; text-align:center; }
  #lbl  { color:#5a5a80; font-size:12.5px; font-weight:700; max-width:520px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Repeat needs the step BACK to be instant, or the rewind animates too. */
  #stage.noanim, #stage.noanim * { transition:none !important; animation:none !important; }

  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
          color:#33334d; font-size:13px; font-weight:800; user-select:none; transition:opacity .3s; }
  #hint.hide { opacity:0; }
</style>
</head>
<body>

<div id="stage">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="plotclip"><rect x="318" y="148" width="924" height="684"/></clipPath>

    <pattern id="hatchG" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(0,229,192,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchY" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(255,212,59,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchO" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(255,140,66,0.13)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#ff8c42" stroke-width="1.7" opacity="0.85"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#ff8c42" stroke-width="1.7" opacity="0.85"/>
    </pattern>
    <pattern id="hatchW" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(232,232,255,0.10)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#e8e8ff" stroke-width="1.6" opacity="0.75"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#e8e8ff" stroke-width="1.6" opacity="0.75"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="45%" r="78%">
      <stop offset="62%"  stop-color="#05050c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#05050c"/>

  <g id="grid" class="el keep" stroke="#15152c" stroke-width="1.5"></g>

  <!-- ══ boxes — 86px = 20,000 t · 66px = $2/kg · world price $6 · subsidy $4 ══
       revDom1  258x198 =  60,000 t x $6 = $360,000
       revImp1  344x198 =  80,000 t x $6 = $480,000
       revDom2  430x198 = 100,000 t x $6 = $600,000   (what consumers pay)
       revSub   430x132 = 100,000 t x $4 = $400,000   (govt adds — STACKS on revDom2)
       revImp2  172x198 =  40,000 t x $6 = $240,000
       Five different numbers, deliberately: $6 and $4 break the symmetry that
       made every box identical. -->

  <path id="pq1v" class="el draw quick" d="M320 830 L320 632" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq1h" class="el draw quick" d="M320 830 L578 830" stroke="#00e5c0" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq1lab" class="el">
    <text x="346" y="731" fill="#ffd43b" font-size="20" font-weight="900" text-anchor="middle" transform="rotate(-90 346 731)">PRICE  $6</text>
    <text x="449" y="818" fill="#00e5c0" font-size="20" font-weight="900" text-anchor="middle">QUANTITY  60,000 t</text>
  </g>

  <path id="pq2v" class="el draw quick" d="M578 830 L578 632" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq2h" class="el draw quick" d="M578 830 L922 830" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq2lab" class="el">
    <text x="604" y="731" fill="#ffd43b" font-size="20" font-weight="900" text-anchor="middle" transform="rotate(-90 604 731)">PRICE  $6</text>
    <text x="750" y="818" fill="#ffd43b" font-size="20" font-weight="900" text-anchor="middle">QUANTITY  80,000 t</text>
  </g>

  <path id="pq3v" class="el draw quick" d="M320 830 L320 632" stroke="#ffd43b" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq3h" class="el draw quick" d="M320 830 L750 830" stroke="#00e5c0" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pq3lab" class="el">
    <text x="346" y="731" fill="#ffd43b" font-size="20" font-weight="900" text-anchor="middle" transform="rotate(-90 346 731)">PRICE  $6</text>
    <text x="535" y="818" fill="#00e5c0" font-size="20" font-weight="900" text-anchor="middle">QUANTITY  100,000 t</text>
  </g>

  <g id="revDom1" class="revbox">
    <rect x="320" y="632" width="258" height="198" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
  </g>
  <g id="revImp1" class="revbox">
    <rect x="578" y="632" width="344" height="198" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
  </g>
  <g id="revDom2" class="revbox">
    <rect x="320" y="632" width="430" height="198" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
  </g>
  <g id="revSub" class="revbox">
    <rect x="320" y="500" width="430" height="132" fill="url(#hatchO)" stroke="#ff8c42" stroke-width="4"/>
  </g>
  <rect id="revProdTot" x="320" y="500" width="430" height="330" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5" opacity="0"/>
  <g id="revImp2" class="revbox">
    <rect x="750" y="632" width="172" height="198" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
  </g>

  <rect id="revTot" x="320" y="632" width="602" height="198" fill="url(#hatchW)" stroke="#e8e8ff" stroke-width="3" opacity="0"/>

  <g id="axes" class="el keep">
    <line x1="320" y1="830" x2="1250" y2="830" stroke="#3a3a5e" stroke-width="3"/>
    <line x1="320" y1="830" x2="320"  y2="150" stroke="#3a3a5e" stroke-width="3"/>
    <text x="132" y="500" fill="#8b8bb0" font-size="24" font-weight="800"
          text-anchor="middle" transform="rotate(-90 132 500)">Price ($ per kg)</text>
    <text x="1196" y="812" fill="#8b8bb0" font-size="24" font-weight="800">Quantity (000 tonnes)</text>
    <g id="ticks" fill="#61618a" font-size="21" font-weight="700"></g>
  </g>

  <g id="title" class="el keep">
    <text x="960" y="66" fill="#e8e8ff" font-size="38" font-weight="900" text-anchor="middle"
          filter="url(#glowSoft)">The market for <tspan fill="#00e5c0">beef</tspan></text>
  </g>

  <path id="scurve" class="el keep draw" d="M406 764 L1094 236" stroke="#00e5c0" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="dcurve" class="el keep draw" d="M406 236 L1094 764" stroke="#ff5c8a" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="pwline" class="el keep draw" d="M320 632 L1240 632" fill="none" stroke="#ffd43b" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g id="sdlab" class="el keep">
    <text id="sLab" x="1110" y="230" fill="#00e5c0" font-size="30" font-weight="900" filter="url(#glowSoft)">S</text>
    <text x="1110" y="774" fill="#ff5c8a" font-size="30" font-weight="900" filter="url(#glowSoft)">D</text>
  </g>
  <g id="pwlab" class="el keep">
    <text x="1252" y="640" fill="#ffd43b" font-size="24" font-weight="900" filter="url(#glowSoft)">World price</text>
  </g>

  <!-- ══ THE SUBSIDY: a copy of S sliding down $4. Clipped — below the axis it
       would leave the plot. It re-enters at Q=2 (x=492), which is correct. ══ -->
  <g clip-path="url(#plotclip)">
    <g id="s2wrap">
      <path id="scurve2" class="el" d="M406 764 L1094 236" stroke="#00e5c0" stroke-width="6"
            fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
    </g>
  </g>
  <g id="calc" opacity="0">
    <path id="calcH" fill="none" stroke-width="9" stroke-linecap="round" filter="url(#glowBig)"/>
    <path id="calcV" fill="none" stroke-width="9" stroke-linecap="round" filter="url(#glowBig)"/>
    <text id="calcVlab" font-size="30" font-weight="900" filter="url(#glowSoft)"></text>
    <text id="calcHlab" font-size="30" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"></text>
  </g>
  <g id="s2lab" class="el">
    <text x="1110" y="374" fill="#00e5c0" font-size="28" font-weight="900" filter="url(#glowSoft)">S₂</text>
  </g>

  <!-- THE SUBSIDY IS THIS VERTICAL GAP. Measured at Q=8: S y=302, S2 y=434 —
       132px = $4/kg, and well clear of the demand curve at y=698. -->
  <path id="subvert" class="el draw slow" d="M1008 302 L1008 434" stroke="#ff8c42" stroke-width="12"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="subgap" class="el">
    <path d="M1024 302 L1040 302 L1040 434 L1024 434" fill="none" stroke="#ff8c42" stroke-width="3"/>
    <text x="1054" y="360" fill="#ff8c42" font-size="25" font-weight="900" filter="url(#glowSoft)">$4</text>
    <text x="1054" y="388" fill="#ff8c42" font-size="20" font-weight="800" opacity="0.85">subsidy</text>
  </g>

  <!-- climbs S from its bottom up to the world price -->
  <path id="trace1" class="el draw trace" d="M406 764 L578 632" stroke="#00e5c0" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom1" class="el">
    <circle cx="578" cy="632" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="578" y1="632" x2="578" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace2" class="el draw trace" d="M578 632 L922 632" fill="none" stroke="#ffd43b" stroke-width="11" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem1" class="el">
    <circle cx="922" cy="632" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="922" y1="632" x2="922" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <!-- climbs S2 ITSELF — from where the shifted curve enters the plot (Q=2, P=0)
       up to where it meets the world price (Q=5, $6). Parallel to S, so it reads
       as movement ALONG a supply curve. -->
  <path id="trace3" class="el draw trace" d="M492 830 L750 632" stroke="#00e5c0" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom2" class="el">
    <circle cx="750" cy="632" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="750" y1="632" x2="750" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>
  <path id="trace4" class="el draw trace" d="M750 632 L922 632" fill="none" stroke="#ffd43b" stroke-width="11" stroke-linecap="round" filter="url(#glowBig)"/>

  <!-- ══ below-axis quantity boxes — widths proportional to quantity, aligned to the graph ══ -->
  <g id="prodBoxG" class="qbox">
    <rect id="prodBox" x="320" y="872" width="258" height="92" rx="12" fill="#08130f" stroke="#00e5c0" stroke-width="2.5"/>
    <text id="prodVal" x="449" y="912" fill="#7dffe8" font-size="28" font-weight="900" text-anchor="middle">60,000 t</text>
    <text id="prodHead" data-h="1" x="449" y="940" fill="#00e5c0" font-size="20" font-weight="800" text-anchor="middle">PRODUCTION</text>
  </g>
  <g id="impBoxG" class="qbox">
    <rect id="impBox" x="578" y="872" width="344" height="92" rx="12" fill="#14100a" stroke="#ffd43b" stroke-width="2.5"/>
    <text id="impVal" x="750" y="912" fill="#ffe680" font-size="28" font-weight="900" text-anchor="middle">80,000 t</text>
    <text id="impHead" data-h="1" x="750" y="940" fill="#ffd43b" font-size="20" font-weight="800" text-anchor="middle">IMPORTS</text>
  </g>
  <g id="totBoxG" class="qbox">
    <rect id="totBox" x="320" y="872" width="602" height="92" rx="12" fill="#111120" stroke="#e8e8ff" stroke-width="2.5"/>
    <text id="totVal" x="621" y="912" fill="#e8e8ff" font-size="28" font-weight="900" text-anchor="middle">140,000 t</text>
    <text id="totHead" data-h="1" x="621" y="940" fill="#b8b8dc" font-size="20" font-weight="800" text-anchor="middle">TOTAL DEMAND</text>
  </g>
  <g id="govBoxG" class="qbox">
    <rect id="govBox" x="320" y="958" width="430" height="92" rx="12" fill="#1a0f06" stroke="#ff8c42" stroke-width="2.5"/>
    <text id="govVal" x="535" y="1000" fill="#ffb37a" font-size="26" font-weight="900" text-anchor="middle"></text>
    <text id="govHead" x="535" y="1024" fill="#ff8c42" font-size="20" font-weight="800" text-anchor="middle"></text>
  </g>

  <!-- ══ the four effects ══ -->
  <g id="sumProd" class="sumbox">
    <text x="750" y="944" fill="#00e5c0" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">1.  INCREASED DOMESTIC PRODUCTION</text>
  </g>
  <g id="sumImp" class="sumbox">
    <text x="750" y="944" fill="#ffd43b" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">2.  A REDUCTION IN IMPORTS</text>
  </g>
  <g id="sumCons" class="sumbox">
    <text x="750" y="944" fill="#ff5c8a" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">3.  CONSUMERS PAY THE SAME PRICE FOR THE SAME BEEF</text>
  </g>
  <g id="sumGov" class="sumbox">
    <text x="750" y="944" fill="#ff8c42" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)">4.  THE TAXPAYER PAYS $400,000</text>
  </g>

  <!-- ══ closing — AFTER the panel so the blackout covers it ══ -->
  <rect id="blackout" width="1920" height="1080" fill="#05050c" opacity="0" style="transition:opacity .8s ease" pointer-events="none"/>
  <g id="impact" class="sumbox">
    <text x="960" y="176" font-size="52" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">The impact of a </tspan><tspan fill="#ff8c42">subsidy</tspan></text>

    <line x1="380" y1="248" x2="1540" y2="248" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="360" fill="#ff5c8a" font-size="34" font-weight="900" filter="url(#glowSoft)">HOUSEHOLDS</text>
    <text x="880" y="360" fill="#ff5c8a" font-size="34" font-weight="800" filter="url(#glowSoft)">Same price — but they pay as taxpayers</text>

    <line x1="380" y1="430" x2="1540" y2="430" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="574" fill="#00e5c0" font-size="34" font-weight="900" filter="url(#glowSoft)">FIRMS</text>
    <path d="M866 490 L850 490 L850 592 L866 592" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="832" y="550" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">DOMESTIC</text>
    <text x="884" y="520" fill="#00e5c0" font-size="34" font-weight="800" filter="url(#glowSoft)">Import-competing firms — higher revenue</text>
    <text x="884" y="582" fill="#e8e8ff" font-size="34" font-weight="800" filter="url(#glowSoft)">Firms using it as an input — unaffected</text>
    <text x="832" y="662" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">FOREIGN</text>
    <path d="M866 638 L850 638 L850 674 L866 674" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="884" y="662" fill="#ffd43b" font-size="34" font-weight="800" filter="url(#glowSoft)">Foreign firms — fewer sales, same price</text>

    <line x1="380" y1="720" x2="1540" y2="720" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="820" fill="#ff8c42" font-size="34" font-weight="900" filter="url(#glowSoft)">GOVERNMENT</text>
    <text x="880" y="820" fill="#ff8c42" font-size="34" font-weight="800" filter="url(#glowSoft)">A cost to the government</text>

    <line x1="380" y1="884" x2="1540" y2="884" stroke="#23233f" stroke-width="2"/>

    <text x="960" y="954" fill="#c9c9e8" font-size="26" font-weight="800" text-anchor="middle">A tariff and a quota make the buyer pay.</text>
    <text x="960" y="1000" font-size="30" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">A subsidy makes the </tspan><tspan fill="#ff8c42">taxpayer</tspan><tspan fill="#e8e8ff"> pay.</tspan></text>
  </g>

  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>

<div id="bar">
  <button id="prev" title="Back (left arrow)">←</button>
  <span id="num">0 / 20</span>
  <button id="next" title="Next (space / right arrow)">→</button>
  <button id="rep" title="Repeat this stage (A)">↻</button>
  <span id="lbl"></span>
</div>

<div id="hint">SPACE / CLICK → next · ← back · A repeat · R restart · H hide toolbar</div>

<script>
// BEEF — world price $6/kg, $4/kg production subsidy.
//   86px = 20,000 tonnes  ·  66px = $2/kg
//   free trade : dom  60,000 t | demand 140,000 t | imports 80,000 t  @ $6
//   subsidised : dom 100,000 t | demand 140,000 t | imports 40,000 t  @ $6  <- price UNCHANGED
//   producers receive $10/kg: $600,000 from consumers + $400,000 from the government = $1,000,000
//   consumers: price, quantity and spending ALL unchanged. The taxpayer pays.
//   $6 and $4 are chosen so every box is a DIFFERENT number:
//     $360,000 · $480,000 · $600,000 · $400,000 · $240,000
const gx = q => 320 + q * 86;
const gy = p => 830 - p * 66;
function drawCalc(xL,xR,pLo,pHi,col,pLab,qLab){
  const yLo=gy(pLo/2), yHi=gy(pHi/2);   // pLo/pHi are dollars; gy scale is $2/unit
  const vl=document.getElementById('calcVlab'), hl=document.getElementById('calcHlab');
  vl.setAttribute('x',xL+14); vl.setAttribute('y',(yLo+yHi)/2+9); vl.setAttribute('fill',col); vl.textContent=pLab||'';
  hl.setAttribute('x',(xL+xR)/2); hl.setAttribute('y',yLo-16); hl.setAttribute('fill',col); hl.textContent=qLab||'';
  const H=document.getElementById('calcH'), V=document.getElementById('calcV');
  H.setAttribute('d',`M${xL} ${yLo} L${xR} ${yLo}`);
  V.setAttribute('d',`M${xL} ${yLo} L${xL} ${yHi}`);
  [H,V].forEach(p=>{ p.setAttribute('stroke',col); const L=p.getTotalLength();
    p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    void p.getBoundingClientRect(); p.style.transition='stroke-dashoffset 1s ease';
    requestAnimationFrame(()=>{ p.style.strokeDashoffset=0; }); });
  document.getElementById('calc').style.opacity=1;
}

let g = '';
for (let i = 0; i <= 10; i++) {
  g += `<line x1="${gx(i)}" y1="${gy(0)}" x2="${gx(i)}" y2="${gy(10)}"/>`;
  g += `<line x1="${gx(0)}" y1="${gy(i)}" x2="${gx(10)}" y2="${gy(i)}"/>`;
}
document.getElementById('grid').innerHTML = g;

let t = '';
for (let i = 1; i <= 10; i++) {
  t += `<text ${i === 3 ? 'id="pwtick" ' : ''}x="300" y="${gy(i) + 7}" text-anchor="end">$${i * 2}</text>`;
  t += `<text x="${gx(i)}" y="858" text-anchor="middle">${i * 20}</text>`;
}
document.getElementById('ticks').innerHTML = t;

document.querySelectorAll('.draw').forEach(el => {
  const len = el.getTotalLength();
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
});

const NUMS = { dsval:60000, impval:80000 };
function tweenNum(el, from, to, ms) {
  const t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = (Math.round((from + (to - from) * e) / 1000) * 1000).toLocaleString('en-US');
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
let SNAP = false;
function setNum(id, v, ms) {
  if (NUMS[id] === v) return;
  if (SNAP) document.getElementById(id).textContent = v.toLocaleString('en-US');
  else      tweenNum(document.getElementById(id), NUMS[id], v, ms || 900);
  NUMS[id] = v;
}

const STAGES = [
  { cap:'', show:['grid','axes','title'] },
  { cap:'Domestic supply and demand for beef.', show:['scurve','dcurve','sdlab'] },
  { cap:'The world price is $6 a kilo.', show:['pwline','pwlab'] },
  { cap:'At $6, domestic farmers produce 60,000 tonnes.', show:['trace1','dom1'] },
  { cap:'Buyers want 140,000 tonnes — the 80,000 gap is imported.', show:['trace2','dem1'] },
  { cap:'Together, that is total demand — 140,000 tonnes.', show:[] },
  { cap:'Domestic producer sales revenue is price × quantity — $6 × 60,000.', show:[] },
  { cap:'Foreign producer revenue is price × quantity — $6 × 80,000.', show:[] },
  { cap:'Total consumer spending is price × total quantity — $6 × 140,000.', show:[] },
  { cap:'A $4 subsidy. Farmers need $4 less from the market — supply slides DOWN.', show:['scurve2','s2lab'] },
  { cap:'The subsidy is the vertical gap between the two supply curves — always.', show:['subvert','subgap'], replay:['subvert'] },
  { cap:'At the same $6, farmers now produce 100,000 tonnes.', show:['trace3','dom2'] },
  { cap:'Imports are pushed out: 80,000 → 40,000 tonnes.', show:['trace4'] },
  { cap:'Together, that is still total demand — 140,000 tonnes.', show:[] },
  { cap:'Domestic producer sales revenue — $6 × 100,000 = $600,000 (from buyers).', show:[] },
  { cap:'Government spending — the $4 subsidy × 100,000 = $400,000.', show:[] },
  { cap:'Add them: total domestic producer revenue = $600,000 + $400,000 = $1,000,000.', show:[] },
  { cap:'Foreign producer revenue — $6 × 40,000 = $240,000.', show:[] },
  { cap:'Consumers still pay $6 for 140,000 tonnes — spending is unchanged.', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
  { cap:'', show:[] },
];

const BOXES = {
  3:{G:['DOMESTIC\nPRODUCTION','60,000 t',320,258]},
  4:{G:['DOMESTIC\nPRODUCTION','60,000 t',320,258],Y:['IMPORTS','80,000 t',578,344]},
  5:{W:['TOTAL\nDEMAND','140,000 t',320,602]},
  6:{G:['DOMESTIC PRODUCER\nSALES REVENUE','$360,000',320,258]},
  7:{G:['DOMESTIC PRODUCER\nSALES REVENUE','$360,000',320,258],Y:['FOREIGN PRODUCER\nREVENUE','$480,000',578,344]},
  8:{W:['TOTAL CONSUMER\nSPENDING','$840,000',320,602]},
  11:{G:['DOMESTIC\nPRODUCTION','100,000 t',320,430]},
  12:{G:['DOMESTIC\nPRODUCTION','100,000 t',320,430],Y:['IMPORTS','40,000 t',750,172]},
  13:{W:['TOTAL\nDEMAND','140,000 t',320,602]},
  14:{G:['DOMESTIC PRODUCER\nSALES REVENUE','$600,000',320,430]},
  15:{G:['DOMESTIC PRODUCER\nSALES REVENUE','$600,000',320,430],O:['GOVERNMENT\nSPENDING','$400,000',320,430]},
  16:{G:['TOTAL DOMESTIC\nPRODUCER REVENUE','$1,000,000',320,430]},
  17:{Y:['FOREIGN\nPRODUCER\nREVENUE','$240,000',750,172]},
  18:{W:['TOTAL CONSUMER\nSPENDING','$840,000',320,602]},
};function renderBoxes(t){
  const NS='http://www.w3.org/2000/svg', B=BOXES[t]||{};
  const set=(k,rid,vid,hid,y)=>{
    const g=document.getElementById(rid+'G'), d=B[k];
    if(!d){ g.style.opacity=0; return; }
    g.style.opacity=1;
    const head=d[0], val=d[1], x=d[2], w=d[3], cx=x+w/2;
    const r=document.getElementById(rid); r.setAttribute('x',x); r.setAttribute('width',w); r.setAttribute('y',y);
    const vt=document.getElementById(vid); vt.setAttribute('x',cx); vt.setAttribute('y',y+84); vt.textContent=val;
    const ht=document.getElementById(hid); ht.setAttribute('x',cx); ht.textContent='';
    head.split('\n').forEach((ln,i)=>{ const ts=document.createElementNS(NS,'tspan'); ts.setAttribute('x',cx); ts.setAttribute('y',y+18+i*17); ts.textContent=ln; ht.appendChild(ts); });
  };
  set('G','prodBox','prodVal','prodHead',868);
  set('Y','impBox','impVal','impHead',868);
  set('W','totBox','totVal','totHead',868);
  set('O','govBox','govVal','govHead',968);
}

let cur = -1;

function render(target) {
  const shown = new Set(), rows = new Set(), vals = {};
  for (let i = 0; i <= target; i++) {
    const s = STAGES[i];
    (s.show || []).forEach(id => shown.add(id));
    (s.rows || []).forEach(id => rows.add(id));
    Object.assign(vals, s.set || {});
  }
  const hot = new Set(STAGES[target] ? (STAGES[target].show || []) : []);

  // the $4 label waits for the vertical to finish drawing
  document.getElementById('subgap').style.transitionDelay = (target === 10) ? '2.3s' : '0s';

  document.querySelectorAll('.el').forEach(el => {
    const on = shown.has(el.id);
    el.classList.toggle('on', on);
    el.classList.toggle('hot', hot.has(el.id));
    el.querySelectorAll('.draw').forEach(d => d.classList.toggle('on', on));
  });
  document.querySelectorAll('.row').forEach(el => el.classList.toggle('on', rows.has(el.id)));

  // Replay. The rewind MUST be instant — otherwise the line animates backwards
  // too and the redraw starts from ~1% along, so nothing appears to move.
  (STAGES[target] && STAGES[target].replay || []).forEach(id => {
    const e = document.getElementById(id);
    e.style.transition = 'none';
    e.classList.remove('on');
    void e.getBoundingClientRect();
    requestAnimationFrame(() => {
      e.style.transition = '';
      void e.getBoundingClientRect();
      e.classList.add('on');
    });
  });

  const AREA = {
    revDom1: target===6 || target===7,
    revImp1: target===7,
    revTot : target===8 || target===18,
    revDom2: target>=14 && target<=15,
    revSub : target===15,
    revProdTot: target===16,
    revImp2: target===17,
  };
  for (const [id,on] of Object.entries(AREA)) { const e=document.getElementById(id); if(e) e.style.opacity = on ? 0.85 : 0; }

  const CALC = {
    6:[320,578,0,6,'#00e5c0','$6','60,000 t'], 7:[578,922,0,6,'#ffd43b','$6','80,000 t'], 8:[320,922,0,6,'#e8e8ff','$6','140,000 t'],
    14:[320,750,0,6,'#00e5c0','$6','100,000 t'], 15:[320,750,6,10,'#ff8c42','$4','100,000 t'],
    17:[750,922,0,6,'#ffd43b','$6','40,000 t'], 18:[320,922,0,6,'#e8e8ff','$6','140,000 t'],
  };
  if (CALC[target]) drawCalc.apply(null, CALC[target]);
  else document.getElementById('calc').style.opacity = 0;

  document.getElementById('s2wrap').classList.toggle('shifted', target >= 9);
  document.getElementById('sLab').textContent = target >= 9 ? 'S\u2081' : 'S';
  ['subvert','subgap'].forEach(id =>
    document.getElementById(id).style.opacity = (target === 10) ? 1 : 0);

  document.getElementById('pwtick').classList.toggle('lit', target >= 2);

  renderBoxes(target);

  document.getElementById('sumProd').style.opacity = target === 19 ? 1 : 0;
  document.getElementById('sumImp').style.opacity  = target === 20 ? 1 : 0;
  document.getElementById('sumCons').style.opacity = target === 21 ? 1 : 0;
  document.getElementById('sumGov').style.opacity  = target === 22 ? 1 : 0;
  document.getElementById('blackout').style.opacity = target === 23 ? 0.94 : 0;
  document.getElementById('impact').style.opacity   = target === 23 ? 1 : 0;

  for (const [id, v] of Object.entries(vals)) {
    const el = document.getElementById(id);
    if (el && el.textContent !== v) {
      el.textContent = v;
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }

  const cap = STAGES[target] ? STAGES[target].cap : '';
  const LBL = { 19:'EFFECT — more made at home', 20:'EFFECT — fewer imports',
                21:'EFFECT — consumers untouched', 22:'EFFECT — the taxpayer pays',
                23:'CLOSING — impact by group' };
  document.getElementById('num').textContent = target + ' / ' + (STAGES.length - 1);
  document.getElementById('lbl').textContent = LBL[target] || cap || '(opening frame — axes only)';
  document.getElementById('prev').disabled = (target === 0);
  document.getElementById('next').disabled = (target === STAGES.length - 1);
}

function go(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === cur) return;
  cur = n;
  render(cur);
}

function repeat() {
  if (cur <= 0) return;
  const t = cur, stage = document.getElementById('stage');
  stage.classList.add('noanim');
  SNAP = true;
  render(t - 1);
  void stage.getBoundingClientRect();
  SNAP = false;
  requestAnimationFrame(() => {
    stage.classList.remove('noanim');
    void stage.getBoundingClientRect();
    render(t);
  });
}

document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); go(cur - 1); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); go(cur + 1); });
document.getElementById('rep').addEventListener('click',  e => { e.stopPropagation(); repeat(); });
document.addEventListener('click', () => go(cur + 1));

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); go(cur + 1); }
  else if (e.code === 'ArrowLeft' || e.code === 'Backspace') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'a' || e.key === 'A') { e.preventDefault(); repeat(); }
  else if (e.key === 'r' || e.key === 'R') { cur = -1; NUMS.dsval=60000; NUMS.impval=80000; go(0); }
  else if (e.key === 'h' || e.key === 'H') {
    document.getElementById('hint').classList.toggle('hide');
    document.getElementById('bar').classList.toggle('hide');
  }
});

function fit() {
  document.getElementById('stage').style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
}
addEventListener('resize', fit);
fit();
go(0);
</script>

</body>
</html>
