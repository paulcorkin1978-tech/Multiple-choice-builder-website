<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Drag-the-supply-curve practice — prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05050c;font-family:'Nunito',sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;touch-action:none}
  #supply{transition:transform .16s cubic-bezier(.22,.61,.36,1);cursor:grab}
  #supply.grabbing{cursor:grabbing}
  .eq{transition:all .12s ease}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vig" cx="42%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0b0b1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="2000" height="1160">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#05050c"/>
  <g id="grid" stroke="#15152c" stroke-width="1.5"></g>

  <line x1="240" y1="120" x2="240" y2="820" stroke="#8a8ac0" stroke-width="3"/>
  <line x1="240" y1="820" x2="1240" y2="820" stroke="#8a8ac0" stroke-width="3"/>
  <text x="150" y="470" fill="#b8b8dc" font-size="26" font-weight="800" text-anchor="middle"
        transform="rotate(-90 150 470)">Price ($ per tonne)</text>
  <text x="740" y="892" fill="#b8b8dc" font-size="26" font-weight="800" text-anchor="middle">Quantity (tonnes)</text>
  <g id="ticks"></g>

  <!-- original equilibrium (faint reference) -->
  <circle id="eq0" cx="720" cy="295" r="9" fill="#8a8ac0" opacity="0.55"/>

  <!-- demand (fixed) -->
  <path d="M560 120 L1136 750" stroke="#ff5c8a" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <text x="1150" y="756" fill="#ff5c8a" font-size="30" font-weight="900">D</text>

  <!-- new equilibrium guides -->
  <line id="eqVX" class="eq" x1="720" y1="295" x2="720" y2="820" stroke="#ffd43b" stroke-width="3" stroke-dasharray="2 12" opacity="0"/>
  <line id="eqHY" class="eq" x1="240" y1="295" x2="720" y2="295" stroke="#ffd43b" stroke-width="3" stroke-dasharray="2 12" opacity="0"/>

  <!-- supply (draggable) -->
  <g id="supply">
    <path d="M304 750 L816 190" stroke="#00e5c0" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M304 750 L816 190" stroke="transparent" stroke-width="46" fill="none" stroke-linecap="round"/>
    <text x="836" y="196" fill="#00e5c0" font-size="30" font-weight="900">S</text>
  </g>

  <circle id="eqDot" class="eq" cx="720" cy="295" r="11" fill="#ffd43b" filter="url(#glow)" opacity="0"/>

  <!-- right-hand panel -->
  <text x="1660" y="220" fill="#8a8ac0" font-size="26" font-weight="800" text-anchor="middle">SUPPLY &amp; DEMAND · SHIFTS</text>
  <text x="1660" y="300" fill="#e8e8ff" font-size="40" font-weight="900" text-anchor="middle">Drag the supply curve</text>
  <text x="1660" y="352" fill="#8a8ac0" font-size="26" font-weight="700" text-anchor="middle">left = decrease · right = increase</text>

  <text id="dir"  x="1660" y="470" fill="#00e5c0" font-size="40" font-weight="900" text-anchor="middle">Supply unchanged</text>
  <text id="pOut" x="1660" y="560" fill="#ffd43b" font-size="46" font-weight="900" text-anchor="middle">Price:  $15</text>
  <text id="qOut" x="1660" y="626" fill="#ff5c8a" font-size="46" font-weight="900" text-anchor="middle">Quantity:  15 t</text>

  <g id="resetBtn" style="cursor:pointer">
    <rect x="1560" y="740" width="200" height="60" rx="12" fill="#12122a" stroke="#3a3a68" stroke-width="2"/>
    <text x="1660" y="780" fill="#e8e8ff" font-size="26" font-weight="800" text-anchor="middle">Reset</text>
  </g>

  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>

<script>
  const svg = document.getElementById('svg');
  const OX = 240, OY = 820, SX = 32, SY = 35;
  const gx = q => OX + q * SX, gy = p => OY - p * SY;
  const QMAX = 30, PMAX = 20, STEP = 1, MINS = -10, MAXS = 10;   // shift range in tonnes

  // gridlines + ticks
  let g = '';
  for (let q = 0; q <= QMAX; q += 5) g += `<line x1="${gx(q)}" y1="120" x2="${gx(q)}" y2="820"/>`;
  for (let p = 0; p <= PMAX; p += 5) g += `<line x1="240" y1="${gy(p)}" x2="1240" y2="${gy(p)}"/>`;
  document.getElementById('grid').innerHTML = g;
  let t = '';
  for (let q = 0; q <= QMAX; q += 5) t += `<text x="${gx(q)}" y="858" fill="#8a8ac0" font-size="24" font-weight="700" text-anchor="middle">${q}</text>`;
  for (let p = 0; p <= PMAX; p += 5) t += `<text x="222" y="${gy(p)+8}" fill="#8a8ac0" font-size="24" font-weight="700" text-anchor="end">$${p}</text>`;
  document.getElementById('ticks').innerHTML = t;

  const supply = document.getElementById('supply');
  const eqDot = document.getElementById('eqDot'), eqVX = document.getElementById('eqVX'), eqHY = document.getElementById('eqHY');
  const dir = document.getElementById('dir'), pOut = document.getElementById('pOut'), qOut = document.getElementById('qOut');
  const fmt = n => Number.isInteger(n) ? n : n.toFixed(1);

  let shift = 0, dragging = false, startX = 0, startShift = 0;

  function toSvgX(evt) {
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  }
  function apply() {
    supply.setAttribute('transform', `translate(${shift * SX},0)`);
    // new supply P = Q - shift ; with D: P = 30 - Q  ->  Q* = (30+shift)/2
    const Q = (30 + shift) / 2, P = (30 - shift) / 2;
    const x = gx(Q), y = gy(P);
    const on = shift !== 0;
    [eqDot, eqVX, eqHY].forEach(e => e.setAttribute('opacity', on ? 1 : 0));
    eqDot.setAttribute('cx', x); eqDot.setAttribute('cy', y);
    eqVX.setAttribute('x1', x); eqVX.setAttribute('x2', x); eqVX.setAttribute('y1', y);
    eqHY.setAttribute('x2', x); eqHY.setAttribute('y1', y); eqHY.setAttribute('y2', y);
    dir.textContent = shift > 0 ? `Supply increased  (+${shift} t)` :
                      shift < 0 ? `Supply decreased  (${shift} t)` : 'Supply unchanged';
    dir.setAttribute('fill', shift > 0 ? '#00e5c0' : shift < 0 ? '#ff8c42' : '#8a8ac0');
    pOut.textContent = `Price:  $${fmt(P)}`;
    qOut.textContent = `Quantity:  ${fmt(Q)} t`;
  }

  supply.addEventListener('pointerdown', e => {
    e.preventDefault(); supply.setPointerCapture(e.pointerId);
    dragging = true; startX = toSvgX(e); startShift = shift; supply.classList.add('grabbing');
  });
  supply.addEventListener('pointermove', e => {
    if (!dragging) return;
    const d = Math.round((toSvgX(e) - startX) / (SX * STEP)) * STEP;
    shift = Math.max(MINS, Math.min(MAXS, startShift + d));
    apply();
  });
  supply.addEventListener('pointerup', () => { dragging = false; supply.classList.remove('grabbing'); });

  document.getElementById('resetBtn').addEventListener('click', () => { shift = 0; apply(); });
  apply();
</script>
</body>
</html>
