<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Tariff Explainer — Theory2Econ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05050c; height:100%; overflow:hidden; font-family:'Nunito',system-ui,sans-serif; }

  #stage {
    position:absolute; top:50%; left:50%;
    width:1920px; height:1080px;
    transform:translate(-50%,-50%) scale(var(--s,1));
    transform-origin:center center;
  }
  svg { display:block; width:1920px; height:1080px; }

  /* hidden -> revealed at full neon (.hot) -> settles back (.on).
     Opacity, not CSS filter: a CSS filter overrides filter="url(#glow)". */
  .el     { opacity:0; transition:opacity .75s ease; }
  .el.on  { opacity:.62; }
  .el.hot { opacity:1; }
  .keep.on{ opacity:.85; }

  /* Every glow filter is filterUnits="userSpaceOnUse". With the default,
     a HORIZONTAL line has a zero-height bbox, the filter region collapses,
     and the element renders completely invisible. */
  .draw    { transition:stroke-dashoffset 1.15s cubic-bezier(.22,.61,.36,1); }
  .draw.on { stroke-dashoffset:0 !important; }
  .trace.on{ transition:stroke-dashoffset 1.6s cubic-bezier(.4,.2,.2,1); }
  .quick.on{ transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.3,1); }
  .slow.on { transition:stroke-dashoffset 2.3s cubic-bezier(.42,.1,.25,1); }

  /* Bars and revenue boxes are driven explicitly from render() so they can
     extend, shrink and DISAPPEAR — the cumulative .el model can't hide. */
  #dsbar  { transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.3,1), opacity .55s; }
  #impbar { transition:stroke-dasharray  .9s  cubic-bezier(.3,.7,.3,1), opacity .55s; }
  #dmbar  { transition:stroke-dasharray  .9s  cubic-bezier(.3,.7,.3,1),
                       stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1), opacity .55s; }
  .barlab { opacity:0; transition:opacity .55s ease, transform .9s cubic-bezier(.3,.7,.3,1); }
  .revbox { opacity:0; transition:opacity .8s ease; }
  .sumbox { opacity:0; transition:opacity .6s ease; }

  #pwtick, #pttick { transition:fill .7s ease, filter .7s ease; }
  #pwtick.lit { fill:#ffd43b; filter:drop-shadow(0 0 7px rgba(255,212,59,.9)); }
  #pttick.lit { fill:#ff8c42; filter:drop-shadow(0 0 7px rgba(255,140,66,.9)); }

  .rise    { transform:translateY(132px); transition:transform 1.3s cubic-bezier(.34,1.16,.64,1), opacity .75s; }
  .rise.on { transform:translateY(0); }

  .row    { opacity:0; transform:translateX(18px); transition:opacity .45s ease, transform .45s ease; }
  .row.on { opacity:1; transform:translateX(0); }
  .flash  { animation:flash 1.1s ease-out; }
  @keyframes flash { 0%{opacity:.2} 30%{opacity:1} 100%{opacity:1} }

  .cap    { opacity:0; transition:opacity .45s ease; }
  .cap.on { opacity:.9; }

  #bar { position:fixed; left:16px; bottom:14px; z-index:5; display:flex; align-items:center; gap:10px;
         background:#0d0d1c; border:1.5px solid #23233f; border-radius:12px; padding:7px 10px;
         font-family:'Nunito',sans-serif; transition:opacity .3s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar button { width:36px; height:32px; border:1.5px solid #2e2e52; background:#15152a; color:#c9c9e8;
                border-radius:8px; font-size:15px; font-weight:900; cursor:pointer; font-family:inherit;
                transition:background .15s, border-color .15s, color .15s; }
  #bar button:hover:not(:disabled) { background:#23233f; color:#fff; border-color:#4a4a7a; }
  #bar button:disabled { opacity:.28; cursor:default; }
  #num  { color:#ffd43b; font-size:16px; font-weight:900; min-width:60px; text-align:center; }
  #lbl  { color:#5a5a80; font-size:12.5px; font-weight:700; max-width:540px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
          color:#33334d; font-size:13px; font-weight:800; user-select:none; transition:opacity .3s; }
  #hint.hide { opacity:0; }
</style>
</head>
<body>

<div id="stage">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- cross-hatch, one per actor -->
    <pattern id="hatchG" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(0,229,192,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#00e5c0" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchY" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(255,212,59,0.12)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#ffd43b" stroke-width="1.6" opacity="0.8"/>
    </pattern>
    <pattern id="hatchO" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="13" fill="rgba(255,140,66,0.13)"/>
      <line x1="0" y1="0" x2="0"  y2="13" stroke="#ff8c42" stroke-width="1.7" opacity="0.85"/>
      <line x1="0" y1="0" x2="13" y2="0"  stroke="#ff8c42" stroke-width="1.7" opacity="0.85"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="45%" r="78%">
      <stop offset="62%"  stop-color="#05050c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000"    stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#05050c"/>

  <g id="grid" class="el keep" stroke="#15152c" stroke-width="1.5"></g>

  <!-- ══ revenue boxes sit UNDER the axes and curves so the lines stay crisp ══
       86px = 10,000 tonnes · 66px = $100
       revDom1  172x132 = 20,000 x $200 = $4m
       revImp1  516x132 = 60,000 x $200 = $12m
       revDom2  344x264 = 40,000 x $400 = $16m
       revTar   172x132 = 20,000 x $200 = $4m   (tariff)
       revImp2  172x132 = 20,000 x $200 = $4m   (importers keep — stacks under the tariff) -->
  <!-- P x Q: the green box's two edges. Height 132px = $200 (yellow, the price),
       width 172px = 20,000 t (green, the quantity). Both zero-thickness bboxes —
       they only render because the filters are pinned to user space. -->
  <path id="pq1v" class="el draw quick" d="M320 830 L320 698" stroke="#ffd43b" stroke-width="12"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="pq1h" class="el draw quick" d="M320 830 L492 830" stroke="#00e5c0" stroke-width="12"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="pqlab" class="el">
    <text x="346" y="764" fill="#ffd43b" font-size="19" font-weight="900" text-anchor="middle"
          transform="rotate(-90 346 764)">PRICE  $200</text>
    <text x="406" y="818" fill="#00e5c0" font-size="19" font-weight="900" text-anchor="middle">QUANTITY  20,000</text>
  </g>

  <g id="revDom1" class="revbox">
    <rect x="320" y="698" width="172" height="132" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
    <rect x="372" y="748" width="68" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="406" y="773" fill="#7dffe8" font-size="24" font-weight="900" text-anchor="middle">$4m</text>
  </g>
  <g id="revImp1" class="revbox">
    <rect x="492" y="698" width="516" height="132" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
    <rect x="710" y="748" width="80" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="750" y="773" fill="#ffe680" font-size="24" font-weight="900" text-anchor="middle">$12m</text>
  </g>
  <g id="revDom2" class="revbox">
    <rect x="320" y="566" width="344" height="264" fill="url(#hatchG)" stroke="#00e5c0" stroke-width="3.5"/>
    <rect x="450" y="748" width="84" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="492" y="773" fill="#7dffe8" font-size="24" font-weight="900" text-anchor="middle">$16m</text>
  </g>
  <g id="revTar" class="revbox">
    <rect x="664" y="566" width="172" height="132" fill="url(#hatchO)" stroke="#ff8c42" stroke-width="4"/>
    <rect x="714" y="614" width="72" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="750" y="639" fill="#ffb37a" font-size="24" font-weight="900" text-anchor="middle">$4m</text>
  </g>
  <g id="revImp2" class="revbox">
    <rect x="664" y="698" width="172" height="132" fill="url(#hatchY)" stroke="#ffd43b" stroke-width="3.5"/>
    <rect x="716" y="748" width="68" height="36" rx="9" fill="#05050c" opacity="0.85"/>
    <text x="750" y="773" fill="#ffe680" font-size="24" font-weight="900" text-anchor="middle">$4m</text>
  </g>

  <g id="axes" class="el keep">
    <line x1="320" y1="830" x2="1250" y2="830" stroke="#3a3a5e" stroke-width="3"/>
    <line x1="320" y1="830" x2="320"  y2="150" stroke="#3a3a5e" stroke-width="3"/>
    <text x="132" y="500" fill="#8b8bb0" font-size="24" font-weight="800"
          text-anchor="middle" transform="rotate(-90 132 500)">Price ($ per tonne)</text>
    <text x="1196" y="812" fill="#8b8bb0" font-size="22" font-weight="800">Quantity (000 tonnes)</text>
    <g id="ticks" fill="#61618a" font-size="21" font-weight="700"></g>
  </g>

  <g id="title" class="el keep">
    <text x="960" y="66" fill="#e8e8ff" font-size="38" font-weight="900" text-anchor="middle"
          filter="url(#glowSoft)">The market for <tspan fill="#00e5c0">steel</tspan></text>
  </g>

  <path id="scurve" class="el keep draw" d="M406 764 L1094 236" stroke="#00e5c0" stroke-width="5"
        fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="dcurve" class="el keep draw" d="M406 236 L1094 764" stroke="#ff5c8a" stroke-width="5"
        fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <path id="pwline" class="el keep draw" d="M320 698 L1240 698" fill="none" stroke="#ffd43b"
        stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <g id="curvelabs" class="el keep">
    <text x="1110" y="230" fill="#00e5c0" font-size="30" font-weight="900" filter="url(#glowSoft)">S</text>
    <text x="1110" y="774" fill="#ff5c8a" font-size="30" font-weight="900" filter="url(#glowSoft)">D</text>
    <text x="1252" y="706" fill="#ffd43b" font-size="24" font-weight="900" filter="url(#glowSoft)">World price</text>
  </g>

  <path id="trace1" class="el draw trace" d="M406 764 L492 698" stroke="#00e5c0" stroke-width="11"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom1" class="el">
    <circle cx="492" cy="698" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="492" y1="698" x2="492" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace2" class="el draw trace" d="M492 698 L1008 698" fill="none" stroke="#ffd43b"
        stroke-width="11" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem1" class="el">
    <circle cx="1008" cy="698" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="1008" y1="698" x2="1008" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <g id="pt" class="el keep rise">
    <line x1="320" y1="566" x2="1240" y2="566" stroke="#ff8c42" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <text x="1252" y="574" fill="#ff8c42" font-size="24" font-weight="900" filter="url(#glowSoft)">Price + tariff</text>
  </g>
  <!-- the tariff IS this vertical gap. Zero-width bbox — only renders because
       the glow filters are filterUnits="userSpaceOnUse". -->
  <path id="tvert" class="el draw trace" d="M330 698 L330 566" stroke="#ff8c42" stroke-width="12"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="tsize" class="el">
    <path d="M350 698 L330 698 L330 566 L350 566" fill="none" stroke="#ff8c42" stroke-width="3.5"/>
    <text x="362" y="622" fill="#ff8c42" font-size="23" font-weight="900">$200</text>
    <text x="362" y="648" fill="#ff8c42" font-size="19" font-weight="800" opacity="0.8">tariff</text>
  </g>

  <path id="trace3" class="el draw trace" d="M492 698 L664 566" stroke="#00e5c0" stroke-width="11"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dom2" class="el">
    <circle cx="664" cy="566" r="10" fill="#00e5c0" filter="url(#glow)"/>
    <line x1="664" y1="566" x2="664" y2="830" stroke="#00e5c0" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <path id="trace4" class="el draw trace" d="M1008 698 L836 566" stroke="#ff5c8a" stroke-width="11"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <g id="dem2" class="el">
    <circle cx="836" cy="566" r="10" fill="#ff5c8a" filter="url(#glow)"/>
    <line x1="836" y1="566" x2="836" y2="830" stroke="#ff5c8a" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <!-- the squeeze: yellow import line at the world price, closing from BOTH ends.
       492->664 is what the mills take; 1008->836 is what buyers stop buying.
       Ends at 664-836 — exactly the tariff box's bottom edge. -->
  <path id="impsqueeze" d="M320 698 L1240 698" fill="none" stroke="#ffd43b" stroke-width="13"
        stroke-linecap="butt" filter="url(#glowBig)" opacity="0"/>

  <!-- closing tracers: the FULL climb up each curve to $400, not just the
       segment above the world price. Both 325px — mirror images. -->
  <path id="trace5" class="el draw slow" d="M406 764 L664 566" stroke="#00e5c0" stroke-width="14"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>
  <path id="trace6" class="el draw slow" d="M1094 764 L836 566" stroke="#ff5c8a" stroke-width="14"
        fill="none" stroke-linecap="round" filter="url(#glowBig)"/>

  <path id="imp2" class="el draw" d="M664 566 L836 566" fill="none" stroke="#ff8c42" stroke-width="11"
        stroke-linecap="round" filter="url(#glowBig)"/>

  <!-- below the axis: production + imports = total demand -->
  <path id="impbar" d="M320 876 L1008 876" fill="none" stroke="#ffd43b" stroke-width="8"
        stroke-linecap="butt" filter="url(#glow)" opacity="0"/>
  <path id="dsbar"  d="M320 876 L664 876"  fill="none" stroke="#00e5c0" stroke-width="8"
        stroke-linecap="butt" filter="url(#glow)" opacity="0"/>
  <path id="dmbar"  d="M320 972 L1008 972" fill="none" stroke="#ff5c8a" stroke-width="8"
        stroke-linecap="butt" filter="url(#glow)" opacity="0"/>

  <g id="dslab" class="barlab">
    <text id="dsval" x="406" y="904" fill="#00e5c0" font-size="22" font-weight="900" text-anchor="middle">20,000</text>
    <text x="406" y="928" fill="#00e5c0" font-size="18" font-weight="800" text-anchor="middle" opacity="0.75">Domestic production</text>
  </g>
  <g id="implab" class="barlab">
    <text id="impval" x="750" y="904" fill="#ffd43b" font-size="22" font-weight="900" text-anchor="middle">60,000</text>
    <text x="750" y="928" fill="#ffd43b" font-size="18" font-weight="800" text-anchor="middle" opacity="0.75">Imports</text>
  </g>
  <g id="dmlab" class="barlab">
    <text id="dmval" x="664" y="1000" fill="#ff5c8a" font-size="22" font-weight="900" text-anchor="middle">80,000</text>
    <text x="664" y="1024" fill="#ff5c8a" font-size="18" font-weight="800" text-anchor="middle" opacity="0.75">Total demand</text>
  </g>

  <!-- closing cards: the three effects. Boxes are cleared on 15-16 so only
       the curves remain; the tariff box returns alone on 17. -->
  <g id="sumPrice" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ff8c42">1.  </tspan><tspan fill="#ff8c42">A HIGHER PRICE</tspan></text>
  </g>
  <g id="sumDemand" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ff5c8a">2.  </tspan><tspan fill="#ff5c8a">A CONTRACTION IN DEMAND</tspan></text>
  </g>
  <g id="sumRev" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ff8c42">3.  </tspan><tspan fill="#ff8c42">TARIFF REVENUE</tspan></text>
  </g>


  <g id="panel">
    <g id="r-price" class="row">
      <text x="1480" y="212" fill="#61618a" font-size="20" font-weight="800">PRICE</text>
      <text id="v-price" x="1480" y="256" fill="#ffd43b" font-size="36" font-weight="900" filter="url(#glowSoft)">$200</text>
    </g>
    <g id="r-dom" class="row">
      <text x="1480" y="336" fill="#61618a" font-size="20" font-weight="800">DOMESTIC PRODUCTION</text>
      <text id="v-dom" x="1480" y="380" fill="#00e5c0" font-size="36" font-weight="900" filter="url(#glowSoft)">20,000</text>
    </g>
    <g id="r-imp" class="row">
      <text x="1480" y="460" fill="#61618a" font-size="20" font-weight="800">IMPORTS</text>
      <text id="v-imp" x="1480" y="504" fill="#ffd43b" font-size="36" font-weight="900" filter="url(#glowSoft)">60,000</text>
    </g>
    <g id="r-dem" class="row">
      <text x="1480" y="584" fill="#61618a" font-size="20" font-weight="800">TOTAL DEMAND</text>
      <text id="v-dem" x="1480" y="628" fill="#ff5c8a" font-size="36" font-weight="900" filter="url(#glowSoft)">80,000</text>
    </g>
    <g id="r-rev" class="row">
      <text x="1480" y="708" fill="#61618a" font-size="20" font-weight="800">TARIFF REVENUE</text>
      <text id="v-rev" x="1480" y="752" fill="#ff8c42" font-size="36" font-weight="900" filter="url(#glowSoft)">$4 million</text>
      <text x="1480" y="788" fill="#7a7aa8" font-size="21" font-weight="800">$200 × 20,000</text>
    </g>
  </g>

  <g id="sumImp" class="sumbox">
    <text x="750" y="944" font-size="33" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#ffd43b">4.  </tspan><tspan fill="#ffd43b">A REDUCTION IN IMPORTS</tspan></text>
  </g>

  <!-- ══ 19 — closing slide: generic, succinct, all neon. The diagram blacks out. ══ -->
  <rect id="blackout" width="1920" height="1080" fill="#05050c" opacity="0"
        style="transition:opacity .8s ease" pointer-events="none"/>
  <g id="impact" class="sumbox">
    <text x="960" y="196" font-size="52" font-weight="900" text-anchor="middle" filter="url(#glowSoft)"><tspan fill="#e8e8ff">The impact of a </tspan><tspan fill="#ff8c42">tariff</tspan></text>

    <line x1="380" y1="268" x2="1540" y2="268" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="392" fill="#ff5c8a" font-size="34" font-weight="900" filter="url(#glowSoft)">HOUSEHOLDS</text>
    <text x="880" y="392" fill="#ff5c8a" font-size="34" font-weight="800" filter="url(#glowSoft)">Higher prices</text>

    <line x1="380" y1="466" x2="1540" y2="466" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="612" fill="#00e5c0" font-size="34" font-weight="900" filter="url(#glowSoft)">FIRMS</text>

    <!-- the domestic/foreign split, made visible -->
    <path d="M866 528 L850 528 L850 630 L866 630" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="832" y="588" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">DOMESTIC</text>

    <text x="884" y="558" fill="#00e5c0" font-size="34" font-weight="800" filter="url(#glowSoft)">Import-competing firms — higher revenue</text>
    <text x="884" y="620" fill="#ff8c42" font-size="34" font-weight="800" filter="url(#glowSoft)">Firms using it as an input — higher costs</text>

    <text x="832" y="700" fill="#e8e8ff" font-size="24" font-weight="900" text-anchor="end" filter="url(#glowSoft)">FOREIGN</text>
    <path d="M866 676 L850 676 L850 712 L866 712" fill="none" stroke="#8b8bb0" stroke-width="3"/>
    <text x="884" y="700" fill="#ff5c8a" font-size="34" font-weight="800" filter="url(#glowSoft)">Foreign firms — lower revenue</text>

    <line x1="380" y1="768" x2="1540" y2="768" stroke="#23233f" stroke-width="2"/>

    <text x="420" y="880" fill="#ff8c42" font-size="34" font-weight="900" filter="url(#glowSoft)">GOVERNMENT</text>
    <text x="880" y="880" fill="#ff8c42" font-size="34" font-weight="800" filter="url(#glowSoft)">Tariff revenue</text>
  </g>

  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>

<div id="bar">
  <button id="prev" title="Back (left arrow)">←</button>
  <span id="num">0 / 19</span>
  <button id="next" title="Next (space / right arrow)">→</button>
  <span id="lbl"></span>
</div>

<div id="hint">SPACE / CLICK → next · ← back · R restart · H hide toolbar</div>

<script>
// grid 0..10 both axes. Price unit $100, quantity unit 10,000 tonnes.
// supply P=Q, demand P=10-Q. World price grid 2 ($200); +$200 tariff -> grid 4 ($400).
//   free trade : dom 2 (20k) | demand 8 (80k) | imports 6 (60k)
//   with tariff: dom 4 (40k) | demand 6 (60k) | imports 2 (20k)
const gx = q => 320 + q * 86;
const gy = p => 830 - p * 66;

let g = '';
for (let i = 0; i <= 10; i++) {
  g += `<line x1="${gx(i)}" y1="${gy(0)}" x2="${gx(i)}" y2="${gy(10)}"/>`;
  g += `<line x1="${gx(0)}" y1="${gy(i)}" x2="${gx(10)}" y2="${gy(i)}"/>`;
}
document.getElementById('grid').innerHTML = g;

let t = '';
for (let i = 1; i <= 10; i++) {
  const id = i === 2 ? 'id="pwtick" ' : (i === 4 ? 'id="pttick" ' : '');
  t += `<text ${id}x="300" y="${gy(i) + 7}" text-anchor="end">$${i * 100}</text>`;
  t += `<text x="${gx(i)}" y="858" text-anchor="middle">${i * 10}</text>`;
}
document.getElementById('ticks').innerHTML = t;

document.querySelectorAll('.draw').forEach(el => {
  const len = el.getTotalLength();
  el.style.strokeDasharray = len;
  el.style.strokeDashoffset = len;
});

const NUMS = { dsval:20000, impval:60000, dmval:80000 };
function tweenNum(el, from, to, ms) {
  const t0 = performance.now();
  (function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = (Math.round((from + (to - from) * e) / 1000) * 1000).toLocaleString('en-US');
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function setNum(id, v) {
  if (NUMS[id] === v) return;
  tweenNum(document.getElementById(id), NUMS[id], v, 900);
  NUMS[id] = v;
}

const STAGES = [
  { cap:'', show:['grid','axes','title'] },

  { cap:'Steel: domestic supply, domestic demand, and a world price of $200.',
    show:['scurve','dcurve','pwline','curvelabs'], set:{'v-price':'$200'}, rows:['r-price'] },

  { cap:'At $200, domestic mills produce 20,000 tonnes.',
    show:['trace1','dom1'], set:{'v-dom':'20,000'}, rows:['r-dom'] },

  { cap:'Buyers want 80,000 — the 60,000 gap is imported.',
    show:['trace2','dem1'], set:{'v-dem':'80,000','v-imp':'60,000'}, rows:['r-imp','r-dem'] },

  { cap:'Domestic producer revenue: $200 × 20,000 = $4 million.', show:[] },

  { cap:'Revenue is price × quantity — the height and the width of that box.',
    show:['pq1v','pq1h','pqlab'], replay:['pq1v','pq1h'] },

  { cap:'Import spending: $200 × 60,000 = $12 million.', show:[] },

  { cap:'A $200 tariff is imposed. The price rises to $400.',
    show:['pt'], set:{'v-price':'$400'} },

  { cap:'The tariff is that vertical gap: $400 − $200 = $200 a tonne.',
    show:['tvert','tsize'], replay:['tvert'] },

  { cap:'Mills move up the supply curve — production rises to 40,000.',
    show:['trace3','dom2'], set:{'v-dom':'40,000'} },

  { cap:'Buyers move up the demand curve — demand contracts to 60,000.',
    show:['trace4','dem2'], set:{'v-dem':'60,000'} },

  { cap:'Squeezed from both ends, imports fall to 20,000.',
    show:['imp2'], set:{'v-imp':'20,000'} },

  { cap:'Tariff revenue: $200 × 20,000 = $4 million.',
    show:[], rows:['r-rev'] },

  { cap:'Domestic producer revenue quadruples: $400 × 40,000 = $16 million.', show:[] },

  { cap:'Importers keep just $4 million — the tariff takes the rest.', show:[] },

  { cap:'', show:['trace5','dom2'], replay:['trace5'] },
  { cap:'', show:['trace6','dem2'], replay:['trace6'] },
  { cap:'', show:['tvert','imp2'], replay:['tvert','imp2'] },

  { cap:'', show:[] },

  { cap:'', show:[] },
];

// revenue boxes. A window isn't enough: stages 15-16 clear every box to leave
// just the curves, then the tariff box returns alone on 17.
const BOXVIS = {
  revDom1: t => t >= 4 && t <= 6,
  revImp1: t => t === 6,
  revDom2: t => t >= 13 && t <= 14,
  revTar : t => (t >= 12 && t <= 14) || t === 17 || t === 18,
  revImp2: t => t === 14,
};
const BOXHOT = { revDom1:[4], revImp1:[6], revDom2:[13], revTar:[12,17], revImp2:[14] };

let cur = -1;

function render(target) {
  const shown = new Set(), rows = new Set(), vals = {};
  for (let i = 0; i <= target; i++) {
    const s = STAGES[i];
    (s.show || []).forEach(id => shown.add(id));
    (s.rows || []).forEach(id => rows.add(id));
    Object.assign(vals, s.set || {});
  }
  const hot = new Set(STAGES[target] ? (STAGES[target].show || []) : []);

  document.querySelectorAll('.el').forEach(el => {
    const on = shown.has(el.id);
    el.classList.toggle('on', on);
    el.classList.toggle('hot', hot.has(el.id));
    el.querySelectorAll('.draw').forEach(d => d.classList.toggle('on', on));
  });
  document.querySelectorAll('.row').forEach(el => el.classList.toggle('on', rows.has(el.id)));

  (STAGES[target] && STAGES[target].replay || []).forEach(id => {
    const e = document.getElementById(id);
    e.classList.remove('on');
    void e.getBoundingClientRect();
    requestAnimationFrame(() => e.classList.add('on'));
  });

  // revenue boxes — full neon on the stage that introduces them, then dull
  for (const [id, vis] of Object.entries(BOXVIS)) {
    const on = vis(target);
    document.getElementById(id).style.opacity = on ? (BOXHOT[id].includes(target) ? 1 : 0.7) : 0;
  }

  // closing tracers live only on their own stage
  document.getElementById('trace5').style.opacity = (target === 15) ? 1 : 0;
  document.getElementById('trace6').style.opacity = (target === 16) ? 1 : 0;

  // P x Q edges: a quick beat, gone once the point has landed
  ['pq1v','pq1h','pqlab'].forEach(id => {
    document.getElementById(id).style.opacity = (target === 5) ? 1 : 0;
  });

  // the tariff-size highlight burns on its own stage and again for government, then fades
  document.getElementById('tvert').style.opacity = (target === 8 || target === 17) ? 1 : 0;

  document.getElementById('pwtick').classList.toggle('lit', target >= 1 && target <= 6);
  document.getElementById('pttick').classList.toggle('lit', target >= 7);

  // ── below-axis bars ──
  // stage 6 (the tariff) clears green + yellow but keeps pink;
  // stage 13+ clears the lot for the summary cards.
  const SUM = target >= 15;
  const showDs  = !SUM && ((target >= 2 && target <= 6) || target >= 9);
  const showImp = !SUM && ((target >= 3 && target <= 6) || target >= 11);
  const showDm  = !SUM && target >= 3;

  const ds = document.getElementById('dsbar');
  ds.style.opacity = showDs ? 1 : 0;
  ds.style.strokeDasharray = 344;
  ds.style.strokeDashoffset = target <= 6 ? 172 : (target === 7 ? 344 : 0);

  const ib = document.getElementById('impbar');
  ib.style.opacity = showImp ? 1 : 0;
  ib.style.strokeDasharray = target >= 11 ? '0 344 172 9999' : '0 172 516 9999';

  const dm = document.getElementById('dmbar');
  dm.style.opacity = showDm ? 1 : 0;
  dm.style.strokeDasharray  = target >= 10 ? '516 9999' : '688 9999';
  dm.style.strokeDashoffset = target >= 3 ? 0 : 688;

  const dsl = document.getElementById('dslab');
  dsl.style.opacity = showDs ? 1 : 0;
  dsl.style.transform = target >= 9 ? 'translateX(86px)' : 'translateX(0)';
  document.getElementById('implab').style.opacity = showImp ? 1 : 0;
  const dml = document.getElementById('dmlab');
  dml.style.opacity = showDm ? 1 : 0;
  dml.style.transform = target >= 10 ? 'translateX(-86px)' : 'translateX(0)';

  setNum('dsval',  target >= 9 ? 40000 : 20000);
  setNum('dmval',  target >= 10 ? 60000 : 80000);
  setNum('impval', target >= 11 ? 20000 : 60000);

  // the squeeze — both ends close in on the tariff box
  const sq = document.getElementById('impsqueeze');
  if (target === 18) {
    sq.style.opacity = 1;
    sq.style.transition = 'none';
    sq.style.strokeDasharray = '0 172 516 9999';   // 492 -> 1008  (60,000)
    void sq.getBoundingClientRect();
    requestAnimationFrame(() => {
      sq.style.transition = 'stroke-dasharray 2.4s cubic-bezier(.42,.1,.25,1)';
      sq.style.strokeDasharray = '0 344 172 9999'; // 664 ->  836  (20,000)
    });
  } else {
    sq.style.transition = 'opacity .5s ease';
    sq.style.opacity = 0;
  }
  document.getElementById('sumImp').style.opacity = target === 18 ? 1 : 0;

  // final slide: black the diagram out entirely and give the impacts the screen
  document.getElementById('blackout').style.opacity = target === 19 ? 0.94 : 0;
  document.getElementById('impact').style.opacity   = target === 19 ? 1 : 0;

  document.getElementById('sumPrice').style.opacity  = target === 15 ? 1 : 0;
  document.getElementById('sumDemand').style.opacity = target === 16 ? 1 : 0;
  document.getElementById('sumRev').style.opacity    = target === 17 ? 1 : 0;

  for (const [id, v] of Object.entries(vals)) {
    const el = document.getElementById(id);
    if (el.textContent !== v) {
      el.textContent = v;
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }

  const cap = STAGES[target] ? STAGES[target].cap : '';   // toolbar only — no on-screen caption

  const LBL = { 15:'EFFECT — higher price', 16:'EFFECT — demand contracts', 17:'EFFECT — tariff revenue', 18:'EFFECT — reduction in imports', 19:'CLOSING — impact by group' };
  document.getElementById('num').textContent = target + ' / ' + (STAGES.length - 1);
  document.getElementById('lbl').textContent = LBL[target] || cap || '(opening frame — axes only)';
  document.getElementById('prev').disabled = (target === 0);
  document.getElementById('next').disabled = (target === STAGES.length - 1);
}

function go(n) {
  n = Math.max(0, Math.min(STAGES.length - 1, n));
  if (n === cur) return;
  cur = n;
  render(cur);
}

document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); go(cur - 1); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); go(cur + 1); });
document.addEventListener('click', () => go(cur + 1));

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); go(cur + 1); }
  else if (e.code === 'ArrowLeft' || e.code === 'Backspace') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'r' || e.key === 'R') { cur = -1; NUMS.dsval=20000; NUMS.impval=60000; NUMS.dmval=80000; go(0); }
  else if (e.key === 'h' || e.key === 'H') {
    document.getElementById('hint').classList.toggle('hide');
    document.getElementById('bar').classList.toggle('hide');
  }
});

function fit() {
  document.getElementById('stage').style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
}
addEventListener('resize', fit);
fit();
go(0);
</script>

</body>
</html>
